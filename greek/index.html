<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theogony Atlas</title>
<style>
/* Six orders of being, six hues, taken from the Theogony Atlas reference and
   then validated. One hue moved by ΔE 0.7 — imperceptible — to clear the
   normal-vision floor against the blue. Both modes pass every hard gate on the
   all-pairs pairlist, which is the right test for a node graph since any two
   glyphs can end up side by side:

       light   CVD ΔE 8.0   normal-vision ΔE 15.3   contrast all >= 3:1
       dark    CVD ΔE 8.6   normal-vision ΔE 16.0   contrast all >= 3:1

   Three of the light hues sit just under the chroma floor (0.078–0.09 against
   0.10) — that is the reference's muted earth-tone character, and a soft check,
   not a gate. Shape carries all six orders independently, so identity never
   rests on hue alone. The dark steps are selected for the dark surface, not
   flipped from the light ones. */

:root {
  color-scheme: light;
  --surface:      #fcfcfb;
  --page:         #f9f9f7;
  --sunk:         #f2f1ed;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --muted:        #6e6c66;   /* 5.1:1 on --surface — #898781 sat at 3.5:1 */
  --grid:         #e1e0d9;
  --rule:         #c3c2b7;
  --border:       rgba(11, 11, 11, 0.10);
  --wash:         rgba(11, 11, 11, 0.045);

  --hue-primordial: #805dbe;
  --hue-titan:      #744c17;
  --hue-olympian:   #285b87;
  --hue-hero:       #c3606b;
  --hue-mortal:     #4490a0;
  --hue-monster:    #578124;

  --tie-violence:   #e34948;
  --tie-bond:       #1baf7a;
  --tie-line:       #2f2f2c;
  --tie-object:     #9a6a12;
  --tie-place:      #3d6b86;
  --tie-union:      #7d6394;
  --mention-glow:   #b8860b;
  --tie-object-faint: #9c8f77;
  --tie-place-faint:  #6f8593;

  --band-a: rgba(11, 11, 11, 0.022);
  --band-b: rgba(11, 11, 11, 0.055);

  --shadow: 0 1px 2px rgba(11,11,11,.06), 0 8px 24px rgba(11,11,11,.07);
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface:   #1a1a19;
    --page:      #0d0d0d;
    --sunk:      #141413;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --grid:      #2c2c2a;
    --rule:      #383835;
    --border:    rgba(255, 255, 255, 0.10);
    --wash:      rgba(255, 255, 255, 0.06);

    --hue-primordial: #9564e7;
    --hue-titan:      #915b07;
    --hue-olympian:   #216fad;
    --hue-hero:       #ea6073;
    --hue-mortal:     #2ea6bc;
    --hue-monster:    #609706;

    --tie-violence:   #e66767;
    --tie-bond:       #199e70;
    --tie-line:       #efeee6;
    --tie-object:     #d3a244;
    --tie-place:      #78aecb;
    --tie-union:      #a893c4;
    --mention-glow:   #e0b25a;
    --tie-object-faint: #9a8f75;
    --tie-place-faint:  #7d8f9b;

    --band-a: rgba(255, 255, 255, 0.022);
    --band-b: rgba(255, 255, 255, 0.055);

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface:   #1a1a19;
  --page:      #0d0d0d;
  --sunk:      #141413;
  --ink:       #ffffff;
  --ink-2:     #c3c2b7;
  --muted:     #898781;
  --grid:      #2c2c2a;
  --rule:      #383835;
  --border:    rgba(255, 255, 255, 0.10);
  --wash:      rgba(255, 255, 255, 0.06);

  --hue-primordial: #9564e7;
  --hue-titan:      #915b07;
  --hue-olympian:   #216fad;
  --hue-hero:       #ea6073;
  --hue-mortal:     #2ea6bc;
  --hue-monster:    #609706;

  --tie-violence:   #e66767;
  --tie-bond:       #199e70;
  --tie-line:       #efeee6;
  --tie-object:     #d3a244;
  --tie-place:      #78aecb;
  --tie-union:      #a893c4;
  --mention-glow:   #e0b25a;
  --tie-object-faint: #9a8f75;
  --tie-place-faint:  #7d8f9b;

  --band-a: rgba(255, 255, 255, 0.022);
  --band-b: rgba(255, 255, 255, 0.055);

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

/* ------------------------------------------------------------------ header */

header { border-bottom: 1px solid var(--border); background: var(--surface); }

.masthead {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
  padding: 16px 20px 12px;
}

h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.sub { color: var(--ink-2); font-size: 13px; margin: 0; }
.count { color: var(--muted); font-size: 12px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-left: auto; }

.btn {
  height: 28px;
  padding: 0 11px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--ink-2);
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--wash); color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--hue-olympian); outline-offset: 1px; }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; }
.seg .btn[aria-pressed="true"] { background: var(--wash); color: var(--ink); }

/* ------------------------------------------------------------------ legend */

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  padding: 0 20px 11px;
  font-size: 12px;
  color: var(--ink-2);
  align-items: center;
}
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.legend .sep { color: var(--muted); opacity: .6; }
.legend .cap {
  color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
}

/* -------------------------------------------------------------------- main */

main { flex: 1; display: flex; min-height: 0; }

/* ------------------------------------------------------------------ roster */

.roster.collapsed { display: none; }

/* the roster's own edge, rather than a word in the toolbar */
.rail {
  flex: none; width: 18px; padding: 0;
  border: 0; border-right: 1px solid var(--border);
  background: var(--surface); color: var(--muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.rail:hover { background: var(--wash); color: var(--ink); }
.rail:focus-visible { outline: 2px solid var(--hue-olympian); outline-offset: -2px; }
.rail[aria-pressed="false"] svg { transform: scaleX(-1); }

.roster {
  width: 246px;
  flex: none;
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.roster-search { position: relative; padding: 12px 14px 10px; }

.roster-search input {
  width: 100%;
  height: 30px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--page);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
}
.roster-search input:focus-visible { outline: 2px solid var(--hue-olympian); outline-offset: 1px; }
.roster-search kbd {
  position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
  font: 11px/1 system-ui, sans-serif; color: var(--muted); pointer-events: none;
}

.orders {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 0 14px 10px;
}
.rowcap {
  width: 100%; margin: 0 0 3px;
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); font-weight: 600;
}

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 8px;
  border: 1px solid var(--border); border-radius: 12px;
  background: transparent; color: var(--ink-2);
  font: inherit; font-size: 11.5px; cursor: pointer;
}
.chip:hover { background: var(--wash); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--rule); background: var(--wash); }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip:focus-visible { outline: 2px solid var(--hue-olympian); outline-offset: 1px; }

.orders.ties {
  padding-top: 9px;
  border-top: 1px dashed var(--border);
  border-bottom: 1px solid var(--border);
}

.roster-list { flex: 1; overflow-y: auto; padding: 6px 0 30px; }

.roster-group {
  padding: 12px 14px 5px;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); font-weight: 600;
}

.roster-row {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  padding: 4px 14px;
  border: 0; background: transparent;
  color: var(--ink-2); font: inherit; font-size: 13px;
  cursor: pointer; text-align: left;
}
.roster-row:hover { background: var(--wash); color: var(--ink); }
.roster-row[aria-current="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.roster-row:focus-visible { outline: 2px solid var(--hue-olympian); outline-offset: -2px; }
.roster-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster-row .ct { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.roster-empty { padding: 20px 14px; color: var(--muted); font-size: 12.5px; }

/* ------------------------------------------------------------------- stage */

.stage-wrap { position: relative; flex: 1; min-width: 0; background: var(--surface); overflow: hidden; }

svg#stage {
  width: 100%; height: 100%; display: block; cursor: grab; touch-action: none;
  /* double-clicking to isolate a line was selecting the labels underneath */
  user-select: none; -webkit-user-select: none;
}
svg#stage.dragging { cursor: grabbing; }

.band { fill: var(--band-a); }
.band.alt { fill: var(--band-b); }
.bandlabel { fill: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.bandnum { fill: var(--muted); font-size: 10px; opacity: .7; font-variant-numeric: tabular-nums; }

.rowline, .rowlabel, .band, .bandlabel, .bandnum, .edge, .gutterline { pointer-events: none; }
.pane-bg { fill: var(--sunk); pointer-events: none; }
.paneline { stroke: var(--border); stroke-width: 1; pointer-events: none; }
.panecap {
  fill: var(--muted); font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
  font-weight: 600; pointer-events: none;
}
.sidelabel, .pane-bg, .paneline, .panecap, .panemore { pointer-events: none; }
.panemore {
  fill: var(--muted); font-size: 9px; letter-spacing: 0.03em; opacity: .8;
  paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round;
}

/* pane entries read outward from their mark: objects rightward, places leftward */
#sidenodes .node.item .label  { text-anchor: start; }
#sidenodes .node.place .label { text-anchor: end; }
#sidenodes .node .label { fill: var(--ink-2); font-style: normal; }
#sidenodes .node.item .glyph  { stroke: var(--tie-object); }
#sidenodes .node.place .glyph { stroke: var(--tie-place); }
/* grey, not tinted: the pane marks and dash patterns already say which kind
   this is, and these labels sit beneath the map rather than competing with it */
.sidelabel.item, .sidelabel.place { fill: var(--muted); }
.sidelabel.hot { opacity: 1; font-weight: 600; }
.sidelabel.item.hot  { fill: var(--tie-object); }
.sidelabel.place.hot { fill: var(--tie-place); }
#sidenodes .node.off .label { display: none !important; }
/* A pane entry scrolled past the top or bottom of its pane leaves LAYOUT, not
   just sight. There is one per thing — 1025 in dance — and while they had
   boxes, every getBoundingClientRect in the shell relaid the whole column.
   A class rather than an inline display: inline display already means
   "filtered out of the pane", which the connector drawer and the tests read. */
#sidenodes .node.culled { display: none; }
/* hovering a pane entry brings back its own name, whatever the chapter has
   dimmed it to — beating the rule above on specificity, not on order */
#sidenodes .node.peek .label { display: block !important; fill: var(--ink); }
.sideedge { fill: none; stroke-width: 0.9; opacity: 0; }
/* The real hue, dimmed by opacity rather than a pre-greyed variable: at 34%
   the two faint greys were the same grey, so a line running to a work and one
   running to a place looked alike until you followed them. */
.sideedge.item  { stroke: var(--tie-object); stroke-dasharray: 2 3; }
.sideedge.place { stroke: var(--tie-place);  stroke-dasharray: 4 3; }
.sideedge.on { opacity: .34; stroke-width: 0.9; }
.sideedge.off { opacity: 0; }
/* pointing at an object or a place: its own links come up to full colour, and
   the rest of the bundle drops back so the promoted one can be followed */
.sideedge.hot { opacity: .95; stroke-width: 1.6; }
.sideedge.item.hot  { stroke: var(--tie-object); }
.sideedge.place.hot { stroke: var(--tie-place); }
/* Only the links that were already drawn step back. Written as `.on` rather
   than as a bare `.sideedge`, because this selector carries an id and would
   otherwise outrank `.sideedge.off` and bring every connector on the map up
   from nothing to a faint grey. */
#stage.side-hover .sideedge.on:not(.hot) { opacity: .1; }
#stage.side-hover .sidelabel:not(.hot) { opacity: .12; }
.sidelabel {
  fill: var(--muted); font-size: 9.5px; text-anchor: middle; pointer-events: none;
  paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round;
  opacity: .6;
}

/* The pulse when the narrator says a name. A ring that expands and fades reads
   as "here, now" without moving the figure or changing its colour — both of
   which already mean something else on this map. */
.node .named-ring { display: none; }
.node.named .named-ring {
  display: block; fill: none; pointer-events: none;
  stroke: var(--ink); stroke-width: 1.6;
  animation: named-pulse 1.7s ease-out forwards;
}
#nodes .node.named .label, #nodelabels .node.named .label, #sidenodes .node.named .label { fill: var(--ink); font-weight: 700; }
/* the sustain: a still ring that fades over half a minute, marking who the
   narration has been on recently rather than only who it is on this second */
.node.recent .named-ring {
  display: block; fill: none; pointer-events: none;
  stroke: var(--mention-glow); stroke-width: 2.2;
  /* Three animations on three separate properties, so they compose rather than
     overwrite each other: opacity is the half-minute memory, r is the breath
     that makes a ring findable among three hundred marks, and stroke-width is
     the entrance — the glow draws itself on instead of appearing.
     app.js gives the breath a negative delay off the document clock, so every
     sustaining ring breathes in step however long ago it was named. */
  animation: named-sustain 30s linear forwards,
             named-breathe 2.4s ease-in-out infinite,
             named-enter 0.55s ease-out;
}
@keyframes named-sustain {
  0%   { opacity: 0;   }
  4%   { opacity: 1;   }
  70%  { opacity: .55; }
  100% { opacity: 0;   }
}
@keyframes named-breathe {
  0%, 100% { r: 12px; }
  50%      { r: 16px; }
}
@keyframes named-enter {
  from { stroke-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .node.recent .named-ring { animation: none; opacity: .6; r: 13px; }
}
@keyframes named-pulse {
  0%   { r: 6px;  opacity: .85; stroke-width: 2.2; }
  70%  { r: 26px; opacity: .12; stroke-width: 1;   }
  100% { r: 30px; opacity: 0;   stroke-width: 1;   }
}
@media (prefers-reduced-motion: reduce) {
  .node.named .named-ring { animation: none; opacity: .5; r: 14px; }
}

.rowline { stroke: var(--grid); stroke-width: 1; }
.rowlabel {
  fill: var(--muted); font-size: 10px; letter-spacing: 0.04em;
  paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round;
}

/* ------------------------------------------------------------------- edges */

.edge { fill: none; stroke: var(--rule); stroke-width: 1.1; opacity: .34; }
.edge.descent  { stroke-dasharray: 1 4; stroke-linecap: round; opacity: .42; }
.edge.union    { stroke: var(--tie-union); stroke-dasharray: 6 4; opacity: .34; }
.edge.violence { stroke: var(--tie-violence); stroke-dasharray: 5 3; opacity: .34; }
.edge.bond     { stroke: var(--tie-bond); stroke-dasharray: 1 3; stroke-linecap: round; opacity: .34; }

.edge.blood, .edge.descent { marker-end: url(#arrow); }
.edge.violence.fatal { marker-end: url(#arrow-kill); }

.edge.mid { opacity: .22; }
.edge.on  { opacity: 1; stroke-width: 1.9; }
/* One colour for the lineage links, whoever is selected. Tying it to the
   focal figure's hue meant the spine of the map changed colour with every
   click, which read as meaning rather than emphasis. */
.edge.blood.on, .edge.descent.on { stroke: var(--tie-line); }
.edge.union.on { stroke: var(--tie-union); }
.edge.blood.on, .edge.descent.on { marker-end: url(#arrow-on); }
.edge.off { opacity: .045; }

/* Hovering a link clears the others out of the way rather than thickening the
   one you are on. Where a dozen near-identical dashes converge on the same
   figure, a heavier stroke simply disappears into the bundle; taking the bundle
   away leaves nothing to confuse it with. The ID selector is what lets this
   outrank .on / .mid / .off. */
.edge.hovered { opacity: 1; }
.edge.hovered.blood, .edge.hovered.descent { stroke: var(--tie-line); }
.edge.hovered.union { stroke: var(--tie-union); }
#stage.edge-hover .edge:not(.hovered) { opacity: .05; }
/* Deliberately no opacity rule on the nodes here: an ID selector would outrank
   .node.off and *raise* already-dimmed figures to its value, brightening the
   background instead of fading it. The two ringed ends carry the pair. */
.node.tie-end .ring { opacity: 1; stroke-dasharray: none; }

/* direction shown along the line, not only where it lands */
.edge.blood, .edge.descent { marker-mid: url(#mid); }
.edge.blood.on, .edge.descent.on { marker-mid: url(#mid-on); }
.edge.violence { marker-mid: url(#mid-violence); }
.edge.bond { marker-mid: url(#mid-bond); }

.midhead { fill: var(--rule); }
.midhead.on { fill: var(--tie-line); }
.midhead.violence { fill: var(--tie-violence); }
.midhead.bond { fill: var(--tie-bond); }

/* The selected figure's links carry their verb all the time, quietly. Hovering
   one promotes it rather than being the only way to read anything. */
.edgelabel {
  fill: var(--muted); font-size: 10px; text-anchor: middle;
  /* the label is the target — `painted` so only the glyphs answer, not the
     whole text box, which would swallow clicks on the map behind it */
  pointer-events: painted; cursor: default;
  paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round;
  opacity: .72;
}
/* each label carries a hint of its own link's colour — muted, so the figures'
   names still read before it */
.edgelabel.violence { fill: var(--tie-violence); }
.edgelabel.bond     { fill: var(--tie-bond); }
.edgelabel.blood,
.edgelabel.descent  { fill: var(--ink-2); }
.edgelabel.union    { fill: var(--tie-union); }
.edgelabel.strong { font-size: 12px; font-weight: 600; stroke-width: 4.5px; opacity: 1; }
.edgelabel.strong.blood,
.edgelabel.strong.descent { fill: var(--ink); }

.arrowhead { fill: var(--rule); }
.arrowhead.on { fill: var(--tie-line); }
.arrowhead.kill { fill: var(--tie-violence); }

.edgehit { fill: none; stroke: transparent; stroke-width: 7; pointer-events: stroke; cursor: help; }

/* ------------------------------------------------------------------- nodes */

.node { cursor: pointer; }
.node .glyph { stroke: var(--surface); stroke-width: 2; }
/* objects and places carry no order colour — hollow, in plain ink */
.node.thing .glyph { fill: none; stroke: var(--ink-2); stroke-width: 1.6; }
.node.thing .label { fill: var(--muted); font-style: italic; }
.node.thing.on .label { fill: var(--ink-2); }
/* A thing-edge is drawn in the thing's own colour — the same two hues the
   pane glyphs use — so a line running off to a work reads differently from one
   running off to a place without anyone having to follow it. The faint pair
   exists for exactly this and had never been used. */
.edge.thing { stroke: var(--rule); stroke-dasharray: 2 2; opacity: .45; }
.edge.thing.item  { stroke: var(--tie-object-faint); }
.edge.thing.place { stroke: var(--tie-place-faint); }
.edge.thing.on { stroke: var(--ink-2); opacity: 1; }
.edge.thing.item.on  { stroke: var(--tie-object); opacity: 1; }
.edge.thing.place.on { stroke: var(--tie-place); opacity: 1; }
.orders.layers { padding-top: 9px; border-top: 1px dashed var(--border); }
.node .label {
  font-size: 11px; fill: var(--ink-2); text-anchor: middle; pointer-events: none;
  paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round;
}
.node.major .label { font-size: 12.5px; font-weight: 600; fill: var(--ink); }

.node.mid { opacity: .5; }
.node.off { opacity: .12; }
.node.on .label { fill: var(--ink); font-weight: 600; }
.node.off .label { display: none !important; }

.node .ring { fill: none; stroke: var(--ink); stroke-width: 2; opacity: 0; }
.node.sel .ring { opacity: 1; }
.node:focus-visible .ring { opacity: 1; stroke-dasharray: 3 2; }
.node:focus { outline: none; }

.node.sel .label,
.node.preview .label,
.node:hover .label,
.node:focus-visible .label { display: inline !important; fill: var(--ink); font-weight: 600; }

/* THE FIGURE BEING POINTED AT, while another one is chosen. Hovering a name in
   the panel used to add that figure to the chosen one's lit set, which for a
   teacher or a student — already in it — did nothing at all, and for anybody
   else lit one more node among forty with no label. It is previewed as if it
   were chosen instead, and this is the mark that says which of the lit nodes
   the reader actually asked about. The chosen figure keeps its own ring at
   half strength behind it, so the way back is never lost. */
.node.preview .ring { opacity: 1; }
.node.preview .glyph { stroke: var(--ink); }
.node.sel.mid .ring { opacity: .55; }

.hit { fill: transparent; }

.zoom {
  position: absolute; right: calc(var(--pane-r, 0px) + 14px); bottom: 14px;
  display: flex; flex-direction: column; gap: 4px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px; box-shadow: var(--shadow);
}
.zoom .btn { width: 30px; height: 26px; padding: 0; text-align: center; }
.zoom .btn.wide { width: auto; padding: 0 8px; font-size: 11px; }

/* Isolate mode changes what the whole map means, so it gets a persistent
   marker and its own way out rather than only a button in the side panel. */
.isolated {
  position: absolute;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 6px 6px 6px 12px;
  border: 1px solid var(--rule);
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--shadow);
  font-size: 12.5px;
  color: var(--ink-2);
  max-width: calc(100% - 24px);
}
.isolated[hidden] { display: none; }
.isolated b { color: var(--ink); }
.isolated .iso-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--hl, var(--hue-olympian)); flex: none;
}
.isolated .btn { height: 24px; font-size: 12px; }

.stage-wrap.isolating { box-shadow: inset 0 0 0 2px var(--hl, var(--hue-olympian)); }
.stage-wrap.isolating .band { fill: none; }

.empty {
  position: absolute; inset: 0; display: none;
  align-items: center; justify-content: center;
  color: var(--muted); font-size: 13px; text-align: center; padding: 24px;
  pointer-events: none;   /* an overlay, not a shield over the stage */
}
.empty.show { display: flex; }

/* ----------------------------------------------------------------- tooltip */

.tip {
  position: fixed; z-index: 60; pointer-events: none; max-width: 290px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: var(--shadow);
  padding: 9px 11px; font-size: 12.5px;
  opacity: 0; transition: opacity .1s;
}
.tip.show { opacity: 1; }
.tip .t-name { font-weight: 600; font-size: 13.5px; }
.tip .t-meta { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.tip .t-dom { color: var(--ink-2); margin-top: 5px; }
.tip .t-epi { color: var(--ink-2); font-style: italic; font-size: 12px; margin-top: 3px; }
.tip .t-kind {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted);
}

/* ------------------------------------------------------------------- panel */

.panel {
  width: 344px; flex: none;
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.panel-head { padding: 12px 12px 0; }
.panel-head .btn { width: 100%; height: 30px; }
.panel-head .btn[aria-pressed="true"] { background: var(--wash); color: var(--ink); }
.panel-body { padding: 18px 20px 40px; }
.panel-video { padding: 12px 12px 0; }
.panel-video[hidden] { display: none; }
.panel-video iframe, .panel-video #t-mount {
  /* the API writes width/height attributes onto the iframe; height:auto is what
     lets aspect-ratio win over them */
  width: 100%; height: auto; aspect-ratio: 16 / 9;
  border: 0; border-radius: 6px; display: block; background: #000;
}

.panel-tour { padding: 12px 20px 0; }
.panel-tour[hidden] { display: none; }
.tour-transport { display: flex; align-items: center; gap: 6px; }
.tour-transport .btn { width: 28px; padding: 0; text-align: center; }
.tour-transport .where { margin-left: auto; color: var(--muted); font-size: 11.5px;
  font-variant-numeric: tabular-nums; }
.tour-now { margin-top: 9px; }
.tour-now b { font-size: 14px; }
.tour-now p { margin: 4px 0 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }

.chapters { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
.chapters button {
  display: flex; gap: 9px; align-items: baseline;
  width: 100%; padding: 5px 8px; border: 0; border-radius: 5px;
  background: transparent; color: var(--ink-2);
  font: inherit; font-size: 12.5px; text-align: left; cursor: pointer;
}
.chapters button:hover { background: var(--wash); color: var(--ink); }
.chapters button[aria-current="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.chapters button:focus-visible { outline: 2px solid var(--hue-olympian); outline-offset: -2px; }
.chapters .t { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 44px; }
.chapters button[aria-current="true"] .t { color: var(--ink-2); }

.backlink {
  display: inline-flex; align-items: center; gap: 5px;
  background: none; border: 0; padding: 0; margin-bottom: 10px;
  color: var(--muted); font: inherit; font-size: 12px; cursor: pointer;
}
.backlink:hover { color: var(--ink); }

.panel h2 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
.panel .greek {
  font-size: 14px; color: var(--ink-2); margin-top: 3px; letter-spacing: .01em;
}
.panel .epithet { color: var(--ink-2); font-size: 13px; font-style: italic; margin-top: 3px; }
.panel .aka { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.panel .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }

.tag {
  font-size: 11.5px; border: 1px solid var(--border); border-radius: 4px;
  padding: 2px 7px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 5px;
}

.panel .blurb { margin: 14px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.62; }
/* the citation line under a blurb, and in an edge tip — quiet, but always there */
.panel .src { margin: 4px 0 0; color: var(--muted); font-size: 11.5px; }
/* the film a run of chapters plays in, when the tour spans more than one */
.chapters .chsrc {
  margin: 10px 0 4px; color: var(--muted);
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
}
.tip .t-src { color: var(--muted); font-size: 11px; margin-top: 3px; }
/* An absent citation reads as an absence, not as a source. */
.tip .t-src.none { font-style: italic; opacity: .8; }
.panel section { margin-top: 18px; }
/* A section heading follows its section down. A long shelf of works or of
   things written about somebody runs well past a screen, and without this a
   reader scrolling through it has no idea any more which list they are in.
   The panel is the scroller, so the offset is zero; the background is opaque
   because the rows pass underneath it. */
.panel h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); margin: 0 0 7px; font-weight: 600;
  position: sticky; top: 0; z-index: 3;
  background: var(--surface);
  padding: 6px 0 5px; margin-top: -6px;
}

.links { display: flex; flex-wrap: wrap; gap: 5px; }

.link {
  border: 1px solid var(--border); background: transparent; border-radius: 13px;
  padding: 3px 9px 3px 6px; font: inherit; font-size: 12.5px;
  color: var(--ink-2); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.link:hover { background: var(--wash); color: var(--ink); }
.link:focus-visible { outline: 2px solid var(--hue-olympian); outline-offset: 1px; }

.deed { display: flex; gap: 8px; margin-bottom: 10px; font-size: 12.5px; line-height: 1.5; }
.deed .bar { width: 2px; flex: none; border-radius: 1px; background: var(--tie-violence); }
.deed.bond .bar { background: var(--tie-bond); }
.deed .deed-head { color: var(--ink); }
.deed .verb {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin-right: 2px;
}
.deed .who { color: var(--ink); font-weight: 600; cursor: pointer; }
.deed .who:hover { text-decoration: underline; }
.deed .arrow { color: var(--muted); }
.deed .fatal {
  color: var(--tie-violence); font-size: 10px; text-transform: uppercase;
  letter-spacing: .06em; margin-left: 2px;
}
.deed .what { color: var(--ink-2); }

.panel .none { color: var(--muted); font-size: 12.5px; }
.panel .placeholder { color: var(--ink-2); font-size: 13.5px; }
.panel .placeholder ul { padding-left: 18px; margin: 10px 0 0; }
.panel .placeholder li { margin-bottom: 6px; }
.panel-actions { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }

.keylist { display: flex; flex-direction: column; gap: 9px; }
.keyrow { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; }
.keyrow .kmark { flex: none; width: 18px; display: flex; justify-content: center; padding-top: 2px; }
.keyrow .kname { color: var(--ink); font-weight: 600; }
.keyrow .kdesc { color: var(--ink-2); }

.eralist { display: flex; flex-direction: column; gap: 8px; }
.erarow { display: flex; gap: 9px; font-size: 12.5px; }
.erarow .enum { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.erarow .ename { color: var(--ink); font-weight: 600; }
.erarow .edesc { color: var(--ink-2); }

/* --------------------------------------------------------------- table view */

.tablewrap { flex: 1; overflow: auto; background: var(--surface); min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }

thead th {
  position: sticky; top: 0; background: var(--surface);
  border-bottom: 1px solid var(--rule);
  text-align: left; padding: 10px 12px;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; z-index: 2;
}
thead th:hover { color: var(--ink); }
thead th[aria-sort] { color: var(--ink); }

tbody td { padding: 9px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tbody tr:hover { background: var(--wash); }
tbody td.num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
tbody td.rel { color: var(--ink-2); font-size: 12.5px; }
tbody .nm { font-weight: 600; cursor: pointer; }
tbody .nm:hover { text-decoration: underline; }
tbody .ordercell { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }

.hidden { display: none !important; }

/* Filtered-out figures are hidden where they stand. The layout is never re-solved
   for a subset, so nothing that stays visible ever moves. */
.node.hidden, .edge.hidden, .edgehit.hidden { display: none; }

/* --------------------------------------------------------------- responsive */

@media (max-width: 1200px) {
  .roster { width: 210px; }
  .panel { width: 290px; }
}

@media (max-width: 960px) {
  main { flex-wrap: wrap; }
  .roster { width: 100%; max-height: 190px; border-right: 0; border-bottom: 1px solid var(--border); }
  .orders { border-bottom: 0; }
  .stage-wrap { min-height: 46vh; flex: 1 1 100%; }
  .panel { width: 100%; border-left: 0; border-top: 1px solid var(--border); max-height: 46vh; }
  .masthead { padding: 12px 14px 10px; }
  .legend { padding: 0 14px 10px; }
}

/* ------------------------------------------------------------------ phone

   A phone is not a small desk, so this is not the desktop reflowed. The two
   side panes and their edges are gone (the shell empties `state.layers`,
   which the map already reads), the key is folded behind its button, and what
   is left is the thing you came for: the map on top, and under it the panel
   that actually answers — the paragraph, the sources, the video.

   Half and half, because either alone is useless: a map with no panel says
   nothing about what you tapped, and a panel with no map gives you nothing to
   tap. Both scroll on their own. */

.btn#legend-toggle { display: none; }

body.compact .legend { display: none; }
body.compact.legend-open .legend {
  display: flex; max-height: 40vh; overflow-y: auto;
  border-top: 1px solid var(--border); padding-top: 9px;
}
body.compact .btn#legend-toggle { display: inline-block; }
body.compact.legend-open .btn#legend-toggle { background: var(--wash); color: var(--ink); }

body.compact .masthead { padding: 10px 12px 8px; gap: 8px; }
body.compact h1 { font-size: 16px; }
body.compact .sub, body.compact .count { display: none; }
body.compact .toolbar { gap: 6px; }
body.compact .btn { height: 26px; padding: 0 9px; font-size: 12px; }

/* A column, not a wrapped row: the map holds its height and the panel
   takes the rest and scrolls inside itself, so the page never scrolls as a
   whole and the map cannot be pushed off the top by a long paragraph. */
body.compact main { flex-direction: column; flex-wrap: nowrap; overflow: hidden; }
body.compact .rail {
  width: 100%; height: 20px; flex: 0 0 auto;
  border-right: 0; border-bottom: 1px solid var(--border);
}
body.compact .rail svg { transform: rotate(-90deg); }
body.compact .rail[aria-pressed="false"] svg { transform: rotate(90deg); }
body.compact .roster {
  width: 100%; flex: 0 0 auto; max-height: 40vh; overflow-y: auto;
  border-right: 0; border-bottom: 1px solid var(--border);
}
body.compact .stage-wrap {
  flex: 0 0 48vh; width: 100%; min-height: 0;
  border-bottom: 1px solid var(--border);
}
body.compact .panel {
  flex: 1 1 0; min-height: 0; width: 100%;
  border-left: 0; max-height: none; overflow-y: auto;
}
/* the panel is the point on a phone: give its prose room to breathe */
body.compact .panel .blurb { font-size: 14.5px; }
body.compact .ytcard { max-width: 100%; }
body.compact .footage-embed { margin-top: 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

@media (forced-colors: active) {
  .node .glyph { forced-color-adjust: none; stroke: CanvasText; }
  .edge { stroke: CanvasText; opacity: 1; }
  .band { fill: Canvas; }
}

/* The map/panel split on a phone is a preference, not a constant. The grip
   is created by the shared shell; these are the styles it lands in. */
body.compact .stage-wrap { flex-basis: var(--map-h, 48vh); }
body.compact .grip {
  display: block; flex: 0 0 auto; height: 18px; width: 100%;
  border-bottom: 1px solid var(--border); background: var(--wash);
  cursor: row-resize; touch-action: none; position: relative;
}
body.compact .grip::before {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 34px; height: 3px; margin: -1.5px 0 0 -17px;
  border-radius: 2px; background: var(--border);
}
body.compact .grip.dragging::before { background: var(--ink-2); }
.grip, .keygrip { display: none; }
body.compact .panel { min-height: 132px; }
body.compact.legend-open .legend { max-height: var(--key-h, 30vh); overflow-y: auto; overscroll-behavior: contain; }
body.compact.legend-open .keygrip { display: block; }
body.compact .keygrip {
  flex: 0 0 auto; height: 16px; width: 100%;
  border-bottom: 1px solid var(--border); background: var(--wash);
  cursor: row-resize; touch-action: none; position: relative;
}
body.compact .keygrip::before {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 30px; height: 3px; margin: -1.5px 0 0 -15px;
  border-radius: 2px; background: var(--border);
}
body.compact .keygrip.dragging::before { background: var(--ink-2); }

/* Unselected the panel has nothing to say, so the map takes the screen; the
   moment a figure is chosen the panel becomes the point. These move only the
   DEFAULT — --map-h, set by dragging the grip, keeps overriding both, because
   a reader who has dragged has said what they want. */
body.compact .stage-wrap { flex: 0 1 var(--map-h, 62vh); min-height: 110px; }
/* The split moves for three reasons — a selection, the caret, a drag — and all
   three read better with a short move than with a jump. Dragging is exempt:
   a transition there lags the finger. */
body.compact .stage-wrap, body.compact .panel { transition: flex-basis .24s ease, flex-grow .24s ease; }
body.compact.gripping .stage-wrap, body.compact.gripping .panel { transition: none; }
@media (prefers-reduced-motion: reduce) {
  body.compact .stage-wrap, body.compact .panel { transition: none; }
}
body.compact.has-sel .stage-wrap { flex: 0 1 var(--map-h, 42vh); }
/* Collapsed by measurement, not by display:none — a panel that vanishes cannot
   be animated, and the fold is the one place on a phone where a bit of motion
   says which way the thing went. */
body.compact.panel-collapsed .panel {
  flex: 0 0 0; min-height: 0; overflow: hidden; border-top: 0;
}
body.compact.panel-collapsed .stage-wrap { flex: 1 1 auto; }
body.compact .grip { display: flex; align-items: center; justify-content: flex-end; }
.gripcaret { display: none; }
body.compact .gripcaret {
  display: block; width: 44px; height: 100%; margin: 0; padding: 0;
  border: 0; background: none; cursor: pointer; position: relative;
  -webkit-tap-highlight-color: transparent;
}
body.compact .gripcaret::before {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 7px; height: 7px; margin: -5px 0 0 -4px;
  border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
  transform: rotate(45deg);
}
body.compact.panel-collapsed .gripcaret::before {
  margin: -1px 0 0 -4px; transform: rotate(225deg);
}

/* see the dance sheet: the chip meta takes the title's line box so the two
   centre on each other rather than sharing a baseline. */
.link > .chipmeta { align-self: flex-start; line-height: calc(12.5px * 1.5); }

/* ------------------------------------------------------- where you are in it
   Both axes of this map are named at all times, so a reader knows WHAT they
   are looking at; these say how much of it is off-screen. Read the way a
   scrollbar is read, and shown only while something is actually outside the
   window — at the fitted view the answer is "all of it" and a bar would be
   noise. Not interactive: the map pans by dragging it, and a second way to do
   the same thing is a second thing to get wrong. */
.extent { position: absolute; background: none; pointer-events: none; z-index: 3; }
.extent > i { position: absolute; display: block; background: var(--ink-2);
              opacity: .28; border-radius: 2px; }
.extent.x { left: 0; right: 0; bottom: 2px; height: 3px; }
.extent.x > i { top: 0; height: 100%; }
.extent.y { top: 0; bottom: 0; right: 2px; width: 3px; }
.extent.y > i { left: 0; width: 100%; }
@media (prefers-reduced-transparency: reduce) { .extent > i { opacity: .5; } }

</style>
</head>
<body>
<header>
  <div class="masthead">
    <h1>Theogony Atlas</h1>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="View">
        <button class="btn" id="v-map" aria-pressed="true">Map</button>
        <button class="btn" id="v-table" aria-pressed="false">Table</button>
      </div>
      <button class="btn" id="legend-toggle" aria-expanded="false" title="Show the key">Key</button>
      <button class="btn" id="theme" title="Switch light / dark">Theme</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </div>
  <div class="legend" id="legend"></div>
</header>

<main>
  <button class="rail" id="roster-toggle" aria-pressed="false" title="Show the roster" aria-label="Show or hide the roster">
    <svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true">
      <path d="M8.5 1.5 L3 7 l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <aside class="roster collapsed" id="roster">
    <div class="roster-search">
      <input id="q" type="search" placeholder="Name, epithet, or story…" autocomplete="off"
             aria-label="Search characters">
      <kbd>/</kbd>
    </div>
    <div class="orders" id="orderchips" aria-label="Filter by order of being"></div>
    <div class="orders layers" id="layerchips" aria-label="Show or hide objects and places"></div>
    <div class="orders ties" id="tiechips" aria-label="Show or hide kinds of tie"></div>
    <div class="roster-list" id="rosterlist"></div>
  </aside>

  <div class="stage-wrap" id="stagewrap">
    <!-- role="group", not "img": an image is presentational all the way down,
         which would hide every labelled node button from screen readers -->
    <svg id="stage" role="group" aria-label="Map of Greek mythology by descent and mythic era">
      <defs>
        <marker id="arrow" viewBox="-6 -4 8 8" refX="0" refY="0"
                markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="arrowhead" d="M-5.2,-2.9 L0,0 L-5.2,2.9 Z"/>
        </marker>
        <marker id="arrow-on" viewBox="-6 -4 8 8" refX="0" refY="0"
                markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="arrowhead on" d="M-5.2,-2.9 L0,0 L-5.2,2.9 Z"/>
        </marker>
        <marker id="arrow-kill" viewBox="-6 -4 8 8" refX="0" refY="0"
                markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="arrowhead kill" d="M-5.2,-2.9 L0,0 L-5.2,2.9 Z"/>
        </marker>
        <marker id="mid" viewBox="-5 -4 9 8" refX="0" refY="0"
                markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="midhead" d="M-4,-2.6 L1.4,0 L-4,2.6 Z"/>
        </marker>
        <marker id="mid-on" viewBox="-5 -4 9 8" refX="0" refY="0"
                markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="midhead on" d="M-4,-2.6 L1.4,0 L-4,2.6 Z"/>
        </marker>
        <marker id="mid-violence" viewBox="-5 -4 9 8" refX="0" refY="0"
                markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="midhead violence" d="M-4,-2.6 L1.4,0 L-4,2.6 Z"/>
        </marker>
        <marker id="mid-bond" viewBox="-5 -4 9 8" refX="0" refY="0"
                markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="midhead bond" d="M-4,-2.6 L1.4,0 L-4,2.6 Z"/>
        </marker>
        <clipPath id="midclip"><rect id="midclip-rect" x="-100000" y="-100000" width="200000" height="200000"/></clipPath>
        <!-- Each kind of connector is clipped out of the opposite pane. Paint
             order alone cannot do this: the requirement is circular — object
             links above the objects panel but below the places panel, and the
             reverse for place links. -->
        <clipPath id="objclip"><rect id="objclip-rect" x="0" y="0" width="10" height="10"/></clipPath>
        <clipPath id="plcclip"><rect id="plcclip-rect" x="0" y="0" width="10" height="10"/></clipPath>
      </defs>
      <g id="panes">
        <rect class="pane-bg" id="pane-l"></rect>
        <rect class="pane-bg" id="pane-r"></rect>
        <line class="paneline" id="pane-l-rule"></line>
        <line class="paneline" id="pane-r-rule"></line>

 */
window.FIGURES = [

{ id:'chaos', name:'Chaos', age:'primordial', kind:'god', rank:1,

{ id:'tartarus', name:'Tartarus', age:'primordial', kind:'god', rank:2,

  src:"Paus. 2.15.4–5" },

{ id:'hecate', name:'Hecate', age:'titan', kind:'god', rank:2,
  domain:'Crossroads and witchcraft', parents:['perses','asteria'], consorts:[],
  blurb:"A Titan-born goddess whose privileges Zeus left untouched: she holds a share of earth, sea and sky. She carried the torches during the search for Persephone and stayed on as her attendant.",
  src:"Hes. Theog. 411–452; h.Hom.Dem. 52–62" },

{ id:'circe', name:'Circe', age:'titan', kind:'god', rank:2,
  domain:'Sorceress of Aeaea', parents:['helios','perse'], consorts:[],
  blurb:"She turned Odysseus's crew into pigs, was outwitted by a herb from Hermes, then kept the man himself for a year and gave him directions to the land of the dead.",
  src:"Hom. Od. 10.210–574" },

{ id:'aeetes', name:'Aeetes', age:'titan', kind:'god', rank:3,
  domain:'King of Colchis', parents:['helios','perse'], consorts:[],
  blurb:"Keeper of the Golden Fleece, and the man who set Jason a series of tasks designed to be fatal. His daughter Medea took the visitor's side.",
  src:"A.R. Argon. 3" },

{ id:'apsyrtus', name:'Apsyrtus', aka:'Absyrtus', age:'mortal', kind:'mortal', rank:3,
  domain:'Prince of Colchis', parents:['aeetes'], consorts:[],
  blurb:"Medea's younger brother, and the first thing she spent to keep Jason. She killed him during the flight and put him into the sea a piece at a time, because a father who stops to gather his son for burial is a father who stops.",
  src:"Apollod. Bibl. 1.9.24" },

{ id:'pasiphae', name:'Pasiphae', age:'titan', kind:'god', rank:3,
  domain:'Queen of Crete', parents:['helios','perse'], consorts:['minos'],
  blurb:"When Minos kept a bull he had promised to sacrifice, Poseidon made Pasiphae desire it. Daedalus built her a wooden cow; the Minotaur was the result.",
  src:"Apollod. Bibl. 3.1.3–4" },

{ id:'phaethon', name:'Phaethon', age:'titan', kind:'mortal', rank:3,
  domain:'The Sun’s doomed son', parents:['helios','clymene'], consorts:[],
  blurb:"He begged to drive his father's chariot for one day, lost control, scorched Africa into desert, and was shot out of the sky by Zeus to save the world.",
  src:"Ov. Met. 1.750–2.400" },

{ id:'chiron', name:'Chiron', age:'titan', kind:'god', rank:2,
  domain:'Teacher of heroes', parents:['cronus','philyra'], consorts:[],
  blurb:"Unlike other centaurs, civilised, and the finest tutor in Greece — Achilles, Jason and Asclepius all passed through his cave. Wounded incurably by a poisoned arrow, he gave up his immortality to escape the pain.",
  src:"Apollod. Bibl. 2.5.4" },

{ id:'boreas', name:'Boreas', age:'titan', kind:'god', rank:3,
  domain:'The north wind', parents:['astraeus','eos'], consorts:[],
  blurb:"The cold wind out of Thrace. He carried off an Athenian princess, and the Athenians credited him with wrecking the Persian fleet.",
  src:"Hdt. 7.189" },

{ id:'calypso', name:'Calypso', age:'titan', kind:'god', rank:2,
  domain:'Nymph of Ogygia', parents:['atlas'], consorts:[],
  blurb:"She kept Odysseus on her island for seven years and offered him immortality to stay. He sat on the shore looking at the sea until the gods ordered her to let him go.",
  src:"Hom. Od. 5.13–268" },

{ id:'maia', name:'Maia', age:'titan', kind:'god', rank:3,
  domain:'Eldest of the Pleiades', parents:['atlas'], consorts:['zeus'],
  blurb:"A shy mountain nymph who kept to a cave — and so escaped Hera's notice long enough to raise Hermes, briefly.",
  src:"h.Hom.Herm. 1–15" },

/* ------------------------------------------------------------ elder sea line */
{ id:'thetis', name:'Thetis', age:'primordial', kind:'god', rank:2,
  domain:'Sea-goddess, mother of Achilles', parents:['nereus','doris'], consorts:['peleus'],
  blurb:"Prophesied to bear a son greater than his father, she was hurriedly married to a mortal. She shape-shifted to escape Peleus and failed, and spent her son's short life trying to buy him more of it.",
  src:"Hom. Il. 1.348–427, 18.35–147" },

{ id:'amphitrite', name:'Amphitrite', age:'primordial', kind:'god', rank:2,
  domain:'Queen of the sea', parents:['nereus','doris'], consorts:['poseidon'],
  blurb:"She fled Poseidon's proposal to the far edge of the world; a dolphin found her and talked her round, and was set among the stars for it.",
  src:"Hes. Theog. 243, 930; Hyg. Astr. 2.17" },

{ id:'medusa', name:'Medusa', age:'primordial', kind:'monster', rank:1,
  domain:'The Gorgon', parents:['phorcys','ceto'], consorts:['poseidon'],
  blurb:"The only mortal Gorgon, whose gaze turned men to stone. Perseus took her head using a mirrored shield; from her severed neck sprang Pegasus. Ovid's later version makes her a violated priestess punished by Athena.",
  src:"Hes. Theog. 274–281; Ov. Met. 4.790–803" },

{ id:'graeae', name:'The Graeae', age:'primordial', kind:'monster', rank:3,
  domain:'Grey sisters', parents:['phorcys','ceto'], consorts:[],
  blurb:"Three sisters grey from birth, sharing one eye and one tooth between them. Perseus stole the eye mid-handover and refused to return it until they gave him directions.",
  src:"Apollod. Bibl. 2.4.2" },

{ id:'ladon', name:'Ladon', age:'primordial', kind:'monster', rank:3,
  domain:'Dragon of the golden apples', parents:['phorcys','ceto'], consorts:[],
  blurb:"A hundred-headed serpent coiled round the tree in the garden of the Hesperides, never sleeping. Heracles' eleventh labour went through him.",
  src:"Hes. Theog. 333–336; Apollod. Bibl. 2.5.11" },

{ id:'scylla', name:'Scylla', age:'primordial', kind:'monster', rank:2,
  domain:'The six-headed strait', parents:['phorcys','ceto'], consorts:[],
  blurb:"Six heads on six long necks, each taking one sailor as a ship passes. Odysseus steered close to her deliberately: losing six men beat losing the whole ship to Charybdis.",
  src:"Hom. Od. 12.73–126, 222–259" },

{ id:'harpies', name:'The Harpies', age:'primordial', kind:'monster', rank:3,
  domain:'Snatching winds', parents:['thaumas'], consorts:[],
  blurb:"Bird-women who carry people off and leave nothing behind. They tormented the blind prophet Phineus by fouling his food until the Argonauts drove them away.",
  src:"Hes. Theog. 265–269; A.R. Argon. 2.176–300" },

{ id:'iris', name:'Iris', age:'olympian', kind:'god', rank:2,
  domain:'The rainbow, messenger', parents:['thaumas'], consorts:[],
  blurb:"Hera's herald, travelling the rainbow between sky, earth and sea. She fetches the water of the Styx when a god must swear an oath.",
  src:"Hes. Theog. 266, 780–787" },

{ id:'sirens', name:'The Sirens', age:'olympian', kind:'monster', rank:2,
  domain:'The fatal song', parents:['achelous','melpomene'], consorts:[],
  blurb:"They sing what each listener most wants to hear — for Odysseus, everything that happened at Troy. He had himself lashed to the mast; his crew rowed on with wax in their ears.",
  src:"Hom. Od. 12.39–54, 158–200" },

/* ----------------------------------------------------------------- olympians */
{ id:'aphrodite', name:'Aphrodite', aka:'Venus', age:'olympian', kind:'god', rank:1,
  domain:'Love and beauty', parents:['uranus'], consorts:['hephaestus','ares','anchises','adonis'],
  blurb:"Born from sea-foam where Uranus fell — which makes her older than Zeus, whatever the seating plan on Olympus says. Homer instead makes her Zeus's daughter. Her promise of the most beautiful woman alive started the Trojan War.",
  src:"Hes. Theog. 188–206" },

{ id:'hestia', name:'Hestia', aka:'Vesta', age:'olympian', kind:'god', rank:2,
  domain:'The hearth', parents:['cronus','rhea'], consorts:[],
  blurb:"Firstborn of the six and the least dramatic: she swore off marriage and kept the fire. Every household sacrifice opened and closed with her, which made her the most frequently worshipped god in Greece.",
  src:"Hes. Theog. 454; h.Hom. 29" },

{ id:'demeter', name:'Demeter', aka:'Ceres', age:'olympian', kind:'god', rank:1,
  domain:'Grain and the harvest', parents:['cronus','rhea'], consorts:['zeus'],
  blurb:"When Hades took her daughter she stopped the crops growing until the gods gave way. The compromise — Persephone below for part of the year — is the year itself.",
  src:"h.Hom.Dem." },

{ id:'hera', name:'Hera', aka:'Juno', age:'olympian', kind:'god', rank:1,
  domain:'Marriage and queenship', parents:['cronus','rhea'], consorts:['zeus'],
  blurb:"Queen of the gods and guardian of the marriage vow, married to its most persistent breaker. Her fury generally lands on the women involved and their children rather than on Zeus.",
  src:"Hes. Theog. 453–457, 921" },

{ id:'hades', name:'Hades', aka:'Pluto', age:'olympian', kind:'god', rank:1,
  domain:'The underworld', parents:['cronus','rhea'], consorts:['persephone'],
  blurb:"He drew the underworld in the lots and rules it strictly: nobody gets out. Not evil, and not death itself — just the least visited of the three brothers, whose name people avoided saying.",
  src:"Hom. Il. 15.187–193" },

{ id:'poseidon', name:'Poseidon', aka:'Neptune', age:'olympian', kind:'god', rank:1,
  domain:'Sea, earthquakes, horses', parents:['cronus','rhea'], consorts:['amphitrite','medusa','libya','tyro'],
  blurb:"He drew the sea. Quick-tempered and territorial — he lost Athens to Athena over an olive tree, and spent ten years keeping Odysseus from getting home after his son was blinded.",
  src:"Hom. Od. 1.19–21, 9.526–536" },

{ id:'zeus', name:'Zeus', aka:'Jupiter', age:'olympian', kind:'god', rank:1,
  domain:'Sky, thunder, kingship', parents:['cronus','rhea'], consorts:['hera','metis','leto','demeter','themis','mnemosyne','maia','leda','danae','alcmene','europa','io','semele'],
  blurb:"Hidden on Crete as a baby, he freed his swallowed siblings and won a ten-year war for the sky. He keeps the oath, the guest-right and the suppliant — and breaks his own marriage vow more often than any other figure in Greek myth.",
  src:"Hes. Theog. 453–506, 617–720" },

{ id:'athena', name:'Athena', aka:'Minerva', age:'olympian', kind:'god', rank:1,
  domain:'Wisdom, craft, strategy', parents:['zeus','metis'], consorts:[],
  blurb:"Born fully armed from Zeus's skull after he swallowed her mother. War as planning rather than slaughter; she backs Odysseus, Perseus and Heracles, and won Athens with an olive tree.",
  src:"Hes. Theog. 886–900, 924–926" },

{ id:'apollo', name:'Apollo', age:'olympian', kind:'god', rank:1,
  domain:'Light, music, prophecy, plague', parents:['zeus','leto'], consorts:['coronis'],
  blurb:"He killed the serpent Python and took Delphi, where his priestess answered questions ambiguously for a thousand years. The same arrows that bring plague bring the cure — and 'know yourself' was carved over his door.",
  src:"h.Hom.Ap. 300–374" },

{ id:'artemis', name:'Artemis', aka:'Diana', age:'olympian', kind:'god', rank:1,
  domain:'The hunt and the wild', parents:['zeus','leto'], consorts:[],
  blurb:"Born first and helping with her brother's delivery, she asked Zeus for eternal virginity and a bow. Protector of young girls and wild animals, ferocious to anyone who intrudes — Actaeon saw her bathing and was torn apart by his own dogs.",
  src:"Callim. Hymn 3; Ov. Met. 3.138–252" },

{ id:'ares', name:'Ares', aka:'Mars', age:'olympian', kind:'god', rank:1,
  domain:'The violence of war', parents:['zeus','hera'], consorts:['aphrodite'],
  blurb:"Not strategy but bloodlust and panic. Even his father calls him the most hateful of the gods; Athena beats him regularly, and Hephaestus caught him in a net with Aphrodite for the whole of Olympus to laugh at.",
  src:"Hom. Il. 5.888–898; Hom. Od. 8.266–366" },

{ id:'hephaestus', name:'Hephaestus', aka:'Vulcan', age:'olympian', kind:'god', rank:1,
  domain:'Fire and the forge', parents:['hera'], consorts:['aphrodite'],
  blurb:"Born to Hera alone and thrown off Olympus for being lame. The only working god: he made the armour of Achilles, the chains of Prometheus, and self-propelling tripods and golden servants that could think.",
  src:"Hes. Theog. 927–929; Hom. Il. 18.369–617" },

{ id:'hermes', name:'Hermes', aka:'Mercury', age:'olympian', kind:'god', rank:1,
  domain:'Travel, trade, thieves, messages', parents:['zeus','maia'], consorts:[],
  blurb:"On his first day he left the cradle, invented the lyre from a tortoise shell, stole Apollo's cattle and lied about it charmingly enough to be forgiven. He alone crosses freely into the underworld, guiding the dead.",
  src:"h.Hom.Herm.; Hom. Od. 24.1–14" },

{ id:'persephone', name:'Persephone', aka:'Proserpina', age:'olympian', kind:'god', rank:1,
  domain:'Queen of the underworld', parents:['zeus','demeter'], consorts:['hades'],
  blurb:"Taken while picking flowers, and bound to return by the pomegranate seeds she ate below — one, or seven, depending on the telling. The girl who was carried off becomes a formidable queen — Orpheus and Heracles both have to get past her.",
  src:"h.Hom.Dem. 370–413" },

{ id:'dionysus', name:'Dionysus', aka:'Bacchus', age:'olympian', kind:'god', rank:1,
  domain:'Wine, ecstasy, theatre', parents:['zeus','semele'], consorts:['ariadne'],
  blurb:"Carried to term in Zeus's thigh after his mother was incinerated. He dissolves the boundary between people and their restraint — a gift when welcomed, a catastrophe when refused, as Pentheus found out.",
  src:"Eur. Bacch." },

{ id:'hebe', name:'Hebe', age:'olympian', kind:'god', rank:3,
  domain:'Youth, cupbearer', parents:['zeus','hera'], consorts:['heracles'],
  blurb:"She poured the nectar on Olympus until she married Heracles — the reward at the end of his labours.",
  src:"Hes. Theog. 922, 950–955" },

{ id:'eileithyia', name:'Eileithyia', age:'olympian', kind:'god', rank:3,
  domain:'Childbirth', parents:['zeus','hera'], consorts:[],
  blurb:"Labour cannot finish until she arrives. Hera held her back for seven days at Heracles' birth, so that Eurystheus would come first and take the lordship Zeus had sworn to the next-born.",
  src:"Hom. Il. 19.95–133" },

{ id:'calliope', name:'Calliope', age:'olympian', kind:'god', rank:2,
  domain:'Muse of epic poetry', parents:['zeus','mnemosyne'], consorts:[],
  blurb:"Eldest and most senior of the nine Muses, invoked at the opening of the Iliad and the Odyssey. Mother of Orpheus, which explains a great deal about him.",
  src:"Hes. Theog. 75–79; Apollod. Bibl. 1.3.2" },

{ id:'melpomene', name:'Melpomene', age:'olympian', kind:'god', rank:3,
  domain:'Muse of tragedy', parents:['zeus','mnemosyne'], consorts:[],
  blurb:"She began as the muse of singing and ended up holding the tragic mask. In one tradition the Sirens are her daughters.",
  src:"Hes. Theog. 77; Apollod. Epit. 7.18" },

{ id:'nike', name:'Nike', aka:'Victoria', age:'olympian', kind:'god', rank:2,
  domain:'Victory', parents:['pallas','styx'], consorts:[],
  blurb:"Brought to Zeus's side by her mother at the start of the Titan war and never left it. She hovers at the moment of winning, in athletics as much as in battle.",
  src:"Hes. Theog. 383–403" },

{ id:'harmonia', name:'Harmonia', age:'olympian', kind:'god', rank:3,
  domain:'Concord', parents:['ares','aphrodite'], consorts:['cadmus'],
  blurb:"Her wedding to Cadmus was attended by every god — and Hephaestus, still angry about her parents, gave her a cursed necklace that destroyed her descendants for generations.",
  src:"Hes. Theog. 933–937; Apollod. Bibl. 3.4.2" },

{ id:'pan', name:'Pan', aka:'Faunus', age:'olympian', kind:'god', rank:2,
  domain:'Wild places, flocks', parents:['hermes'], consorts:[],
  blurb:"Goat-legged god of the hills, inventor of the reed pipe, and the source of the sudden groundless fear that empties a hillside — panic.",
  src:"h.Hom.Pan" },

{ id:'asclepius', name:'Asclepius', age:'olympian', kind:'god', rank:2,
  domain:'Medicine', parents:['apollo','coronis'], consorts:[],
  blurb:"Taught by Chiron, he became so good at healing that he began raising the dead. Zeus killed him with a thunderbolt to protect the boundary, then set him among the stars.",
  src:"Pind. Pyth. 3; Apollod. Bibl. 3.10.3–4" },

{ id:'triton', name:'Triton', age:'olympian', kind:'god', rank:3,
  domain:'Herald of the sea', parents:['poseidon','amphitrite'], consorts:[],
  blurb:"He calms or raises the waves by blowing a conch shell. The Argonauts were lost until he pushed their ship back into open water.",
  src:"Hes. Theog. 930–933; A.R. Argon. 4.1551–1622" },

{ id:'proteus', name:'Proteus', age:'olympian', kind:'god', rank:3,
  domain:'Shape-shifting sea-elder', parents:['poseidon'], consorts:[],
  blurb:"He knows everything but answers only under duress: hold on while he becomes a lion, a serpent, water and a tree, and he will finally talk. Hence 'protean'.",
  src:"Hom. Od. 4.351–570" },

{ id:'orion', name:'Orion', age:'olympian', kind:'mortal', rank:2,
  domain:'The giant hunter', parents:['poseidon'], consorts:[],
  blurb:"He could walk on water and boasted he would kill every animal on earth — so Gaia sent a scorpion. Both were placed in the sky, still set as far apart as possible.",
  src:"Hes. Op. 609–620; Apollod. Bibl. 1.4.3–5" },

{ id:'polyphemus', name:'Polyphemus', age:'olympian', kind:'monster', rank:2,
  domain:'The Cyclops of the cave', parents:['poseidon'], consorts:[],
  blurb:"He ate six of Odysseus's men before the survivors blinded him with a stake. His cry that 'Nobody' had hurt him brought no help — but naming himself lost Odysseus ten years.",
  src:"Hom. Od. 9.105–566" },

{ id:'pegasus', name:'Pegasus', age:'olympian', kind:'monster', rank:2,
  domain:'The winged horse', parents:['poseidon','medusa'], consorts:[],
  blurb:"Sprang from Medusa's neck when Perseus struck. Bellerophon caught him with a golden bridle from Athena; when he tried to ride him up to Olympus, the horse threw him.",
  src:"Hes. Theog. 280–286; Pind. Ol. 13, Isthm. 7" },

{ id:'chrysaor', name:'Chrysaor', age:'olympian', kind:'monster', rank:3,
  domain:'Born with a golden sword', parents:['poseidon','medusa'], consorts:[],
  blurb:"Pegasus's brother, out of the same wound. Father of the three-bodied Geryon.",
  src:"Hes. Theog. 280–288" },

{ id:'geryon', name:'Geryon', age:'olympian', kind:'monster', rank:3,
  domain:'The three-bodied herdsman', parents:['chrysaor'], consorts:[],
  blurb:"He kept red cattle at the western edge of the world with a two-headed dog. Heracles' tenth labour killed all three at once with a single arrow.",
  src:"Hes. Theog. 287–294; Apollod. Bibl. 2.5.10" },

{ id:'cerberus', name:'Cerberus', age:'olympian', kind:'monster', rank:2,
  domain:'Hound of Hades', parents:['typhon','echidna'], consorts:[],
  blurb:"Three heads at the gate: friendly to those entering, implacable to anyone leaving. Orpheus got past with music; Heracles dragged him up bare-handed and then put him back.",
  src:"Hes. Theog. 310–312; Apollod. Bibl. 2.5.12" },

{ id:'hydra', name:'The Hydra', age:'olympian', kind:'monster', rank:2,
  domain:'Serpent of Lerna', parents:['typhon','echidna'], consorts:[],
  blurb:"Two heads grow for every one cut off. Heracles' second labour only worked once his nephew started cauterising the stumps — and Hera sent a crab to make it harder.",
  src:"Hes. Theog. 313–318; Apollod. Bibl. 2.5.2" },

{ id:'chimera', name:'The Chimera', age:'olympian', kind:'monster', rank:2,
  domain:'Lion, goat and serpent', parents:['typhon','echidna'], consorts:[],
  blurb:"A lion in front, a goat rising from its back, a snake for a tail, breathing fire. Bellerophon killed it from the air on Pegasus with a lump of lead on his spear.",
  src:"Hom. Il. 6.179–183; Hes. Theog. 319–325" },

{ id:'orthrus', name:'Orthrus', age:'olympian', kind:'monster', rank:3,
  domain:'Two-headed hound', parents:['typhon','echidna'], consorts:['echidna'],
  blurb:"Cerberus's brother, guarding Geryon's cattle. Heracles clubbed him first, on the way to the main event.",
  src:"Hes. Theog. 309; Apollod. Bibl. 2.5.10" },

{ id:'sphinx', name:'The Sphinx', age:'olympian', kind:'monster', rank:2,
  domain:'The riddle at Thebes', parents:['orthrus','echidna'], consorts:[],
  blurb:"Lion's body, woman's face, wings. She strangled everyone who failed her riddle until Oedipus answered it — and then destroyed herself.",
  src:"Hes. Theog. 326–327; Apollod. Bibl. 3.5.8" },

{ id:'nemeanlion', name:'The Nemean Lion', age:'olympian', kind:'monster', rank:3,
  domain:'Impervious hide', parents:['orthrus','echidna'], consorts:[],
  blurb:"No weapon would cut it, so Heracles strangled it and then skinned it with its own claws. He wore the pelt for the rest of his life.",
  src:"Hes. Theog. 326–332; Apollod. Bibl. 2.5.1" },

{ id:'charybdis', name:'Charybdis', age:'olympian', kind:'monster', rank:2,
  domain:'The whirlpool', parents:['poseidon','gaia'], consorts:[],
  blurb:"She swallows the sea three times a day and vomits it back. On one side of the strait, Scylla takes six men; on the other, Charybdis takes everything.",
  src:"Hom. Od. 12.101–110, 234–259" },

{ id:'minotaur', name:'The Minotaur', age:'mortal', kind:'monster', rank:1,
  domain:'Bull of Minos', parents:['pasiphae','cretanbull'], consorts:[],
  blurb:"Bull-headed son of the queen of Crete, kept in a labyrinth built to be inescapable and fed on Athenian tribute — fourteen young people every nine years, until Theseus.",
  src:"Apollod. Bibl. 3.1.4, 3.15.8; Plut. Thes." },

/* ------------------------------------------------------- mortal & heroic age */
{ id:'pandora', name:'Pandora', age:'mortal', kind:'mortal', rank:2,
  domain:'The first woman', parents:[], consorts:['epimetheus'],
  blurb:"Made on Zeus's orders as the price of stolen fire, with gifts from every god and a jar she was told not to open. Everything escaped except Hope, which stayed under the rim.",
  src:"Hes. Op. 53–105" },

{ id:'deucalion', name:'Deucalion', age:'mortal', kind:'mortal', rank:2,
  domain:'Survivor of the flood', parents:['prometheus'], consorts:['pyrrha'],
  blurb:"Warned by his father, he built a chest and rode out the nine-day flood Zeus sent to erase humanity. He and his wife repopulated the world by throwing stones over their shoulders.",
  src:"Apollod. Bibl. 1.7.2; Ov. Met. 1.313–415" },

{ id:'pyrrha', name:'Pyrrha', age:'mortal', kind:'mortal', rank:3,
  domain:'Survivor of the flood', parents:['epimetheus','pandora'], consorts:['deucalion'],
  blurb:"Pandora's daughter, and with Deucalion one of the only two people left alive after the flood.",
  src:"Apollod. Bibl. 1.7.2; Ov. Met. 1.313–415" },

{ id:'hellen', name:'Hellen', age:'mortal', kind:'mortal', rank:3,
  domain:'Ancestor of the Greeks', parents:['deucalion','pyrrha'], consorts:[],
  blurb:"The Greeks called themselves Hellenes after him: the founding ancestor whose sons divided into the Dorians, Aeolians and Ionians.",
  src:"Apollod. Bibl. 1.7.3" },

{ id:'aeolus', name:'Aeolus', age:'mortal', kind:'mortal', rank:3,
  domain:'Founder of the Aeolians', parents:['hellen'], consorts:[],
  blurb:"Ancestor of a sprawling and mostly disastrous family — Sisyphus, Athamas, Cretheus and their descendants. Often confused with the later keeper of the winds.",
  src:"Apollod. Bibl. 1.7.3" },

{ id:'sisyphus', name:'Sisyphus', age:'mortal', kind:'mortal', rank:2,
  domain:'The rolled stone', parents:['aeolus'], consorts:[],
  blurb:"He informed on Zeus, chained Death, and talked his way out of the underworld twice. His punishment was designed to be labour that never accumulates: the boulder always rolls back.",
  src:"Hom. Od. 11.593–600; Apollod. Bibl. 1.9.3" },

{ id:'bellerophon', name:'Bellerophon', age:'mortal', kind:'mortal', rank:2,
  domain:'Rider of Pegasus', descent:'sisyphus', parents:[], consorts:[],
  blurb:"He killed the Chimera from horseback in the air, then tried to fly to Olympus. Zeus sent a gadfly; Pegasus bucked, and he spent his last years lame and alone.",
  src:"Hom. Il. 6.155–202; Pind. Isthm. 7" },

{ id:'jason', name:'Jason', age:'mortal', kind:'mortal', rank:1,
  domain:'Leader of the Argonauts', parents:['aeson'], consorts:['medea'],
  blurb:"Sent for the Golden Fleece on an errand meant to kill him, he assembled the best crew in Greece and came back with it — because Medea did the actual work. Abandoning her later cost him everything.",
  src:"A.R. Argon.; Eur. Med." },

{ id:'pelias', name:'Pelias', age:'mortal', kind:'mortal', rank:3,
  domain:'Usurper of Iolcus', parents:['poseidon','tyro'], consorts:[],
  blurb:"Warned about a man with one sandal, he sent Jason after the Fleece. Medea persuaded his daughters that boiling him would restore his youth.",
  src:"Apollod. Bibl. 1.9.8–27; Pind. Pyth. 4" },

{ id:'medea', name:'Medea', age:'mortal', kind:'mortal', rank:1,
  domain:'Sorceress of Colchis', parents:['aeetes'], consorts:['jason'],
  blurb:"Granddaughter of the Sun and a genuine magician. She won Jason the Fleece, killed for him repeatedly, and when he left her for a younger royal marriage she destroyed his bride and their two children and left in a chariot drawn by dragons.",
  src:"Eur. Med." },

{ id:'atalanta', name:'Atalanta', age:'mortal', kind:'mortal', rank:2,
  domain:'Huntress and runner', parents:[], peer:'jason', consorts:[],
  blurb:"Exposed at birth for being a girl and raised by a bear, she drew first blood on the Calydonian boar and would only marry a man who could outrun her. Three golden apples finally slowed her down.",
  src:"Apollod. Bibl. 3.9.2; Ov. Met. 10.560–680" },

{ id:'io', name:'Io', age:'mortal', kind:'mortal', rank:2,
  domain:'Priestess turned heifer', parents:['inachus'], consorts:['zeus'],
  blurb:"Zeus turned her into a white cow to hide the affair; Hera asked for the cow as a gift and set hundred-eyed Argus to watch it, then a gadfly to drive it across the world. She recovered her shape in Egypt.",
  src:"Aesch. PV 561–886; Ov. Met. 1.583–750" },

{ id:'epaphus', name:'Epaphus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Egypt', parents:['zeus','io'], consorts:[],
  blurb:"Conceived by a touch of Zeus's hand at the end of Io's wanderings, and founder of the Egyptian branch of the family.",
  src:"Aesch. PV 846–852; Apollod. Bibl. 2.1.3" },

{ id:'libya', name:'Libya', age:'mortal', kind:'mortal', rank:3,
  domain:'Eponym of Africa', parents:['epaphus'], consorts:['poseidon'],
  blurb:"The land west of Egypt took her name. Her sons split the family into the Egyptian and Phoenician lines.",
  src:"Apollod. Bibl. 2.1.4" },

{ id:'belus', name:'Belus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Egypt', parents:['poseidon','libya'], consorts:[],
  blurb:"Father of the twin brothers Danaus and Aegyptus, whose quarrel sent one branch of the family back to Greece.",
  src:"Apollod. Bibl. 2.1.4" },

{ id:'agenor', name:'Agenor', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Tyre', parents:['poseidon','libya'], consorts:[],
  blurb:"When Europa vanished he sent his sons after her with orders not to come back without her. None of them did — one of them founded Thebes instead.",
  src:"Apollod. Bibl. 3.1.1" },

{ id:'danaus', name:'Danaus', age:'mortal', kind:'mortal', rank:3,
  domain:'Founder of Argos', parents:['belus'], consorts:[],
  blurb:"He fled to Argos with fifty daughters rather than marry them to his brother's fifty sons, then ordered them to kill their husbands on the wedding night. Forty-nine obeyed.",
  src:"Apollod. Bibl. 2.1.4–5; Aesch. Supp." },

{ id:'europa', name:'Europa', age:'mortal', kind:'mortal', rank:2,
  domain:'Carried to Crete', parents:['agenor'], consorts:['zeus'],
  blurb:"Zeus came to the beach as a white bull so gentle she climbed on his back, then swam to Crete with her. A continent is named after her.",
  src:"Ov. Met. 2.833–875; Apollod. Bibl. 3.1.1" },

{ id:'cadmus', name:'Cadmus', age:'mortal', kind:'mortal', rank:2,
  domain:'Founder of Thebes', parents:['agenor'], consorts:['harmonia'],
  blurb:"Searching for his sister, he was told to follow a cow and build where it lay down. He killed the dragon there and sowed its teeth; armed men grew from the ground and fought until five were left, who became Thebes.",
  src:"Apollod. Bibl. 3.4.1–2; Ov. Met. 3.1–130" },

{ id:'semele', name:'Semele', age:'mortal', kind:'mortal', rank:2,
  domain:'Mother of Dionysus', parents:['cadmus','harmonia'], consorts:['zeus'],
  blurb:"Hera, disguised as her nurse, talked her into asking Zeus to appear in his true form. He had already sworn to grant any wish; the sight burned her to ash, and he sewed the unborn child into his thigh.",
  src:"Ov. Met. 3.253–315; Apollod. Bibl. 3.4.3" },

{ id:'ino', name:'Ino', age:'mortal', kind:'mortal', rank:3,
  domain:'Sea-goddess Leucothea', parents:['cadmus','harmonia'], consorts:[],
  blurb:"She raised the infant Dionysus, was driven mad by Hera, and leapt into the sea with her son — where both became kindly sea-divinities. She lent Odysseus the veil that kept him afloat.",
  src:"Hom. Od. 5.333–353; Apollod. Bibl. 3.4.3" },

{ id:'polydorus', name:'Polydorus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Thebes', parents:['cadmus','harmonia'], consorts:[],
  blurb:"Cadmus's son and heir, through whom the Theban curse descends to Laius and Oedipus.",
  src:"Apollod. Bibl. 3.5.5" },

{ id:'laius', name:'Laius', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Thebes', parents:['labdacus'], consorts:['jocasta'],
  blurb:"Told his son would kill him, he pinned the baby's ankles and left it on a mountain. Years later a stranger at a crossroads refused to give way, and he was killed in the argument.",
  src:"Soph. OT 711–813" },

{ id:'jocasta', name:'Jocasta', age:'mortal', kind:'mortal', rank:3,
  domain:'Queen of Thebes', parents:[], consorts:['laius','oedipus'],
  blurb:"She married the man who solved the Sphinx's riddle and had four children with him before learning he was the son she had given up.",
  src:"Soph. OT" },

{ id:'oedipus', name:'Oedipus', age:'mortal', kind:'mortal', rank:1,
  domain:'Solver of the riddle', parents:['laius','jocasta'], consorts:['jocasta'],
  blurb:"Every step he took to escape the prophecy carried it out. He answered the Sphinx, saved Thebes, married the queen — and the plague that came later was his own doing. He blinded himself when he understood.",
  src:"Soph. OT" },

{ id:'antigone', name:'Antigone', age:'mortal', kind:'mortal', rank:2,
  domain:'The unburied brother', parents:['oedipus','jocasta'], consorts:[],
  blurb:"Forbidden on pain of death to bury her brother, she did it anyway and argued that the unwritten law outranked the king's. Sophocles gives both sides a real case.",
  src:"Soph. Ant." },

{ id:'acrisius', name:'Acrisius', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Argos', descent:'danaus', parents:[], consorts:[],
  blurb:"Told his grandson would kill him, he locked his daughter in a bronze chamber. Years later he was hit by a discus at the games — thrown by Perseus.",
  src:"Apollod. Bibl. 2.4.1–4" },

{ id:'danae', name:'Danae', age:'mortal', kind:'mortal', rank:2,
  domain:'Mother of Perseus', parents:['acrisius'], consorts:['zeus'],
  blurb:"Sealed underground to keep her childless, she was reached by Zeus as a shower of gold. Her father set her and the baby adrift in a wooden chest.",
  src:"Apollod. Bibl. 2.4.1" },

{ id:'perseus', name:'Perseus', age:'mortal', kind:'mortal', rank:1,
  domain:'Slayer of Medusa', parents:['zeus','danae'], consorts:['andromeda'],
  blurb:"The one major hero whose story ends well. With winged sandals, a cap of invisibility and a mirrored shield he took the Gorgon's head, used it to save Andromeda and to petrify a usurper, and then retired to found Mycenae.",
  src:"Apollod. Bibl. 2.4.1–5" },

{ id:'andromeda', name:'Andromeda', age:'mortal', kind:'mortal', rank:2,
  domain:'Chained to the rock', parents:[], consorts:['perseus'],
  blurb:"Her mother boasted of being lovelier than the Nereids, so Poseidon sent a sea-monster and an oracle demanded the princess. Perseus arrived mid-sacrifice. Her whole family ended up as constellations.",
  src:"Apollod. Bibl. 2.4.3; Ov. Met. 4.663–764" },

{ id:'alcmene', name:'Alcmene', age:'mortal', kind:'mortal', rank:2,
  domain:'Mother of Heracles', descent:'perseus', parents:[], consorts:['zeus','amphitryon'],
  blurb:"Zeus came to her wearing her husband's face and made the night three times its normal length. Her real husband arrived the following evening; she bore twins with different fathers.",
  src:"Apollod. Bibl. 2.4.8; Hes. Sc. 1–56" },

{ id:'heracles', name:'Heracles', aka:'Hercules', age:'mortal', kind:'mortal', rank:1,
  domain:'The twelve labours', parents:['zeus','alcmene'], consorts:['megara','deianira','hebe'],
  blurb:"Hera sent snakes to his cradle and madness to his adulthood; the labours were penance for killing his own family under it. Strength as endurance rather than triumph — and at the end, a place among the gods.",
  src:"Apollod. Bibl. 2.4.8–2.7.7" },

{ id:'deianira', name:'Deianira', age:'mortal', kind:'mortal', rank:3,
  domain:'The poisoned robe', parents:[], consorts:['heracles'],
  blurb:"A dying centaur told her his blood was a love charm. Years later, worried about a rival, she soaked her husband's robe in it — and it burned him past any cure.",
  src:"Soph. Trach." },

{ id:'tantalus', name:'Tantalus', age:'mortal', kind:'mortal', rank:3,
  domain:'Eternal thirst', parents:['zeus'], consorts:[],
  blurb:"He served his own son to the gods at dinner to test them. In the underworld he stands in water that drains when he stoops and under fruit that lifts when he reaches — hence 'tantalise'.",
  src:"Hom. Od. 11.582–592; Pind. Ol. 1" },

{ id:'pelops', name:'Pelops', age:'mortal', kind:'mortal', rank:3,
  domain:'The Peloponnese', parents:['tantalus'], consorts:['hippodamia'],
  blurb:"Restored to life with an ivory shoulder after his father's dinner, he won his bride by sabotaging her father's chariot — and the curse the dying charioteer laid on him ran through his house for four generations.",
  src:"Pind. Ol. 1; Apollod. Epit. 2.3–9" },

{ id:'hippodamia', name:'Hippodamia', age:'mortal', kind:'mortal', rank:3,
  domain:'Won by a chariot race', parents:[], consorts:['pelops'],
  blurb:"Her father raced every suitor and speared each one he overtook. Pelops bribed the charioteer to replace the linchpins with wax.",
  src:"Apollod. Epit. 2.4–9; Hyg. Fab. 84" },

{ id:'atreus', name:'Atreus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Mycenae', parents:['pelops','hippodamia'], consorts:[],
  blurb:"He served his brother Thyestes a meal made of Thyestes' own children, and told him what it was afterwards. The vengeance came back through the next generation.",
  src:"Apollod. Epit. 2.10–13; Aesch. Ag. 1583–1602" },

{ id:'thyestes', name:'Thyestes', age:'mortal', kind:'mortal', rank:3,
  domain:'The rival brother', parents:['pelops','hippodamia'], consorts:[],
  blurb:"He seduced his brother's wife and stole the throne, and paid for it at that dinner. His surviving son Aegisthus was raised to settle the account.",
  src:"Apollod. Epit. 2.10–14; Aesch. Ag." },

{ id:'pittheus', name:'Pittheus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Troezen', parents:['pelops','hippodamia'], consorts:[],
  blurb:"Reputed the wisest man of his day. He understood an oracle Aegeus did not, and arranged for his own daughter to be the one Aegeus spent the night with.",
  src:"Apollod. Bibl. 3.15.6–7; Plut. Thes. 3" },
