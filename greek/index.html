{ id:'aethra', name:'Aethra', age:'mortal', kind:'mortal', rank:3,
  domain:'Mother of Theseus', parents:['pittheus'], consorts:['aegeus'],
  blurb:"She showed her son the rock where his father had left a sword and sandals, to be lifted when he was strong enough.",
  src:"Apollod. Bibl. 3.15.7, 3.16.1; Plut. Thes. 4–6" },

{ id:'aegeus', name:'Aegeus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Athens', descent:'erichthonius', parents:[], consorts:['aethra'],
  blurb:"He asked his son to hoist a white sail if he survived Crete. Theseus forgot; Aegeus, watching from the cliff, saw black and threw himself into the sea that now bears his name.",
  src:"Apollod. Epit. 1.7–10; Plut. Thes. 22" },

{ id:'erichthonius', name:'Erichthonius', age:'mortal', kind:'mortal', rank:3,
  domain:'Earth-born king of Athens', parents:['hephaestus','gaia'], consorts:[],
  blurb:"Conceived when Hephaestus's attempt on Athena ended on the ground, so the Earth bore him and Athena raised him in a box. The Athenian kings claimed descent from the soil through him.",
  src:"Apollod. Bibl. 3.14.6" },

{ id:'daedalus', name:'Daedalus', age:'mortal', kind:'mortal', rank:2,
  domain:'The master craftsman', descent:'erichthonius', parents:[], consorts:[],
  blurb:"Athenian inventor exiled for murdering a nephew whose talent frightened him. He built the labyrinth, then had to escape from it — and his solution killed his son.",
  src:"Apollod. Bibl. 3.15.8; Ov. Met. 8.183–235" },

{ id:'icarus', name:'Icarus', age:'mortal', kind:'mortal', rank:3,
  domain:'Flew too high', parents:['daedalus'], consorts:[],
  blurb:"Told to fly the middle course — low and the sea soaks the feathers, high and the sun melts the wax. He went high.",
  src:"Ov. Met. 8.183–235" },

{ id:'theseus', name:'Theseus', age:'mortal', kind:'mortal', rank:1,
  domain:'Hero and king of Athens', parents:['aegeus','aethra'], consorts:['ariadne','phaedra','hippolyta'],
  blurb:"He volunteered for the tribute to Crete and killed the Minotaur, then went on to unify Attica. The Athenians made him their model citizen-king; his private life was a catalogue of abandoned women.",
  src:"Plut. Thes.; Apollod. Epit. 1" },

{ id:'minos', name:'Minos', age:'mortal', kind:'mortal', rank:1,
  domain:'King of Crete', parents:['zeus','europa'], consorts:['pasiphae'],
  blurb:"He asked Poseidon for a bull as proof of his right to rule, then kept it — and everything that followed came from that. After death he became one of the three judges of the dead.",
  src:"Apollod. Bibl. 3.1.2–3; Hom. Od. 11.568–571" },

{ id:'rhadamanthys', name:'Rhadamanthys', age:'mortal', kind:'mortal', rank:3,
  domain:'Judge of the dead', parents:['zeus','europa'], consorts:[],
  blurb:"So famously just in life that he was made a judge in the underworld, and given the Elysian Fields to rule.",
  src:"Hom. Od. 4.561–569; Pind. Ol. 2" },

{ id:'sarpedon', name:'Sarpedon', age:'mortal', kind:'mortal', rank:3,
  domain:'Lycian at Troy', parents:['zeus','europa'], consorts:[],
  blurb:"Zeus considered saving him from death at Patroclus's hands and was told that if he did, every god would want the same. He let him fall and wept tears of blood. Homer makes him Zeus's son by Laodamia; calling him Europa's, as here, stretches one Sarpedon across three generations to reach the same war.",
  src:"Hom. Il. 16.419–461; Apollod. Bibl. 3.1.2" },

{ id:'ariadne', name:'Ariadne', age:'mortal', kind:'mortal', rank:2,
  domain:'The thread', parents:['minos','pasiphae'], consorts:['theseus','dionysus'],
  blurb:"She gave Theseus the thread that got him out of the labyrinth, sailed with him, and was left asleep on Naxos. Dionysus found her there and married her; her crown is a constellation.",
  src:"Apollod. Epit. 1.8–9; Hes. Theog. 947–949" },

{ id:'phaedra', name:'Phaedra', age:'mortal', kind:'mortal', rank:3,
  domain:'Queen of Athens', parents:['minos','pasiphae'], consorts:['theseus'],
  blurb:"Ariadne's sister, married to the man who abandoned her, and struck by Aphrodite with a desire for her own stepson. Her false accusation killed him.",
  src:"Eur. Hipp." },

{ id:'hippolyta', name:'Hippolyta', age:'olympian', kind:'mortal', rank:2,
  domain:'Queen of the Amazons', parents:['ares'], consorts:['theseus'],
  blurb:"Her war-belt was Heracles' ninth labour. She was willing to hand it over until Hera spread a rumour among the Amazons that the visitors were abducting their queen.",
  src:"Apollod. Bibl. 2.5.9" },

{ id:'hippolytus', name:'Hippolytus', age:'mortal', kind:'mortal', rank:3,
  domain:'Devoted to Artemis', parents:['theseus','hippolyta'], consorts:[],
  blurb:"He worshipped Artemis and refused Aphrodite entirely — an imbalance the goddess corrected through his stepmother. His father's curse killed him on the shore road.",
  src:"Eur. Hipp." },

{ id:'tyndareus', name:'Tyndareus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Sparta', descent:'perseus', parents:[], consorts:['leda'],
  blurb:"Facing a hall full of armed suitors for Helen, he took Odysseus's advice and made every one of them swear to defend whoever won her. That oath is why Greece went to Troy.",
  src:"Apollod. Bibl. 3.10.8–9; Hes. fr. (Cat.)" },

{ id:'leda', name:'Leda', age:'mortal', kind:'mortal', rank:2,
  domain:'The swan', parents:[], consorts:['tyndareus','zeus'],
  blurb:"Visited by Zeus as a swan on the same night as her husband, she produced two eggs and four children of mixed parentage — two mortal, two not.",
  src:"Apollod. Bibl. 3.10.6–7" },

{ id:'helen', name:'Helen', age:'mortal', kind:'mortal', rank:1,
  domain:'The face that launched the ships', parents:['zeus','leda'], consorts:['menelaus','paris','deiphobus'],
  blurb:"Promised to Paris by Aphrodite when she was already married. Whether she left willingly is the question every ancient author answers differently — one version says only a phantom went to Troy.",
  src:"Hom. Il. 3; Eur. Hel." },

{ id:'clytemnestra', name:'Clytemnestra', age:'mortal', kind:'mortal', rank:2,
  domain:'Queen of Mycenae', parents:['tyndareus','leda'], consorts:['agamemnon','aegisthus'],
  blurb:"Her husband sacrificed their daughter for a favourable wind. She waited ten years, welcomed him home on a purple carpet, and killed him in his bath.",
  src:"Aesch. Ag." },

{ id:'castor', name:'Castor', age:'mortal', kind:'mortal', rank:3,
  domain:'Horseman, one of the Dioscuri', parents:['tyndareus','leda'], consorts:[],
  blurb:"Mortal twin to an immortal brother. When he was killed, Polydeuces refused Olympus without him; Zeus let them alternate between the underworld and the sky.",
  src:"Pind. Nem. 10; Hom. Od. 11.298–304" },

{ id:'polydeuces', name:'Polydeuces', aka:'Pollux', age:'mortal', kind:'mortal', rank:3,
  domain:'Boxer, one of the Dioscuri', parents:['zeus','leda'], consorts:[],
  blurb:"The immortal twin, and an unbeatable boxer. Together the brothers became the constellation Gemini and the lights that appear on masts in a storm.",
  src:"Pind. Nem. 10; h.Hom. 33" },

{ id:'agamemnon', name:'Agamemnon', age:'mortal', kind:'mortal', rank:1,
  domain:'Commander at Troy', parents:['atreus'], consorts:['clytemnestra'],
  blurb:"He held the largest army in Greece together for ten years and quarrelled with his best fighter over a captive woman, nearly losing the war. He sacrificed his daughter to sail, and his wife was waiting when he got back.",
  src:"Hom. Il. 1; Aesch. Ag." },

{ id:'menelaus', name:'Menelaus', age:'mortal', kind:'mortal', rank:2,
  domain:'King of Sparta', parents:['atreus'], consorts:['helen'],
  blurb:"The husband Helen left. He called in the suitors' oath, fought the war, and — in the one gentle ending of the whole cycle — took her home to Sparta and lived out his life with her.",
  src:"Hom. Od. 4.1–305" },

{ id:'aegisthus', name:'Aegisthus', age:'mortal', kind:'mortal', rank:3,
  domain:'The waiting cousin', parents:['thyestes'], consorts:['clytemnestra'],
  blurb:"Born to avenge his father's dinner. He stayed home from the war, took Agamemnon's wife and throne, and ruled for seven years before Orestes came back.",
  src:"Hom. Od. 3.303–310; Aesch. Ag." },

{ id:'orestes', name:'Orestes', age:'mortal', kind:'mortal', rank:2,
  domain:'Avenger and defendant', parents:['agamemnon','clytemnestra'], consorts:[],
  blurb:"Ordered by Apollo to avenge his father, which meant killing his mother, which set the Furies on him. The trial that acquitted him replaced the blood feud with the law court.",
  src:"Aesch. Cho., Eum." },

{ id:'electra', name:'Electra', age:'mortal', kind:'mortal', rank:3,
  domain:'The waiting sister', parents:['agamemnon','clytemnestra'], consorts:[],
  blurb:"She kept her father's memory alive in a hostile house for years and pushed her brother into the killing when he arrived.",
  src:"Soph. El." },

{ id:'iphigenia', name:'Iphigenia', age:'mortal', kind:'mortal', rank:3,
  domain:'Sacrificed for a wind', parents:['agamemnon','clytemnestra'], consorts:[],
  blurb:"Summoned to Aulis on the promise of marriage to Achilles and killed at the altar so the fleet could sail. In a kinder version Artemis swapped a deer for her at the last moment.",
  src:"Eur. IA; Eur. IT 1–30" },

{ id:'dardanus', name:'Dardanus', age:'mortal', kind:'mortal', rank:3,
  domain:'Founder of the Trojan line', parents:['zeus'], consorts:[],
  blurb:"He crossed to Asia after a flood and founded the city that became Troy. The strait beside it is still the Dardanelles.",
  src:"Hom. Il. 20.215–230; Apollod. Bibl. 3.12.1" },

{ id:'priam', name:'Priam', age:'mortal', kind:'mortal', rank:2,
  domain:'King of Troy', parents:['laomedon'], consorts:['hecuba'],
  blurb:"He outlived nearly all of fifty sons. The Iliad ends with him crossing enemy lines alone to kiss the hands of the man who killed Hector and ask for the body back.",
  src:"Hom. Il. 24.468–676" },

{ id:'hecuba', name:'Hecuba', age:'mortal', kind:'mortal', rank:3,
  domain:'Queen of Troy', parents:[], consorts:['priam'],
  blurb:"She dreamed she gave birth to a torch that burned the city, and was told to expose the baby. She kept Paris instead.",
  src:"Apollod. Bibl. 3.12.5; Eur. Tro." },

{ id:'hector', name:'Hector', age:'mortal', kind:'mortal', rank:1,
  domain:'Defender of Troy', parents:['priam','hecuba'], consorts:['andromache'],
  blurb:"The one man in the Iliad fighting for something other than glory. He knew the city would fall and went out anyway; his farewell to his wife and son is the poem's quietest and worst moment.",
  src:"Hom. Il. 6.369–502, 22" },

{ id:'paris', name:'Paris', age:'mortal', kind:'mortal', rank:1,
  domain:'The judgement', parents:['priam','hecuba'], consorts:['helen'],
  blurb:"Asked to award a golden apple to the fairest goddess, he took Aphrodite's bribe over power and victory. He also killed Achilles — with an arrow, at a distance, which is exactly how his brother's world saw him.",
  src:"Hom. Il. 3, 24.25–30; Apollod. Epit. 5.3" },

{ id:'cassandra', name:'Cassandra', age:'mortal', kind:'mortal', rank:2,
  domain:'True prophecy, never believed', parents:['priam','hecuba'], consorts:[],
  blurb:"Apollo gave her foresight to win her and, refused, added the curse that no one would believe her. She described the fall of Troy in detail while it was still preventable.",
  src:"Aesch. Ag. 1202–1212" },

{ id:'ganymede', name:'Ganymede', age:'mortal', kind:'mortal', rank:3,
  domain:'Cupbearer of the gods', descent:'dardanus', parents:[], consorts:[],
  blurb:"The handsomest mortal alive, carried up by Zeus in the form of an eagle to pour the wine on Olympus. His father was compensated with a team of immortal horses.",
  src:"Hom. Il. 20.231–235; h.Hom.Aphr. 202–217" },

{ id:'anchises', name:'Anchises', age:'mortal', kind:'mortal', rank:3,
  domain:'Loved by Aphrodite', descent:'dardanus', parents:[], consorts:['aphrodite'],
  blurb:"She came to him disguised as a mortal princess; he boasted about it afterwards and was lamed for it. His son carried him out of burning Troy on his back.",
  src:"h.Hom.Aphr.; Verg. Aen. 2.705–729" },

{ id:'aeneas', name:'Aeneas', age:'mortal', kind:'mortal', rank:1,
  domain:'Survivor of Troy', parents:['anchises','aphrodite'], consorts:[],
  blurb:"A secondary figure in Homer who becomes the hero of Virgil's Aeneid: he carries his father out of the burning city and sails west, and Rome traces its founding to his line.",
  src:"Hom. Il. 20.79–352; Verg. Aen." },

{ id:'aeacus', name:'Aeacus', age:'mortal', kind:'mortal', rank:3,
  domain:'Judge of the dead', parents:['zeus'], consorts:[],
  blurb:"When plague emptied his island he prayed to Zeus, who turned the ants into people. The third judge of the dead, alongside Minos and Rhadamanthys.",
  src:"Ov. Met. 7.517–660; Pl. Grg. 523e–524a" },

{ id:'peleus', name:'Peleus', age:'mortal', kind:'mortal', rank:3,
  domain:'Husband of a goddess', parents:['aeacus'], consorts:['thetis'],
  blurb:"He held onto Thetis while she became fire, water, a lion and a serpent, and won her. Their wedding was the party that Eris crashed.",
  src:"Apollod. Bibl. 3.13.5; Pind. Nem. 4" },

{ id:'telamon', name:'Telamon', age:'mortal', kind:'mortal', rank:3,
  domain:'Sacker of Troy', parents:['aeacus'], consorts:[],
  blurb:"He sailed with Heracles on the first, successful attack on Troy — a generation before the famous one — and was first over the wall.",
  src:"Apollod. Bibl. 2.6.4; Pind. Isthm. 6" },

{ id:'ajax', name:'Ajax', age:'mortal', kind:'mortal', rank:2,
  domain:'The great shield', parents:['telamon'], consorts:[],
  blurb:"The largest of the Greeks and the only one never wounded, holding the line with a shield like a tower. When Achilles' armour was awarded to Odysseus instead, the slight destroyed him.",
  src:"Hom. Il. 7.181–312; Soph. Aj." },

{ id:'achilles', name:'Achilles', age:'mortal', kind:'mortal', rank:1,
  domain:'The best of the Achaeans', parents:['peleus','thetis'], consorts:[],
  blurb:"Offered a long obscure life or a short famous one, he chose fame — then spent most of the Iliad refusing to fight over an insult. Patroclus's death brought him back, and his own followed as he had always known it would.",
  src:"Hom. Il. 9.410–416, 18–22" },

{ id:'neoptolemus', name:'Neoptolemus', age:'mortal', kind:'mortal', rank:3,
  domain:'Achilles’ son at Troy', parents:['achilles'], consorts:[],
  blurb:"Fetched from Scyros because Troy could not fall without him. He came out of the wooden horse and killed Priam at the altar.",
  src:"Apollod. Epit. 5.10–21; Verg. Aen. 2.526–558" },

{ id:'laertes', name:'Laertes', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Ithaca', descent:'zeus', parents:[], consorts:['anticlea'],
  blurb:"He gave up the throne and went to live on a farm while his son was away, and was still there twenty years later, digging, when Odysseus finally came to find him.",
  src:"Hom. Od. 24.205–348" },

{ id:'odysseus', name:'Odysseus', aka:'Ulysses', age:'mortal', kind:'mortal', rank:1,
  domain:'The man of many turns', parents:['laertes','anticlea'], consorts:['penelope'],
  blurb:"He thought of the wooden horse and then took ten years to get home from it, losing every ship and every man. His weapon is patience — he waits in his own hall disguised as a beggar rather than strike early.",
  src:"Hom. Od." },

{ id:'penelope', name:'Penelope', age:'mortal', kind:'mortal', rank:2,
  domain:'The unfinished shroud', parents:[], consorts:['odysseus'],
  blurb:"Besieged by suitors for years, she promised to choose when the weaving was done and unpicked it every night. She tested her husband at the end too, and he passed.",
  src:"Hom. Od. 2.85–110, 23.173–230" },

{ id:'telemachus', name:'Telemachus', age:'mortal', kind:'mortal', rank:3,
  domain:'The son who goes looking', parents:['odysseus','penelope'], consorts:[],
  blurb:"An infant when his father left. The Odyssey opens with him leaving home to ask older men what became of him — and he fights beside him in the hall at the end.",
  src:"Hom. Od. 1–4, 22" },

{ id:'orpheus', name:'Orpheus', age:'mortal', kind:'mortal', rank:1,
  domain:'The singer', parents:['calliope'], consorts:['eurydice'],
  blurb:"His music stopped rivers and moved stones. He talked the rulers of the dead into releasing his wife on one condition, and broke it a few steps from the light. His father is sometimes Apollo, sometimes the Thracian king Oeagrus.",
  src:"Ov. Met. 10.1–85; Apollod. Bibl. 1.3.2" },

{ id:'eurydice', name:'Eurydice', age:'mortal', kind:'mortal', rank:2,
  domain:'Lost twice', parents:[], consorts:['orpheus'],
  blurb:"Killed by a snake on her wedding day and almost recovered. In Virgil's telling she calls out as she is drawn back — and is not angry.",
  src:"Verg. G. 4.453–527" },

{ id:'tiresias', name:'Tiresias', age:'mortal', kind:'mortal', rank:2,
  domain:'The blind prophet', parents:[], peer:'jocasta', consorts:[],
  blurb:"He lived seven years as a woman, judged a quarrel between Zeus and Hera about which sex enjoys love more, and was blinded for the answer and given prophecy in exchange. He advised Thebes for seven generations, and kept his mind after death.",
  src:"Ov. Met. 3.316–338; Hom. Od. 10.490–495" },

/* ------------------------------------- the transformed and the late-comers */
/* Figures whose stories are told about them rather than through their line.
   Most were left out of the first pass because they have no descent to draw;
   they hang on a `peer` row and on the ties in ties.js instead. */

{ id:'cephissus', name:'Cephissus', age:'titan', kind:'god', rank:3,
  domain:'River of Boeotia', parents:['oceanus','tethys'], consorts:[],
  blurb:"A river god, remembered almost entirely as the father of a boy who could not stop looking at water.",
  src:"Ov. Met. 3.341–346" },

{ id:'peneus', name:'Peneus', age:'titan', kind:'god', rank:3,
  domain:'River of Thessaly', parents:['oceanus','tethys'], consorts:[],
  blurb:"The river through the vale of Tempe. When his daughter begged for help, he answered by changing her into a tree.",
  src:"Ov. Met. 1.452–567" },

{ id:'narcissus', name:'Narcissus', age:'mortal', kind:'mortal', rank:2,
  domain:'In love with his reflection', parents:['cephissus'], consorts:[],
  blurb:"Told he would live long if he never knew himself. He knelt at a pool, fell in love with the face looking back, and could not leave it.",
  src:"Ov. Met. 3.339–510" },

{ id:'echo', name:'Echo', age:'mortal', kind:'mortal', rank:3,
  domain:'Only the last words', parents:[], peer:'narcissus', consorts:[],
  blurb:"A nymph who covered for Zeus's affairs with chatter, and was left able only to repeat what others said. She loved Narcissus and could not tell him so.",
  src:"Ov. Met. 3.356–401" },

{ id:'autonoe', name:'Autonoe', age:'mortal', kind:'mortal', rank:3,
  domain:'Daughter of Thebes', parents:['cadmus','harmonia'], consorts:[],
  blurb:"One of Cadmus's four daughters, and one of the three who came to grief through a son.",
  src:"Hes. Theog. 975–978; Apollod. Bibl. 3.4.2" },

{ id:'actaeon', name:'Actaeon', age:'mortal', kind:'mortal', rank:3,
  domain:'The hunter who saw too much', parents:['autonoe'], consorts:[],
  blurb:"He came on Artemis bathing, by accident. She turned him into a stag and his own fifty hounds did the rest, not knowing him.",
  src:"Ov. Met. 3.138–252" },

{ id:'agave', name:'Agave', age:'mortal', kind:'mortal', rank:3,
  domain:'Mother of Pentheus', parents:['cadmus','harmonia'], consorts:[],
  blurb:"She denied that her sister Semele had lain with Zeus, and denied the god that came of it — until he put the denial out of her.",
  src:"Eur. Bacch. 26–31, 1114–1147" },

{ id:'pentheus', name:'Pentheus', age:'mortal', kind:'mortal', rank:2,
  domain:'King who refused the god', parents:['agave'], consorts:[],
  blurb:"He banned the rites of Dionysus in Thebes and went up the mountain to spy on them. The women took him for a lion; his mother was first to reach him.",
  src:"Eur. Bacch." },

{ id:'niobe', name:'Niobe', age:'mortal', kind:'mortal', rank:2,
  domain:'The boast about children', parents:['tantalus'], consorts:[],
  blurb:"She had fourteen children and said so, in front of a goddess with two. Apollo and Artemis shot every one. She wept until she turned to stone, and the stone still weeps.",
  src:"Hom. Il. 24.602–617; Ov. Met. 6.146–312" },

{ id:'meleager', name:'Meleager', age:'mortal', kind:'mortal', rank:2,
  domain:'The Calydonian boar', parents:[], peer:'atalanta', consorts:[],
  blurb:"He gathered Greece to hunt a boar and gave the hide to Atalanta, who had drawn first blood. His uncles objected; he killed them; his mother burned the log that his life was tied to.",
  src:"Ov. Met. 8.260–546; Apollod. Bibl. 1.8.2–3" },

{ id:'patroclus', name:'Patroclus', age:'mortal', kind:'mortal', rank:2,
  domain:'In Achilles’ armour', parents:[], peer:'achilles', consorts:[],
  blurb:"He borrowed the armour to give the Greeks one hour of hope, and forgot he was not the man it belonged to. His death is what finally brought Achilles out.",
  src:"Hom. Il. 16" },

{ id:'andromache', name:'Andromache', age:'mortal', kind:'mortal', rank:2,
  domain:'Hector’s wife', parents:[], peer:'hector', consorts:['hector'],
  blurb:"She asked him once to fight from the wall instead of the field. The scene where he takes off his helmet because it frightens their son is the tenderest in the Iliad.",
  src:"Hom. Il. 6.390–502" },

{ id:'anticlea', name:'Anticlea', age:'mortal', kind:'mortal', rank:3,
  domain:'Mother of Odysseus', parents:[], consorts:['laertes'],
  blurb:"She died of waiting. Odysseus met her among the dead and three times tried to hold her, and three times she went through his arms like a shadow.",
  src:"Hom. Od. 11.152–224" },

{ id:'amphitryon', name:'Amphitryon', age:'mortal', kind:'mortal', rank:3,
  domain:'Alcmene’s husband', parents:[], consorts:['alcmene'],
  blurb:"He came home the evening after Zeus had already been there wearing his face, and could not understand why his wife was not surprised to see him.",
  src:"Apollod. Bibl. 2.4.8" },

{ id:'midas', name:'Midas', age:'mortal', kind:'mortal', rank:2,
  domain:'The golden touch', parents:[], peer:'daedalus', consorts:[],
  blurb:"Granted that everything he touched turn to gold, which lasted until dinner. Later he judged a music contest against Apollo and was given ass's ears for it.",
  src:"Ov. Met. 11.85–193" },

{ id:'arachne', name:'Arachne', age:'mortal', kind:'mortal', rank:2,
  domain:'The weaving contest', parents:[], peer:'daedalus', consorts:[],
  blurb:"She challenged Athena at the loom and wove the gods' worst behaviour, faultlessly. The work was better; that was the problem. She has been spinning ever since.",
  src:"Ov. Met. 6.1–145" },

{ id:'daphne', name:'Daphne', age:'mortal', kind:'mortal', rank:2,
  domain:'The laurel', parents:['peneus'], consorts:[],
  blurb:"Struck by Eros's lead arrow while Apollo took the golden one. She ran, and asked her father the river to take her shape away; the bark closed over her as Apollo reached her.",
  src:"Ov. Met. 1.452–567" },

{ id:'adonis', name:'Adonis', age:'mortal', kind:'mortal', rank:2,
  domain:'Loved by two goddesses', parents:[], consorts:['aphrodite'],
  blurb:"So beautiful that Aphrodite and Persephone went to law over him, and Zeus split his year between them. A boar killed him hunting; the anemone came up where the blood fell.",
  src:"Ov. Met. 10.503–739; Apollod. Bibl. 3.14.4" },

{ id:'hyacinthus', name:'Hyacinthus', age:'mortal', kind:'mortal', rank:3,
  domain:'The discus', parents:[], peer:'orpheus', consorts:[],
  blurb:"A Spartan prince Apollo loved. The discus came back on a jealous wind and struck him; the flower that carries his name grew out of the ground where he lay.",
  src:"Ov. Met. 10.162–219" },

{ id:'psyche', name:'Psyche', age:'mortal', kind:'mortal', rank:2,
  domain:'The soul', parents:[], peer:'atalanta', consorts:[],
  blurb:"Married to a husband who came only in the dark and forbade her to look. She lit the lamp. Winning him back cost her four impossible tasks and a journey to the underworld.",
  src:"Apul. Met. 4.28–6.24" },

{ id:'endymion', name:'Endymion', age:'mortal', kind:'mortal', rank:3,
  domain:'The sleeping shepherd', parents:[], peer:'orion', consorts:['selene'],
  blurb:"The Moon saw him asleep on Latmus and asked Zeus to keep him that way forever, so he would never age and never leave. She visits nightly.",
  src:"Apollod. Bibl. 1.7.5" },

{ id:'tithonus', name:'Tithonus', age:'mortal', kind:'mortal', rank:3,
  domain:'Eternal life, not youth', descent:'dardanus', parents:[], consorts:['eos'],
  blurb:"The Dawn asked Zeus to make her mortal lover immortal and forgot the second half. He aged past speech and past body, until only a voice was left, and she shut it in a room.",
  src:"h.Hom.Aphr. 218–238" },

{ id:'pygmalion', name:'Pygmalion', age:'mortal', kind:'mortal', rank:2,
  domain:'The sculptor', parents:[], peer:'daedalus', consorts:['galatea'],
  blurb:"He wanted nothing to do with real women and carved one out of ivory instead, then fell in love with what he had made. At the festival of Aphrodite he asked for a wife like his statue, and did not dare ask for the statue.",
  src:"Ov. Met. 10.243–297" },

{ id:'galatea', name:'Galatea', age:'mortal', kind:'mortal', rank:3,
  domain:'The ivory made flesh', parents:[], consorts:['pygmalion'],
  blurb:"Aphrodite granted the wish he had not quite dared to make. He came home, kissed the ivory, and found it warm. Ovid never gives her a name; later readers supplied one.",
  src:"Ov. Met. 10.243–297" },

{ id:'talos', name:'Talos', age:'mortal', kind:'monster', rank:3,
  domain:'The bronze man of Crete', parents:['hephaestus'], consorts:[],
  blurb:"A bronze giant who circled Crete three times a day throwing rocks at ships. All his life ran through a single vein stopped with a nail at his ankle, and Medea knew it.",
  src:"A.R. Argon. 4.1638–1693" },

{ id:'argus', name:'Argus Panoptes', age:'primordial', kind:'monster', rank:2,
  domain:'The hundred eyes', parents:['gaia'], consorts:[],
  blurb:"A giant covered in eyes, only some of which slept at a time — which made him the perfect guard for a white cow Hera did not trust her husband about. Hera set his eyes in the peacock's tail.",
  src:"Ov. Met. 1.622–723" },

{ id:'polydectes', name:'Polydectes', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Seriphos', parents:[], peer:'danae', consorts:[],
  blurb:"He fished Danae and her son out of the sea, then wanted the mother and not the boy. Sending Perseus for a Gorgon's head was meant to be the end of him; it ended as a stone king at his own banquet.",
  src:"Apollod. Bibl. 2.4.2–3" },

{ id:'diomedes', name:'Diomedes', age:'mortal', kind:'mortal', rank:2,
  domain:'The one who wounded a goddess', parents:[], peer:'odysseus', consorts:[],
  blurb:"The steadiest of the Greek captains. With Athena clearing his sight he could tell gods from men on the field, and put a spear through Aphrodite's hand when she came to carry her son off.",
  src:"Hom. Il. 5.311–430" },

{ id:'amalthea', name:'Amalthea', age:'titan', kind:'god', rank:3,
  domain:'Who nursed the infant Zeus', parents:[], peer:'rhea', consorts:[],
  blurb:"The goat, or the nymph who kept the goat, that fed Zeus in the Cretan cave while the Curetes drummed to cover the crying. One of her horns became the cornucopia.",
  src:"Apollod. Bibl. 1.1.6–7; Callim. Hymn 1" },

{ id:'stheno', name:'Stheno', age:'primordial', kind:'monster', rank:3,
  domain:'Gorgon, and deathless', parents:['phorcys','ceto'], consorts:[],
  blurb:"The eldest Gorgon and, unlike her sister, immortal — which is why nobody came for her head.",
  src:"Hes. Theog. 274–277" },

{ id:'euryale', name:'Euryale', age:'primordial', kind:'monster', rank:3,
  domain:'Gorgon, and deathless', parents:['phorcys','ceto'], consorts:[],
  blurb:"The second Gorgon sister. Pindar gives her the cry that went up when Perseus took Medusa's head — the wail Athena copied to invent the music of the flute.",
  src:"Pind. Pyth. 12" },

{ id:'cretheus', name:'Cretheus', age:'mortal', kind:'mortal', rank:3,
  domain:'Founder of Iolcus', parents:['aeolus'], consorts:['tyro'],
  blurb:"He founded the city his descendants then spent three generations fighting over.",
  src:"Apollod. Bibl. 1.9.11; Hom. Od. 11.235–259" },

{ id:'tyro', name:'Tyro', age:'mortal', kind:'mortal', rank:3,
  domain:'Mother of two houses', parents:[], consorts:['cretheus','poseidon'],
  blurb:"Poseidon came to her in the shape of a river she was in love with. Her sons by the god and her sons by her husband were the two sides of the quarrel that sent the Argo out.",
  src:"Hom. Od. 11.235–259" },

{ id:'aeson', name:'Aeson', age:'mortal', kind:'mortal', rank:3,
  domain:'The rightful king of Iolcus', parents:['cretheus','tyro'], consorts:[],
  blurb:"Jason's father, and the reason there is a quest at all: his half-brother took the throne, and the errand to Colchis was meant to keep the heir from ever claiming it back.",
  src:"Apollod. Bibl. 1.9.16; Pind. Pyth. 4" },

{ id:'laomedon', name:'Laomedon', age:'mortal', kind:'mortal', rank:3,
  domain:'Who would not pay', descent:'dardanus', parents:[], consorts:[],
  blurb:"He hired two gods to build his walls and refused them the wage, then did the same to Heracles over a team of horses. Troy was sacked once before the famous time, over that.",
  src:"Hom. Il. 21.441–457; Apollod. Bibl. 2.5.9, 2.6.4" },

{ id:'phrixus', name:'Phrixus', age:'mortal', kind:'mortal', rank:3,
  domain:'Carried east by the ram', parents:[], peer:'jason', consorts:[],
  blurb:"He and his sister fled a murderous stepmother on a golden flying ram. She fell into the strait that still carries her name; he reached Colchis and hung the fleece in a grove.",
  src:"Apollod. Bibl. 1.9.1" },

{ id:'zetes', name:'Zetes', age:'titan', kind:'god', rank:3,
  domain:'Son of the North Wind', parents:['boreas'], consorts:[],
  blurb:"Winged, and one of the two Argonauts who could chase down the Harpies that were fouling a blind prophet's food.",
  src:"A.R. Argon. 2.240–300" },

{ id:'calais', name:'Calais', age:'titan', kind:'god', rank:3,
  domain:'Son of the North Wind', parents:['boreas'], consorts:[],
  blurb:"Zetes's brother and the other half of the pair that drove the Harpies off Phineus for good.",
  src:"A.R. Argon. 2.240–300" },

{ id:'phineus', name:'Phineus', age:'mortal', kind:'mortal', rank:3,
  domain:'The blind seer of Thrace', parents:[], peer:'jason', consorts:[],
  blurb:"Blinded and tormented by Harpies for telling too much of what the gods intended. Freed of them, he told the Argonauts how to pass the clashing rocks.",
  src:"A.R. Argon. 2.176–530" },

{ id:'hypsipyle', name:'Hypsipyle', age:'mortal', kind:'mortal', rank:3,
  domain:'Queen of Lemnos', parents:[], peer:'jason', consorts:[],
  blurb:"Queen of an island whose women had killed every man on it — except her father, whom she hid. The Argo put in there, and stayed rather longer than planned.",
  src:"A.R. Argon. 1.609–909" },

{ id:'argusbuilder', name:'Argus the Shipwright', age:'mortal', kind:'mortal', rank:3,
  domain:'Who built the Argo', parents:[], peer:'jason', consorts:[],
  blurb:"He built the ship that carries his name, to Athena's design, and set into her prow a beam cut from the speaking oak at Dodona.",
  src:"A.R. Argon. 1.18–19, 111–114, 524–527" },

{ id:'kouretes', name:'The Kouretes', aka:'The Curetes', age:'titan', kind:'god', rank:3,
  domain:'The noise in the cave', parents:[], peer:'zeus', consorts:[],
  blurb:"Armed dancers who beat their spears on their shields outside a Cretan cave so that Cronus would not hear a baby crying. The entire succession of the gods rests on the racket holding out long enough.",
  src:"Apollod. Bibl. 1.1.6–7; Callim. Hymn 1.52–54" },

{ id:'gigantes', name:'The Gigantes', aka:'The Giants', age:'primordial', kind:'monster', rank:2,
  domain:'The second war', parents:['gaia'], consorts:[],
  blurb:"Sprung from the same spilled blood as the Furies, and raised by Gaia against the gods who had jailed her older children. Prophecy said no god could finish them, which is the only reason a mortal was on the field at all.",
  src:"Hes. Theog. 183–186; Apollod. Bibl. 1.6.1–2" },

{ id:'caucasianeagle', name:'The Caucasian Eagle', age:'olympian', kind:'monster', rank:3,
  domain:'Prometheus’s liver', parents:['typhon','echidna'], consorts:[],
  blurb:"It came at the same hour every day for the liver, which grew back every night, and the arrangement was meant to run forever. Heracles shot it in passing, on his way to the golden apples — the errand Prometheus then told him how to finish.",
  src:"Hes. Theog. 523–531; Apollod. Bibl. 2.5.11" },

{ id:'dictys', name:'Dictys', age:'mortal', kind:'mortal', rank:3,
  domain:'The fisherman of Seriphos', parents:[], peer:'polydectes', consorts:[],
  blurb:"His net came up heavy with a wooden chest, and inside it a woman and a baby, both still alive. His brother got the kingdom and wanted the mother; Dictys got twenty years of raising the boy, and the throne afterwards.",
  src:"Apollod. Bibl. 2.4.1–3" },

{ id:'cepheus', name:'Cepheus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Ethiopia', parents:[], peer:'andromeda', consorts:['cassiopeia'],
  blurb:"His wife made the boast and his daughter was chained to the rock to settle it. He agreed to the sacrifice, promised Perseus the girl for calling it off, and then stood by while his brother started a fight about it at the wedding.",
  src:"Apollod. Bibl. 2.4.3; Ov. Met. 4.663–5.235" },

{ id:'cassiopeia', name:'Cassiopeia', aka:'Cassiepeia', age:'mortal', kind:'mortal', rank:3,
  domain:'The boast', parents:[], peer:'andromeda', consorts:['cepheus'],
  blurb:"She said she was lovelier than the Nereids, and the sea sent back a monster and a price, and the price was her daughter. Her own punishment was a chair in the sky that turns upside down for half of every night.",
  src:"Apollod. Bibl. 2.4.3; Hyg. Astr. 2.10" },

{ id:'cetus', name:'Cetus', aka:'Ketos', age:'mortal', kind:'monster', rank:3,
  domain:'The monster at the rock', parents:[], peer:'andromeda', consorts:[],
  blurb:"Poseidon's answer to Cassiopeia's boast, sent to eat a princess on a fixed schedule. Perseus showed it the Gorgon's head and it went into the sky as a constellation. Not the primordial Ceto, who is several generations older and somebody's mother.",
  src:"Apollod. Bibl. 2.4.3; Ov. Met. 4.663–739" },

{ id:'iphicles', name:'Iphicles', age:'mortal', kind:'mortal', rank:3,
  domain:'The other twin', parents:['amphitryon','alcmene'], consorts:[],
  blurb:"Born the same night as Heracles to the mortal father, and the one who screamed when the snakes came into the cot. He spent the rest of his life fighting in his brother's wars and died in one of them.",
  src:"Apollod. Bibl. 2.4.8; Hes. Sc. 48–56" },

{ id:'megara', name:'Megara', age:'mortal', kind:'mortal', rank:3,
  domain:'The first wife', parents:[], peer:'heracles', consorts:['heracles'],
  blurb:"Given to Heracles by a grateful Thebes, and killed by him along with their children when Hera put the madness on him. The twelve labours are the penance for that one evening. She is the reason there is a story.",
  src:"Eur. HF; Apollod. Bibl. 2.4.12" },

{ id:'creon', name:'Creon', age:'mortal', kind:'mortal', rank:2,
  domain:'King of Thebes', parents:[], peer:'jocasta', consorts:[],
  blurb:"Jocasta's brother, and the man who kept inheriting Thebes because everyone else in the family kept dying on the throne. He offered the kingdom to whoever answered the Sphinx, and a generation later forbade the burial of Polynices. That second decree cost him his own son.",
  src:"Soph. Ant." },

{ id:'eurystheus', name:'Eurystheus', age:'mortal', kind:'mortal', rank:3,
  domain:'Who set the labours', parents:[], peer:'heracles', consorts:[],
  blurb:"Hera delayed one birth and hurried another so that this man, and not Heracles, got Mycenae. He set the labours and then disallowed two of them on technicalities — one done for payment, one done with help — which is why there are twelve and not ten.",
  src:"Hom. Il. 19.95–133; Apollod. Bibl. 2.5.1–11" },

{ id:'iolaus', name:'Iolaus', age:'mortal', kind:'mortal', rank:3,
  domain:'The torch at Lerna', parents:[], peer:'heracles', consorts:[],
  blurb:"Heracles' nephew and charioteer, who worked out that the Hydra's stumps had to be burned shut. Eurystheus struck the labour off the list for exactly that reason.",
  src:"Apollod. Bibl. 2.5.2" },

{ id:'ceryneianhind', name:'The Ceryneian Hind', age:'mortal', kind:'monster', rank:3,
  domain:'Golden horns, bronze hooves', parents:[], peer:'artemis', consorts:[],
  blurb:"A deer faster than a flying arrow and sacred to Artemis, which made the third labour a question of etiquette rather than force. Heracles chased it for a year, and then had to talk his way out of having caught it.",
  src:"Apollod. Bibl. 2.5.3" },

{ id:'erymanthianboar', name:'The Erymanthian Boar', age:'mortal', kind:'monster', rank:3,
  domain:'Taken alive', parents:[], peer:'heracles', consorts:[],
  blurb:"Driven uphill into deep snow until it tired, then tied and carried back to Mycenae on a shoulder, still breathing. The king took one look at it coming through the gate and got into a bronze jar.",
  src:"Apollod. Bibl. 2.5.4" },

{ id:'stymphalianbirds', name:'The Stymphalian Birds', age:'mortal', kind:'monster', rank:3,
  domain:'Bronze beaks over the marsh', parents:[], peer:'heracles', consorts:[],
  blurb:"A flock roosting in a swamp that would not carry a man's weight, which is the whole difficulty of the labour. Athena handed over a bronze rattle; they went up all at once, and he shot them in the air.",
  src:"Apollod. Bibl. 2.5.6" },

{ id:'cretanbull', name:'The Cretan Bull', age:'mortal', kind:'monster', rank:3,
  domain:'The bull Minos kept', parents:[], peer:'minos', consorts:[],
  blurb:"Sent by Poseidon to be sacrificed and too handsome for Minos to give up — which is how Pasiphae came to want it and how the Minotaur came to exist. Heracles carried it to Mycenae and let it go; it drifted north to Marathon, where Theseus killed it without ever being told whose father it was — the half-brother of both women he would marry.",
  src:"Apollod. Bibl. 2.5.7; Plut. Thes. 14" },

{ id:'maresofdiomedes', name:'The Mares of Diomedes', age:'mortal', kind:'monster', rank:3,
  domain:'Fed on guests', parents:[], peer:'heracles', consorts:[],
  blurb:"Four horses kept in iron chains because their owner fed them on travellers who accepted his hospitality. Heracles quieted them by feeding them the owner, and they walked to Mycenae afterwards without any trouble at all.",
  src:"Apollod. Bibl. 2.5.8" },

{ id:'diomedesthrace', name:'Diomedes of Thrace', age:'mortal', kind:'mortal', rank:3,
  domain:'King of the Bistones', parents:[], peer:'heracles', consorts:[],
  blurb:"He kept man-eating mares and a reputation for hospitality that did not survive close inspection. Heracles fed him to his own horses. No relation to the Diomedes who wounded Aphrodite at Troy — different man, different generation, same name.",
  src:"Apollod. Bibl. 2.5.8" },

{ id:'augeas', name:'Augeas', aka:'Augeias', age:'mortal', kind:'mortal', rank:3,
  domain:'The stables', parents:['helios'], consorts:[],
  blurb:"Son of the Sun, owner of more cattle than anyone in Greece, and a man who had never once cleaned up after them. Heracles offered to do it in a day for a tenth of the herd, put two rivers through the yard instead of a shovel, and was refused payment on the grounds that it had been a labour anyway.",
  src:"Apollod. Bibl. 2.5.5" },

{ id:'amazons', name:'The Amazons', age:'mortal', kind:'mortal', rank:2,
  domain:'The nation of women', parents:[], peer:'hippolyta', consorts:[],
  blurb:"Horse-archers on the Black Sea who kept men for breeding and raised only the daughters. Heracles came for a war-belt, Theseus came away with a queen, and Achilles killed one and was sorry immediately. Every hero of note had to fight them, which says less about the Amazons than about what the Greeks kept needing to settle.",
  src:"Apollod. Bibl. 2.5.9, Epit. 1.16, 5.1" },

{ id:'nessus', name:'Nessus', age:'mortal', kind:'monster', rank:3,
  domain:'The ferryman’s blood', parents:[], peer:'deianira', consorts:[],
  blurb:"He carried Deianira across the river, then tried to carry her off, and took an arrow dipped in Hydra venom for it. Dying, he told her his blood was a love charm and she should keep some. It was a slow arrow, aimed at the man who had fired the fast one.",
  src:"Soph. Trach. 555–581; Ov. Met. 9.101–133" },

{ id:'philoctetes', name:'Philoctetes', age:'mortal', kind:'mortal', rank:2,
  domain:'Heir to the bow', parents:[], peer:'heracles', consorts:[],
  blurb:"He lit the pyre nobody else would light, and was left the bow for it. A snakebite went septic on the way to Troy and the Greeks put him ashore on an empty island, then came back nine years later because an oracle said the bow had to be there. He used it on Paris.",
  src:"Soph. Phil." },

{ id:'pirithous', name:'Pirithous', aka:'Peirithous', age:'mortal', kind:'mortal', rank:3,
  domain:'The friend', parents:[], peer:'theseus', consorts:[],
  blurb:"They met when he came to steal Theseus's cattle and the two of them liked each other too much to fight over it. His wedding started the war with the centaurs, and his idea that they should go down and ask Hades for Persephone ended with both men fixed to a stone bench. Only one of them got up.",
  src:"Plut. Thes. 30–31; Apollod. Epit. 1.21–24" },

{ id:'lycomedes', name:'Lycomedes', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Skyros', parents:[], peer:'theseus', consorts:[],
  blurb:"He took Theseus in as an exile and then walked him off a cliff, for reasons no two sources agree on. Years later he hid the boy Achilles among his daughters in a dress, which held until Odysseus laid a sword out among the jewellery.",
  src:"Plut. Thes. 35; Apollod. Bibl. 3.13.8" },

{ id:'periphetes', name:'Periphetes', aka:'Corynetes', age:'mortal', kind:'mortal', rank:3,
  domain:'The club', parents:['hephaestus'], consorts:[],
  blurb:"Lame son of Hephaestus, who beat travellers to death with a bronze club on the road out of Troezen. Theseus took the club off him and carried it for the rest of his life.",
  src:"Apollod. Bibl. 3.16.1; Plut. Thes. 8" },

{ id:'sinis', name:'Sinis', aka:'Pityocamptes', age:'mortal', kind:'mortal', rank:3,
  domain:'The bent pines', parents:[], peer:'theseus', consorts:[],
  blurb:"He bent two pine trees down to the ground, tied a traveller between them, and let go. Theseus did it back to him, which sets the pattern for the whole road to Athens.",
  src:"Plut. Thes. 8; Apollod. Bibl. 3.16.2" },

{ id:'sciron', name:'Sciron', age:'mortal', kind:'mortal', rank:3,
  domain:'The cliff and the turtle', parents:[], peer:'theseus', consorts:[],
  blurb:"He made travellers on the coast road kneel and wash his feet, then kicked them off the cliff to a turtle that lived below and cleared up. Theseus kicked him off instead. The turtle did not notice any difference.",
  src:"Plut. Thes. 10; Apollod. Epit. 1.2" },

{ id:'cercyon', name:'Cercyon', age:'mortal', kind:'mortal', rank:3,
  domain:'The wrestler at Eleusis', parents:[], peer:'theseus', consorts:[],
  blurb:"He wrestled everyone who came past Eleusis and killed everyone he beat, which was everyone. Theseus won by lifting rather than gripping, and the Greeks credited him with turning the sport into a technique instead of a brawl.",
  src:"Plut. Thes. 11; Apollod. Epit. 1.3" },

{ id:'procrustes', name:'Procrustes', aka:'Damastes', age:'mortal', kind:'mortal', rank:3,
  domain:'The bed', parents:[], peer:'theseus', consorts:[],
  blurb:"He offered guests a bed that always fitted: too short and he cut them down, too long and he hammered them out. Theseus fitted him to it. The word still gets used for any argument that trims the evidence to length.",
  src:"Plut. Thes. 11; Apollod. Epit. 1.4" },

{ id:'spartoi', name:'The Spartoi', aka:'The Sown Men', age:'mortal', kind:'mortal', rank:3,
  domain:'Grown from teeth', parents:[], peer:'cadmus', consorts:[],
  blurb:"Cadmus put the dragon's teeth in the ground and armed men came up out of the furrows. He threw a stone among them and let them kill each other down to five, who helped him build Thebes. The city's oldest families traced themselves to a fight that need not have started.",
  src:"Apollod. Bibl. 3.4.1; Ov. Met. 3.101–130" },

{ id:'ismeniandragon', name:'The Ismenian Dragon', age:'mortal', kind:'monster', rank:3,
  domain:'The serpent at the spring', parents:['ares'], consorts:[],
  blurb:"It guarded the water Cadmus's men were sent to fetch, and ate them for coming. Killing it cost Cadmus eight years' service to Ares, and the teeth Athena told him to plant grew the men who founded the city.",
  src:"Apollod. Bibl. 3.4.1–2; Ov. Met. 3.28–98" },

{ id:'labdacus', name:'Labdacus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Thebes', parents:['polydorus'], consorts:[],
  blurb:"Cadmus's grandson and Laius's father, holding the throne for a reign so short that nothing survives of it except the succession. The tragedians named the whole cursed house after him — the Labdacids — which is more than the men who did the actual damage got.",
  src:"Apollod. Bibl. 3.5.5" },

{ id:'polybus', name:'Polybus', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Corinth', parents:[], peer:'oedipus', consorts:['merope'],
  blurb:"Childless, he took in a baby a shepherd carried over the mountain and raised him as the heir without ever mentioning where he came from. Oedipus left Corinth to avoid killing him, which is precisely what made the prophecy work. He died old, in bed, of nothing in particular.",
  src:"Soph. OT 924–1050" },

{ id:'merope', name:'Merope', aka:'Periboea', age:'mortal', kind:'mortal', rank:3,
  domain:'Queen of Corinth', parents:[], peer:'oedipus', consorts:['polybus'],
  blurb:"She raised Oedipus as her own and let him believe it, which was a kindness and turned into the trap. When the oracle told him he would marry his mother, she was the woman he was thinking of.",
  src:"Soph. OT 774–833" },

{ id:'eteocles', name:'Eteocles', age:'mortal', kind:'mortal', rank:3,
  domain:'The brother who stayed', parents:['oedipus','jocasta'], consorts:[],
  blurb:"He agreed to rule Thebes in alternate years with his brother, took the first year, and then would not come off the throne. They met at the seventh gate and killed each other inside the same minute, which was the one outcome their father had predicted.",
  src:"Aesch. Sept.; Apollod. Bibl. 3.6.1–8" },

{ id:'polynices', name:'Polynices', aka:'Polyneices', age:'mortal', kind:'mortal', rank:3,
  domain:'The brother who came back', parents:['oedipus','jocasta'], consorts:[],
  blurb:"Locked out of his turn, he married into Argos and brought six other champions back to take the city by force. He got his year at the seventh gate, on his brother's spear. Then he lay outside the walls for days, because Creon said so.",
  src:"Aesch. Sept.; Soph. Ant." },

{ id:'ismene', name:'Ismene', age:'mortal', kind:'mortal', rank:3,
  domain:'The sister who said no', parents:['oedipus','jocasta'], consorts:[],
  blurb:"Asked to help bury Polynices she refused, and then tried to share the sentence once it was too late to share the act. Antigone would not let her. Sophocles leaves her alive at the end, which in that family is a verdict of its own.",
  src:"Soph. Ant." },

{ id:'colchiandragon', name:'The Colchian Dragon', age:'mortal', kind:'monster', rank:3,
  domain:'Guard of the fleece', parents:[], peer:'aeetes', consorts:[],
  blurb:"A serpent coiled round the oak in the grove of Ares that never slept at all, which made the theft impossible by design. Medea sang it to sleep with drugged juniper — the one attack it had never been built to survive.",
  src:"A.R. Argon. 4.123–182" },

{ id:'glauce', name:'Glauce', aka:'Creusa', age:'mortal', kind:'mortal', rank:3,
  domain:'The Corinthian bride', parents:[], peer:'medea', consorts:[],
  blurb:"A princess offered to Jason with a throne attached, which he accepted as a career decision. Medea sent wedding gifts: a robe and a golden coronet that caught fire the moment she put them on. Her father burned too, trying to pull them off her.",
  src:"Eur. Med. 1136–1230" },

{ id:'goldenram', name:'The Golden Ram', aka:'Chrysomallos', age:'mortal', kind:'monster', rank:3,
  domain:'Whose fleece was the prize', parents:[], peer:'phrixus', consorts:[],
  blurb:"Sent to carry two children out of reach of a stepmother who wanted them dead, it flew east and lost one of them over the strait. Phrixus landed in Colchis, sacrificed it in gratitude, and hung the skin on a tree. It stayed there until a generation later somebody wanted it enough to build a ship.",
  src:"Apollod. Bibl. 1.9.1" },

{ id:'calchas', name:'Calchas', age:'mortal', kind:'mortal', rank:3,
  domain:'Seer to the Greeks', parents:[], peer:'agamemnon', consorts:[],
  blurb:"Every unwelcome instruction of the war came through him: kill your daughter, give the girl back, fetch Achilles' son, build the horse. He was told he would die when he met a better prophet, and he did — beaten on a question about how many figs were on a tree.",
  src:"Hom. Il. 1.68–100; Apollod. Epit. 6.2–4" },

{ id:'nestor', name:'Nestor', age:'mortal', kind:'mortal', rank:3,
  domain:'King of Pylos', parents:[], peer:'agamemnon', consorts:[],
  blurb:"Too old to be much use in the fighting and kept on for his advice, most of which begins with how much better men were when he was young. He was right often enough that nobody ever stopped him. He is one of the few captains who went home, and stayed there.",
  src:"Hom. Il. 1.247–284; Hom. Od. 3" },

{ id:'ajaxlesser', name:'Ajax the Lesser', aka:'Locrian Ajax', age:'mortal', kind:'mortal', rank:3,
  domain:'The Locrian', parents:[], peer:'ajax', consorts:[],
  blurb:"The fast one in the linen corslet, and no relation to the Telamonian who shared his name. On the night the city fell he dragged Cassandra off Athena's statue with the statue still in her hands, and the whole fleet paid for it on the way home. He got clear of the wreck, said aloud that the sea could not hold him, and Poseidon split the rock he was standing on.",
  src:"Hom. Od. 4.499–511; Apollod. Epit. 5.22–23, 6.6" },

{ id:'idomeneus', name:'Idomeneus', age:'mortal', kind:'mortal', rank:3,
  domain:'Cretan at Troy', parents:[], peer:'minos', consorts:[],
  blurb:"Minos's grandson, who brought eighty ships and one of the steadiest spears in the Iliad. Caught in a storm coming home, he promised Poseidon the first thing that met him on the shore, and it was his son. Crete exiled him for keeping the promise.",
  src:"Hom. Il. 2.645–652; Serv. ad Aen. 3.121" },

{ id:'chryses', name:'Chryses', age:'mortal', kind:'mortal', rank:3,
  domain:'Priest of Apollo', parents:[], peer:'apollo', consorts:[],
  blurb:"He came to the Greek camp with ransom for his daughter and was sent away with an insult and a threat. So he walked down the beach out of earshot and prayed, and Apollo shot arrows into the army for nine days. That is where the Iliad starts.",
  src:"Hom. Il. 1.8–53" },

{ id:'chryseis', name:'Chryseis', aka:'Astynome', age:'mortal', kind:'mortal', rank:3,
  domain:'The girl returned', parents:['chryses'], consorts:[],
  blurb:"Agamemnon's prize, and worth more to him than his own wife, which he said out loud in front of the army. Handing her back to stop the plague is why he took Briseis instead, and that swap is what the entire poem hangs on.",
  src:"Hom. Il. 1.106–187" },

{ id:'briseis', name:'Briseis', age:'mortal', kind:'mortal', rank:3,
  domain:'The taken prize', parents:[], peer:'achilles', consorts:[],
  blurb:"Achilles killed her husband and her brothers and took her, and she is the one who weeps hardest for Patroclus, because he had promised to make her a wife instead of a possession. The war stops for nine books over who owns her. Nobody asks her anything.",
  src:"Hom. Il. 1.318–348, 19.282–302" },

{ id:'protesilaus', name:'Protesilaus', age:'mortal', kind:'mortal', rank:3,
  domain:'First ashore', parents:[], peer:'agamemnon', consorts:[],
  blurb:"An oracle said the first Greek to touch Trojan soil would be the first to die, so a thousand ships sat offshore until he jumped. Hector killed him in the shallows. His wife was allowed three hours with his ghost and went back with him when they were up.",
  src:"Hom. Il. 2.695–710; Apollod. Epit. 3.29–30" },

{ id:'myrmidons', name:'The Myrmidons', age:'mortal', kind:'mortal', rank:3,
  domain:'Achilles’ men', parents:[], peer:'achilles', consorts:[],
  blurb:"Thessalian troops descended from ants that Zeus turned into people to refill an emptied island, and named after them. They fought nine years of the war, sat out a few weeks of it while their commander sulked, then went out behind Patroclus in the wrong man's armour. The word now means anyone who follows an order without asking what it is for.",
  src:"Ov. Met. 7.615–660; Hom. Il. 16" },

{ id:'deiphobus', name:'Deiphobus', age:'mortal', kind:'mortal', rank:3,
  domain:'Helen’s third husband', parents:['priam','hecuba'], consorts:['helen'],
  blurb:"Priam's best fighter once Hector was gone, and the brother who married Helen after Paris died. On the last night she hid his weapons and let Menelaus into the bedroom. Virgil has him meet Aeneas in the underworld still in the state they left him.",
  src:"Verg. Aen. 6.494–547; Apollod. Epit. 5.9, 5.22" },

{ id:'helenus', name:'Helenus', age:'mortal', kind:'mortal', rank:3,
  domain:'The prophet who changed sides', parents:['priam','hecuba'], consorts:[],
  blurb:"Cassandra's twin, with the same gift and none of the curse, so people listened. He quarrelled with his family over Helen after Paris died, walked out, was captured, and told the Greeks the exact list of conditions Troy had to fail before it could fall. He is the only son of Priam who came through the war and ended up a king.",
  src:"Soph. Phil. 604–613; Verg. Aen. 3.294–355" },

{ id:'troilus', name:'Troilus', age:'mortal', kind:'mortal', rank:3,
  domain:'Killed young', parents:['priam','hecuba'], consorts:[],
  blurb:"A prophecy held that Troy could not fall if he lived to twenty. Achilles caught him watering his horses at the spring outside the walls and cut him down at the altar — a boy on a pony, and one of the few things the Greeks were embarrassed about afterwards. The medieval poets gave him a doomed love affair, which Homer would not have recognised.",
  src:"Apollod. Epit. 3.32; Verg. Aen. 1.474–478" },

{ id:'memnon', name:'Memnon', age:'mortal', kind:'mortal', rank:3,
  domain:'King of the Ethiopians', parents:['tithonus','eos'], consorts:[],
  blurb:"Son of the Dawn, in armour Hephaestus made, and the last serious help Troy ever got. Zeus weighed his life against Achilles' on the golden scales and his was the pan that fell. His mother carried him off the field and asked for immortality instead; the morning dew is her, still at it.",
  src:"Apollod. Epit. 5.3; Ov. Met. 13.576–622" },

{ id:'sinon', name:'Sinon', age:'mortal', kind:'mortal', rank:3,
  domain:'The man left behind', parents:[], peer:'odysseus', consorts:[],
  blurb:"Found tied up outside the walls, he told the Trojans he had escaped being sacrificed by his own side, and that the horse had been built too tall to fit through their gates on purpose. They widened the gates. He opened the horse that night and lit the signal fire for the fleet.",
  src:"Verg. Aen. 2.57–198, 254–259" },

{ id:'laocoon', name:'Laocoon', age:'mortal', kind:'mortal', rank:3,
  domain:'The spear in the horse', parents:[], peer:'priam', consorts:[],
  blurb:"He put a spear into the horse's flank, heard the hollow sound it made, and told them not to trust Greeks even bearing gifts. Two sea serpents came out of the water and took him and both his sons in front of the entire city, which read it as proof that he had been wrong.",
  src:"Verg. Aen. 2.40–56, 199–233" },

{ id:'astyanax', name:'Astyanax', aka:'Scamandrius', age:'mortal', kind:'mortal', rank:3,
  domain:'Thrown from the wall', parents:['hector','andromache'], consorts:[],
  blurb:"The baby who cried at the sight of his father's helmet, in the tenderest scene in the Iliad. After the city fell the Greeks debated him briefly and then dropped him off the tower, on the reasoning that Hector's son would eventually grow up. His name means lord of the city.",
  src:"Hom. Il. 6.466–481; Eur. Tro. 709–779" },

{ id:'ascanius', name:'Ascanius', aka:'Iulus', age:'mortal', kind:'mortal', rank:3,
  domain:'The line to Rome', parents:['aeneas'], consorts:[],
  blurb:"Led out of burning Troy by the hand while his father carried his grandfather, which is what makes the escape a rescue rather than a retreat. He founded Alba Longa, and the Julians claimed descent from him under his other name. That is how a Trojan child ends up in Roman state religion.",
  src:"Verg. Aen. 2.723–724; Liv. 1.3" },

{ id:'ixion', name:'Ixion', age:'mortal', kind:'mortal', rank:3,
  domain:'The burning wheel', parents:[], peer:'sisyphus', consorts:[],
  blurb:"The first man to murder a relative, and so polluted that nobody would purify him until Zeus did it personally and sat him down at the table on Olympus. He repaid it with an attempt on Hera; Zeus shaped a cloud into her likeness and let him have that instead, and the centaurs came of it. He turns on a wheel of fire that does not stop.",
  src:"Pind. Pyth. 2.21–48; Apollod. Epit. 1.20" },

{ id:'pythia', name:'The Pythia', aka:'The Oracle of Delphi', age:'mortal', kind:'mortal', rank:3,
  domain:'The voice at Delphi', parents:[], peer:'apollo', consorts:[],
  blurb:"A local woman on a tripod over a crack in the rock, speaking for Apollo — one office held by a succession of ordinary priestesses for the better part of a thousand years. Nearly every prophecy that ruins somebody in these stories was collected from her, in a form that only reads clearly afterwards. Kings paid in gold to be told things they then misunderstood.",
  src:"Hdt. 1.46–91; Plut. Mor. (De Pyth. or.)" },

{ id:'maenads', name:'The Maenads', aka:'The Bacchae', age:'mortal', kind:'mortal', rank:3,
  domain:'The women who go up the mountain', parents:[], peer:'dionysus', consorts:[],
  blurb:"Women who leave the loom and the house, go into the hills at night, and come back not remembering. With the god in them they suckle wild animals and tear other things apart with their hands, and which of the two happens is not their decision. Pentheus's mother was one of them.",
  src:"Eur. Bacch. 677–774" },

{ id:'satyrs', name:'The Satyrs', age:'olympian', kind:'god', rank:3,
  domain:'The god’s retinue', parents:[], peer:'dionysus', consorts:[],
  blurb:"Goat-legged, permanently drunk, permanently aroused and useless in a fight — the followers who make the arrival of Dionysus funny rather than frightening. Athens gave them a whole genre of their own: after three tragedies, a satyr play, so the audience could go home laughing.",
  src:"Hes. fr.; Eur. Cyc." },

{ id:'suitors', name:'The Suitors of Penelope', age:'mortal', kind:'mortal', rank:3,
  domain:'Eating another man’s house', parents:[], peer:'penelope', consorts:[],
  blurb:"A hundred and eight young men of the islands, camped in Odysseus's hall for four years, eating his herds and courting his wife on the assumption that he was dead. Telemachus could not remove them and the gods declined to. When the beggar strung the bow, none of them got out of the room.",
  src:"Hom. Od. 2, 22" },

{ id:'coronis', name:'Coronis', age:'mortal', kind:'mortal', rank:3,
  domain:'Mother of Asclepius', parents:[], peer:'asclepius', consorts:['apollo'],
  blurb:"Pregnant by Apollo, she married a mortal, and the white crow that brought the news was scorched black for bringing it. Apollo had her killed and then cut the child out of her on the pyre. Medicine begins there.",
  src:"Pind. Pyth. 3.8–46; Ov. Met. 2.542–632" }

];
