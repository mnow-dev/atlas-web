    void el.getBoundingClientRect();          // let the animation actually restart
    both.forEach(function (n) { n.classList.add('named'); });
    flashing[id] = {
      flash: setTimeout(function () {
        both.forEach(function (n) { n.classList.remove('named'); n.classList.add('recent'); });
        syncBreath(el);
      }, MENTION_MS),
      hold: setTimeout(function () {
        both.forEach(function (n) { n.classList.remove('recent'); });
        delete flashing[id];
      }, MENTION_MS + SUSTAIN_MS)
    };
  }

  /* Sweeps the map rather than only the rings this module started, so a clear
     is a guarantee: after it, nothing is glowing, whatever put it there. */
  function clearMentions() {
    Object.keys(flashing).forEach(function (id) {
      clearTimeout(flashing[id].flash); clearTimeout(flashing[id].hold);
      delete flashing[id];
    });
    [].forEach.call(document.querySelectorAll('.node.named, .node.recent'), function (el) {
      el.classList.remove('named');
      el.classList.remove('recent');
      var r = el.querySelector('.named-ring');
      if (r) r.style.animationDelay = '';
    });
    lastMentionT = -1;
  }

  function renderTourHead() {
    if (!tour.open) { $('panel-tour').hidden = true; return; }
    var sg = TOUR.segments[Math.max(0, tour.i)];
    $('panel-tour').hidden = false;
    $('panel-tour').innerHTML =
      '<div class="tour-transport">' +
        '<button class="btn" id="t-prev" aria-label="Previous passage">‹</button>' +
        '<button class="btn" id="t-play" aria-label="' + (tour.playing ? T('Pause') : T('Play')) + '">' +
          (tour.playing ? '❚❚' : '▶') + '</button>' +
        '<button class="btn" id="t-next" aria-label="Next passage">›</button>' +
        '<span class="where">' + (tour.i + 1) + ' / ' + TOUR.segments.length + '</span>' +
        '<button class="btn" id="t-close" aria-label="Close the tour">✕</button>' +
      '</div>' +
      '<div class="tour-now"><b>' + esc(sg.title) + '</b><p>' + esc(sg.note) + '</p></div>';
    $('t-prev').addEventListener('click', function () { tourGoto(tour.i - 1, true); });
    $('t-next').addEventListener('click', function () { tourGoto(tour.i + 1, true); });
    $('t-close').addEventListener('click', function () { tourOpen(false); });
    $('t-play').addEventListener('click', function () { tour.playing ? tourPause() : tourPlay(); });
  }

  /* The chapter list lives in the panel body, which the reader can replace by
     clicking a figure. Neither action touches the player. */
  function renderChapters() {
    /* With more than one film in the tour, the list says where each run of
       chapters plays — a timestamp is meaningless without knowing whose clock
       it is on. */
    var lastSrc = null;
    $('panel-body').innerHTML =
      '<h3 style="margin-bottom:8px">' + esc(TOUR.title) + '</h3>' +
      '<p class="none" style="margin:0 0 10px">' + esc(TOUR.source) + '</p>' +
      '<div class="chapters">' + TOUR.segments.map(function (sg, j) {
        var head = '';
        if (SOURCES.length > 1 && segSrc(sg) !== lastSrc) {
          lastSrc = segSrc(sg);
          var s = srcByKey[lastSrc];
          head = '<div class="chsrc">' + esc((s && s.title) || lastSrc) + '</div>';
        }
        return head + '<button data-seg="' + j + '" aria-current="' + (j === tour.i) + '">' +
          '<span class="t">' + fmt(sg.at || 0) + '</span><span>' + esc(sg.title) + '</span></button>';
      }).join('') + '</div>';
    $('panel-body').querySelectorAll('[data-seg]').forEach(function (b) {
      b.addEventListener('click', function () { tourGoto(+b.getAttribute('data-seg'), true); });
    });
  }

  function markChapters() {
    var list = $('panel-body').querySelectorAll('[data-seg]');
    if (!list.length) return;
    list.forEach(function (b, j) { b.setAttribute('aria-current', String(j === tour.i)); });
    var cur = list[tour.i];
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
  }

  function tourStep() {
    if (!tour.playing || tour.player) return;
    var sg = TOUR.segments[tour.i];
    tour.timer = setTimeout(function () {
      if (!tour.playing) return;
      if (tour.i + 1 >= TOUR.segments.length) { tourPause(); return; }
      tourGoto(tour.i + 1);
      tourStep();
    }, (sg.dur || 10) * 1000);
  }

  function tourPlay() {
    tour.playing = true;
    renderTourHead();
    if (tour.player) { tour.player.playVideo(); return; }
    tourStep();
  }

  function tourPause() {
    tour.playing = false;
    clearTimeout(tour.timer);
    renderTourHead();
    if (tour.player) tour.player.pauseVideo();
  }

  function tourOpen(on) {
    tour.open = on;
    $('tour-toggle').setAttribute('aria-pressed', String(on));
    $('tour-toggle').textContent = on ? '✕ Close the tour' : '▶ Tour the whole story';
    if (on) {
      if (tourTimed && !tour.player) mountPlayer();
      // a re-open finds the player already mounted: bring back what closing hid
      if (tour.player) { $('panel-video').hidden = false; startPoll(); }
      measureVideo();
      state.sel = null;
      syncHash();
      tourGoto(tour.i < 0 ? 0 : tour.i, true);
      renderChapters();
      markChapters();
    } else {
      tourPause();
      clearInterval(tour.poll);
      tour.poll = null;
      state.tourIds = null;
      $('z-refit').hidden = true;
      clearMentions();
      $('panel-tour').hidden = true;
      $('panel-video').hidden = true;
      measureVideo();
      highlight();
      renderPanel();
    }
  }

  /* May the video's clock move the selection? Yes, unless the reader has just
     asked for a chapter and the player has not arrived there yet — then the
     clock is still answering with the old playhead and would pull the choice
     straight back. It may move again the moment the clock agrees with the
     reader, or after the deadline, on the grounds that a player which has not
     arrived in six seconds is not going to and its clock is the only one we
     have.

     A named function rather than three lines inside the interval, because the
     test harness cannot mount a YouTube player — the API will not load from
     file:// and every other test here asserts that no player is loaded — so
     this is the only part of the fix that can be checked at all. Checking the
     decision is worth more than checking nothing. */
  function clockMayMove(best, i, until, now) {
    if (!until) return true;
    return best === i || now > until;
  }

  /* The clock that keeps the map in step with the narration: which chapter,
     and who is being named right now. It runs only while the tour is open —
     closed, it would go on re-lighting a map nobody is watching. */
  function startPoll() {
    if (!tour.open || tour.poll) return;
    tour.poll = setInterval(function () {
      if (!tour.player || !tour.player.getCurrentTime) return;
      /* Only the playing film's own chapters compete for the clock — another
         source's timestamps mean nothing against this one's playhead. A
         chapter in a different film is reached by choosing it, which switches
         the source. */
      var t = tour.player.getCurrentTime(), best = -1;
      TOUR.segments.forEach(function (sg, j) {
        if (segSrc(sg) === tour.srcKey && t >= sg.at) best = j;
      });
      /* Still travelling to where the reader asked. The mentions are skipped
         with it, deliberately: they are (id, second) pairs against this film's
         clock, and flashing them off a stale playhead lights the wrong people
         on the map for as long as the seek takes. */
      if (tour.seekUntil) {
        if (clockMayMove(best, tour.i, tour.seekUntil, Date.now())) tour.seekUntil = 0;
        else return;
      }
      if (best >= 0 && best !== tour.i) tourGoto(best);
      flashMentions(t);
    }, 250);
  }

  /* Loading the API script is itself the capability check — under a policy that
     forbids external hosts it never arrives, and the tour carries on without it
     rather than waiting on a player that cannot exist. */
  function mountPlayer() {
    var done = false;
    var giveUp = setTimeout(function () { done = true; }, 5000);
    window.onYouTubeIframeAPIReady = function () {
      if (done) return;
      done = true; clearTimeout(giveUp);
      $('panel-video').hidden = false;
      measureVideo();
      tour.player = new window.YT.Player('t-mount', {
        videoId: srcByKey[tour.srcKey].youtube,
        playerVars: { modestbranding: 1, rel: 0 },
        events: {
          onStateChange: function (e) {
            tour.playing = e.data === window.YT.PlayerState.PLAYING;
            renderTourHead();
          },
          onReady: startPoll
        }
      });
    };
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function () { clearTimeout(giveUp); done = true; };
    document.head.appendChild(tag);
  }

  function setRoster(open) {
    var was = !$('roster').classList.contains('collapsed');
    if (was === open) return;
    $('roster').classList.toggle('collapsed', !open);
    $('roster-toggle').setAttribute('aria-pressed', String(open));
    $('roster-toggle').title = open ? T('Hide the roster') : T('Show the roster');
    setTimeout(applyTransform, 0);
  }
  $('roster-toggle').addEventListener('click', function () {
    setRoster($('roster').classList.contains('collapsed'));
  });

  /* ON A PHONE, PICKING SOMEBODY CLOSES THE ROSTER. The roster, the map and the
     panel are stacked there, and with the roster open it and the map fill the
     screen — so a tap on a figure rendered the answer roughly two screens below
     the fold and looked, from where the reader was sitting, like nothing had
     happened at all. On a desktop the three sit side by side and the roster
     costs the answer nothing, so it stays exactly where it was put. */
  function rosterYieldsTo(id) {
    if (id && document.body.classList.contains('compact')) setRoster(false);
  }

  if (tourReal) {
    $('tour-toggle').addEventListener('click', function () { tourOpen(!tour.open); });
  } else {
    $('tour-toggle').hidden = true;
  }

  /* ------------------------------------------------------------------- wire */

  $('iso-exit').addEventListener('click', function () { setFocus(null); });
  /* 1.3 was a mouse-sized step. On a phone these buttons are the main way to
     zoom — pinching competes with the browser's own gesture — and it took six
     presses to get anywhere. */
  $('z-in').addEventListener('click', function () { zoomStep(1.6); });
  $('z-out').addEventListener('click', function () { zoomStep(1 / 1.6); });
  $('z-fit').addEventListener('click', function () { autoFrame = 'fit'; fit(); });
  $('z-refit').addEventListener('click', function () {
    if (state.tourIds && state.tourIds.length) fitTo(new Set(state.tourIds));
  });
  if ($('v-map')) $('v-map').addEventListener('click', function () { setView('map'); });
  if ($('v-table')) $('v-table').addEventListener('click', function () { setView('table'); });

  /* ------------------------------------------------------------- compact
     A phone is not a small desk. Two side panes eat two thirds of a 390px
     screen and leave the map a gutter, so below the breakpoint the panes and
     their edges go — using `state.layers`, which already gates the pane
     rendering, the mid clip, and the hit testing, so nothing new can drift out
     of step with it. The desktop choice is remembered and handed back on the
     way out, because a rotation should not silently discard it.

     The legend goes too: it is a key, and a key you have not asked for is a
     third of a phone screen. It comes back on a press. */
  var COMPACT = window.matchMedia('(max-width: 760px)');
  var deskLayers = null;
  function applyCompact() {
    var on = COMPACT.matches;
    if (on === document.body.classList.contains('compact')) return;
    document.body.classList.toggle('compact', on);
    measureVideo();
    if (on) {
      deskLayers = new Set(state.layers);
      state.layers = new Set();
      document.body.classList.remove('legend-open');
    } else if (deskLayers) {
      state.layers = deskLayers;
      deskLayers = null;
    }
    syncChips('data-layer', state.layers);
    if (state.view === 'table') renderTable(); else { applyVisibility(); fit(); }
    renderRoster();
  }
  if (COMPACT.addEventListener) COMPACT.addEventListener('change', applyCompact);
  else if (COMPACT.addListener) COMPACT.addListener(applyCompact);   // older Safari

  /* A grip between the map and the panel, on phones only. 48vh is a fair
     opening bid and a poor permanent one: following the graph wants map,
     reading wants panel, and a reader switches between the two constantly.
     Built here rather than in each atlas's html so both get it from one place.
     Pointer events, so a finger and a mouse take the same path; the bounds
     stop either half from being dragged out of existence. */
  (function () {
    var wrap = $('stagewrap');
    if (!wrap || !wrap.parentNode) return;
    var grip = document.createElement('div');
    grip.className = 'grip';
    grip.setAttribute('role', 'separator');
    grip.setAttribute('aria-orientation', 'horizontal');
    grip.setAttribute('aria-label', T('Drag to resize the map'));
    wrap.parentNode.insertBefore(grip, wrap.nextSibling);
    /* A caret rather than a tap on the grip itself: tap-to-collapse and
       double-tap-to-reset on one element fight each other, and losing the
       reset to gain the collapse is a bad trade. */
    var caret = document.createElement('button');
    caret.className = 'gripcaret';
    caret.type = 'button';
    caret.setAttribute('aria-label', T('Collapse the panel'));
    /* The caret sits INSIDE the grip, so its press bubbles into the grip's
       drag. Stopping only the click was not enough: the drag still began, and
       the smallest movement pinned --map-h — which then overrode both the
       collapsed default AND the selected/unselected flip, permanently. Hence
       "it stays short and stops responding to selection". */
    caret.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    caret.addEventListener('click', function (e) {
      e.stopPropagation();
      var on = document.body.classList.toggle('panel-collapsed');
      caret.setAttribute('aria-label', T(on ? 'Show the panel' : 'Collapse the panel'));
      frameAfterLayout();
    });
    grip.appendChild(caret);
    wireGrip(grip, wrap, '--map-h', 0.15, 0.85);

    /* The key gets one too. Opening it took its height out of the column and
       the panel paid for all of it — one pixel tall on a short phone — so the
       map now yields (css) and the reader can set the split themselves. */
    var legend = $('legend');
    if (legend && legend.parentNode) {
      var kg = document.createElement('div');
      kg.className = 'keygrip';
      kg.setAttribute('role', 'separator');
      kg.setAttribute('aria-orientation', 'horizontal');
      kg.setAttribute('aria-label', T('Drag to resize the key'));
      legend.parentNode.insertBefore(kg, legend.nextSibling);
      wireGrip(kg, legend, '--key-h', 0.10, 0.60);
    }
  })();

  /* One grip, two uses. Pointer events so a finger and a mouse take the same
     path; the fractions hold the thing being sized between a floor and a
     ceiling of the room below it, so neither half can be dragged out of
     existence. A double-tap clears the override and returns the default. */
  function wireGrip(grip, target, prop, lo, hi) {
    var dragging = false;
    var set = function (px) {
      var top = target.getBoundingClientRect().top;
      var room = window.innerHeight - top;
      var h = Math.max(room * lo, Math.min(room * hi, px - top));
      document.body.style.setProperty(prop, Math.round(h) + 'px');
      frameAfterLayout();
    };
    grip.addEventListener('pointerdown', function (e) {
      dragging = true; grip.classList.add('dragging');
      /* a transition on the pane being dragged lags the finger */
      document.body.classList.add('gripping');
      grip.setPointerCapture && grip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    grip.addEventListener('pointermove', function (e) { if (dragging) set(e.clientY); });
    var stop = function () {
      dragging = false; grip.classList.remove('dragging');
      document.body.classList.remove('gripping');
    };
    grip.addEventListener('pointerup', stop);
    grip.addEventListener('pointercancel', stop);
    grip.addEventListener('dblclick', function () {
      document.body.style.removeProperty(prop); frameAfterLayout();
    });
  }
  /* The language button names the language you would GET, not the one you
     are in — a button reading 日本語 while the page is already Japanese tells
     you nothing about what pressing it does. */
  var langBtn = $('lang');
  if (langBtn && (window.ATLAS_LANGS || []).length > 1) {
    var names = { en: 'English', ja: '日本語' };
    var langs = window.ATLAS_LANGS;
    var next = langs[(langs.indexOf(window.ATLAS_LANG) + 1) % langs.length];
    langBtn.textContent = names[next] || next;
    langBtn.addEventListener('click', function () { window.setLang(next); });
  } else if (langBtn) langBtn.hidden = true;

  var legendToggle = $('legend-toggle');
  if (legendToggle) legendToggle.addEventListener('click', function () {
    var open = document.body.classList.toggle('legend-open');
    legendToggle.setAttribute('aria-expanded', String(open));
  });

  $('reset').addEventListener('click', function () {
    // the one close path: timer, poll, video, mentions — no zombie tour
    if (tour.open) tourOpen(false);
    state.orders = new Set(TAX.ORDERS.map(function (o) { return o.key; }));
    state.focus = null; state.sel = null; state.query = ''; state.tourIds = null;
    state.trace = null;
    state.collapsed = Object.create(null);
    state.footage = 'all';
    // Reset means the defaults, and the default framing is where it opened
    autoFrame = 'open';
    $('z-refit').hidden = true;
    input.value = '';
    state.ties = new Set(['blood', 'descent', 'union', 'violence', 'bond', 'thing']);
    /* Reset restores the DEFAULTS, and on a phone the default is no panes —
       they are what applyCompact took away to give the map a screen instead of
       a gutter. Setting them here unconditionally handed them back, so one
       press of Reset undid the whole compact layout. The desktop default is
       still remembered, so a rotation gets it back. */
    if (document.body.classList.contains('compact')) {
      state.layers = new Set();
      deskLayers = new Set(['item', 'place']);
    } else {
      state.layers = new Set(['item', 'place']);
    }
    if (CAST) { state.cast = new Set(CAST.keys); syncChips('data-cast', state.cast); }
    syncChips('data-order', state.orders);
    syncChips('data-tie', state.ties);
    syncChips('data-layer', state.layers);
    /* Reset clears the selection by hand rather than through select(), so it
       has to say so too, or the phone keeps the smaller map it was given for
       a figure that is no longer chosen. */
    markSel();
    syncHash();
    syncIsolated();
    render(true); renderPanel(); renderRoster();
    if (state.view === 'table') renderTable();
  });

  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(A.themeKey, t); } catch (e) { /* private mode */ }
  }
  (function initTheme() {
    var q = /[?&]theme=(dark|light)/.exec(location.search);
    var saved = null;
    try { saved = localStorage.getItem(A.themeKey); } catch (e) { /* ignore */ }
    var t = (q && q[1]) || saved;
    if (t) document.documentElement.setAttribute('data-theme', t);
  })();
  $('theme').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark ? 'light' : 'dark');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== input) {
      e.preventDefault();
      // the search lives inside the roster, which starts collapsed
      if ($('roster').classList.contains('collapsed')) $('roster-toggle').click();
      input.focus(); input.select();
    } else if (e.key === 'Escape') {
      /* Nearest thing first: a lookup made mid-tour is dismissed without
         killing the tour, and an isolate survives its own selection. */
      if (state.sel) select(null);
      else if (state.focus) setFocus(null);
      else if (tour.open) tourOpen(false);
    }
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applyTransform, 120);
  });

  /* The stage can change size without the WINDOW changing size, and once the
     split was animated it does so constantly: the clip that stops the map
     drawing under the panes is sized to the stage's height at the moment it
     last ran, so after a transition it was short by however much the panel had
     given up — and the column bands simply stopped partway down, until a pan
     redrew them. A window resize listener cannot see any of that. Watch the
     element itself, and every cause is covered at once: the selected/unselected
     flip, the caret, a drag of the grip, a rotation. Per frame rather than
     debounced, because this runs DURING the animation and a late redraw is the
     artefact being fixed. */
  if (window.ResizeObserver) {
    var stageRO = new ResizeObserver(function () {
      if (stageROpending) return;
      stageROpending = true;
      requestAnimationFrame(function () {
        stageROpending = false;
        // a view the reader has never framed re-applies itself; see `autoFrame`
        if (autoFrame) reFrame(true); else applyTransform();
      });
    });
    var stageROpending = false;
    stageRO.observe($('stagewrap'));
  }

  /* -------------------------------------------------------------------- env */

  /* Everything an adapter's functions may need, assembled once. The mutable
     view state (k, tx, ty) goes through transform() so a pane engine always
     reads the current values, not the boot-time ones. */
  var env = {
    $: $, esc: esc,
    DATA: DATA, THINGS: THINGS, NAMES: NAMES, TAX: TAX, byId: byId, nameOf: nameOf,
    state: state, RADIUS: RADIUS,
    depth: depth, orderOf: orderOf, eraOf: eraOf, hueOf: hueOf, MAXDEPTH: MAXDEPTH,
    degreeOf: degreeOf, kidsOf: kidsOf, matesOf: matesOf, tiesOf: tiesOf,
    parentsOf: parentsOf, ancestorsOf: ancestorsOf, descendantsOf: descendantsOf,
    directSet: directSet, lineageSet: lineageSet,
    thingNodes: thingNodes, thingY: thingY, posById: posById,
    sideRecs: function () { return sideRecs; },
    sideEdgeRecs: function () { return sideEdgeRecs; },
    paneScroll: paneScroll, paneRange: paneRange,
    widths: widths, isThing: isThing,
    mark: mark, hueSwatch: hueSwatch, roleMark: roleMark, tieSample: tieSample,
    lifespan: lifespan, clockMayMove: clockMayMove,
    shapePath: shapePath, glyphEl: glyphEl,
    chipFor: chipFor, listSection: listSection, deedList: deedList, wireChips: wireChips,
    box: box, midBox: midBox, paneWidth: paneWidth,
    paneChrome: paneChrome, paneMore: paneMore, drawSideConnectors: drawSideConnectors,
    transform: function () { return { k: k, tx: tx, ty: ty }; },
    layoutPanes: layoutPanes, applyVisibility: applyVisibility,
    select: select, cycle: cycle, setFocus: setFocus,
    fit: fit, fitTo: fitTo, centreOn: centreOn,
    highlight: highlight, renderRoster: renderRoster, renderPanel: renderPanel,
    tourOpen: tourOpen
  };
  if (A.init) A.init(env);

  /* ------------------------------------------------------------------- boot */

  $('q').placeholder = T('Search') + ' ' + DATA.length + ' ' + T(A.name || 'figures') + '…';
  buildOrderChips();
  buildCastChips();
  buildLayerChips();
  buildTieChips();
  A.buildLegend(env);
  // before the first render, so a phone never paints two panes and then drops them
  applyCompact();
  render(true);
  renderPanel();
  renderRoster();
  setView(/[?&]view=table/.test(location.search) ? 'table' : 'map');

  var hash = location.hash.replace('#', '');
  if (hash && byId[hash]) {
    select(hash);
    setTimeout(function () { centreOn(hash, 1.0); }, 60);
  }

  return env;
};

/* Two crossing taxonomies.
 *
 *   ORDER OF BEING  what kind of thing a figure is       -> mark (shape + hue)
 *   MYTHIC ERA      when in the story they belong        -> horizontal band
 *
 * Both are derived from what data.js already records, plus the editorial lists
 * below. Keeping them here rather than in data.js means the 306 entries stay a
 * record of who-begat-whom, and the interpretation sits in one readable file.
 *
 * On colour: the six order hues are taken from the Theogony Atlas reference —
 * sampled from it directly, then run through the palette validator. One of the
 * six moved by ΔE 0.7 (imperceptible) to clear the normal-vision floor against
 * the blue. Both modes now pass every hard gate; the dark steps are their own
 * selection for the dark surface, not an inversion.
 *   light  CVD ΔE 8.0  normal ΔE 15.3
 *   dark   CVD ΔE 8.6  normal ΔE 16.0
 * Shape still carries all six independently, so identity never rests on hue.
 */
(function () {
  'use strict';

  var ORDERS = [
    { key: 'primordial', label: 'Primordial', plural: 'First beings', shape: 'star', hue: 'primordial',
      note: 'The first powers and the sea’s elder line' },
    { key: 'titan', label: 'Titan', plural: 'Titans', shape: 'square', hue: 'titan',
      note: 'The elder gods and their children' },
    { key: 'olympian', label: 'Olympian', plural: 'Olympians', shape: 'circle', hue: 'olympian',
      note: 'The gods of Zeus’s order' },
    { key: 'hero', label: 'Hero', plural: 'Heroes', shape: 'diamond', hue: 'hero',
      note: 'Demigods and the great mortals of the age' },
    { key: 'mortal', label: 'Mortal', plural: 'Mortals', shape: 'triangle', hue: 'mortal',
      note: 'Kings, makers, lovers, the transformed' },
    { key: 'monster', label: 'Monster', plural: 'Monsters', shape: 'hex', hue: 'monster',
      note: 'The brood of Typhon and the older horrors' }
  ];

  /* Not orders of being — objects and places are a different kind of thing
     altogether, so they take no order colour: hollow marks in plain ink. */
  var LAYERS = [
    { key: 'item',  label: 'Object', plural: 'Objects', shape: 'ring', hue: null,
      note: 'Weapons, gifts, and the things quests are for' },
    { key: 'place', label: 'Place',  plural: 'Places',  shape: 'pin',  hue: null,
      note: 'Where it happened, and who held it' }
  ];

  var ERAS = [
    { key: 0, label: 'First Beings',       note: 'What was there before anything was made.' },
    { key: 1, label: 'The Titans',         note: 'Gaia and Uranus’s children, and Gaia’s late-born monsters.' },
    { key: 2, label: 'Children of Cronus', note: 'The elder Olympians and their Titan cousins.' },
    { key: 3, label: 'Children of Zeus',   note: 'The younger gods, and the mortals Zeus fathered on.' },
    { key: 4, label: 'The Heroic Age',     note: 'Labours, quests, and the founding of cities.' },
    { key: 5, label: 'The Trojan Age',     note: 'The war at Ilium and the long roads home.' }
  ];

  /* Demigods and the named protagonists. Everyone else mortal is a "mortal" —
     kings, makers, lovers, the transformed. Editorial, and arguable at the edges:
     Minos is here as a king who became a judge of the dead, Penelope is not,
     though she outlasts most of the men on the list. */
  var HEROES = ['achilles', 'aeneas', 'agamemnon', 'ajax', 'antigone', 'atalanta',
    'bellerophon', 'cadmus', 'castor', 'hector', 'helen', 'heracles', 'hippolyta',
    'jason', 'medea', 'menelaus', 'minos', 'neoptolemus', 'odysseus', 'oedipus',
    'orestes', 'orpheus', 'paris', 'perseus', 'polydeuces', 'telemachus', 'theseus',
    'diomedes'];

  /* Figures whose story belongs to the war at Ilium and the journeys home,
     whatever their genealogical depth — this is the axis that generation
     distance cannot capture. Achilles stands 7 generations from Chaos and Helen
     16, and they fought the same war. */
  var TROJAN = ['achilles', 'aeneas', 'aegisthus', 'ajax', 'agamemnon', 'anchises',
    'calypso', 'cassandra', 'charybdis', 'circe', 'clytemnestra',
    'electra', 'ganymede', 'hecuba', 'hector', 'helen', 'iphigenia', 'laertes',
    'menelaus', 'neoptolemus', 'odysseus', 'orestes', 'paris', 'penelope',
    'polyphemus', 'priam', 'scylla', 'sirens', 'telemachus', 'thetis',
    'patroclus', 'andromache', 'anticlea', 'diomedes', 'sarpedon', 'idomeneus',
    'nestor', 'calchas', 'chryses', 'chryseis', 'briseis', 'protesilaus',
    'myrmidons', 'memnon', 'sinon', 'laocoon', 'ajaxlesser', 'suitors'];

  /* A handful the general rules place badly. */
  var ERA_FIX = {
    aphrodite: 2,      // foam-born, but she keeps her seat among the elder gods
    eris: 0,           // Night's daughter, though her apple starts the last era
    nemesis: 0,
    moirai: 0,
    typhon: 1,         // Gaia's answer to Zeus, not a beast of the heroic age
    echidna: 1,
    dardanus: 3,       // a son of Zeus, and the root of the Trojan house
    tantalus: 3,
    aeacus: 3,
    epaphus: 3,
    erichthonius: 3,
    pandora: 2,        // made in the age of Prometheus, not of heroes
    deucalion: 2,
    pyrrha: 2,
    hellen: 3,
    aeolus: 3,
    tyndareus: 4,
    leda: 4,
    peleus: 4,
    pasiphae: 4,       // Argonaut-generation figures of god kind that would
    aeetes: 4,         // otherwise inherit the Titan band of their parents
    zetes: 4,
    calais: 4
  };

  /* Needed only so the map can say "daughter of" rather than "child of".
     Group entries like The Erinyes are handled separately, as plurals. */
  var FEMALE = ['gaia','nyx','hemera','eris','nemesis','ceto','eurybia','echidna',
    'rhea','tethys','theia','phoebe','themis','mnemosyne','selene','eos','leto',
    'asteria','clymene','metis','styx','doris','perse','philyra','hecate','circe',
    'pasiphae','calypso','maia','thetis','amphitrite','medusa','scylla','iris',
    'aphrodite','hestia','demeter','hera','persephone','athena','artemis','hebe',
    'eileithyia','calliope','melpomene','nike','harmonia','sphinx','charybdis',
    'pandora','pyrrha','io','libya','europa','semele','ino','jocasta','antigone',
    'danae','andromeda','alcmene','deianira','hippodamia','aethra','ariadne',
    'phaedra','hippolyta','leda','helen','clytemnestra','electra','iphigenia',
    'hecuba','cassandra','penelope','eurydice','medea','atalanta','agave',
    'autonoe','niobe','daphne','chryseis','ismene','echo','psyche','galatea',
    'andromache','anticlea','amalthea','tyro','megara','glauce','coronis',
    'briseis','merope','cassiopeia','hypsipyle'];

  /* Genuine plurals. "The Hydra" and "The Minotaur" also start with "The" but
     are one creature each, so this cannot be inferred from the name. */
  var PLURAL = ['moirai','erinyes','cyclopes','hecatoncheires','graeae','harpies',
    'sirens','amazons','maenads','satyrs','suitors','kouretes','gigantes',
    'spartoi','myrmidons','stymphalianbirds','maresofdiomedes'];

  function orderOf(fig) {
    if (fig.kind === 'monster') return 'monster';
    if (fig.kind === 'mortal') return HEROES.indexOf(fig.id) >= 0 ? 'hero' : 'mortal';
    return fig.age;   // god: primordial | titan | olympian
  }

  /* Preferred era before descent is taken into account. */
  function preferredEra(fig, order, depth) {
    if (ERA_FIX[fig.id] !== undefined) return ERA_FIX[fig.id];
    if (TROJAN.indexOf(fig.id) >= 0) return 5;
    switch (order) {
      case 'primordial': return 0;
      case 'titan':      return depth >= 4 ? 2 : 1;   // second-generation Titans are Cronus's nephews — cousins of Zeus's generation
      case 'olympian':   return depth >= 5 ? 3 : 2;   // Zeus's children vs Zeus's siblings
      default:           return 4;                    // heroes, mortals, monsters
    }
  }

  /* An era must never sit above a parent's era, or the map would draw a child
     over its own father. Pushing down rather than pulling up is deliberate:
     Dionysus is the last god onto Olympus precisely because his mother was a
     Theban princess, so inheriting her era is the true answer, not a fudge. */
  function assign(list, depth) {
    var by = Object.create(null);
    list.forEach(function (f) { by[f.id] = f; });

    var order = Object.create(null), era = Object.create(null);
    list.forEach(function (f) {
      order[f.id] = orderOf(f);
      era[f.id] = preferredEra(f, order[f.id], depth[f.id]);
    });

    var parentsOf = function (f) {
      return (f.parents || []).concat(f.descent ? [f.descent] : []);
    };
    // depth order guarantees parents settle before their children
    list.slice().sort(function (a, b) { return depth[a.id] - depth[b.id]; })
      .forEach(function (f) {
        parentsOf(f).forEach(function (p) {
          if (by[p]) era[f.id] = Math.max(era[f.id], era[p]);
        });
      });

    return { order: order, era: era };
  }

  window.TAXONOMY = {
    ORDERS: ORDERS,
    ERAS: ERAS,
    assign: assign,
    isFemale: function (id) { return FEMALE.indexOf(id) >= 0; },
    isPlural: function (id) { return PLURAL.indexOf(id) >= 0; },
    LAYERS: LAYERS,
    byKey: function (k) {
      return ORDERS.filter(function (o) { return o.key === k; })[0] ||
             LAYERS.filter(function (o) { return o.key === k; })[0];
    }
  };
})();

/* The Greek atlas's adapter: what this subject supplies to the shared shell
   (core/shell.js) — its verbs, its vocabulary, its vertical, its intro. The
   rendering machinery itself lives in the shell; only what is genuinely Greek
   is here. */
(function () {
  'use strict';

  var TAX = window.TAXONOMY;
  var DATA = window.FIGURES;

  /* How a tie reads from each end. Recorded once from the actor's side; the
     receiving end is generated, so Medusa's panel says "Slain by Perseus"
     rather than repeating Perseus's line back at her. */
  var REL_VERB = {
    slew:     ['Slew', 'Slain by'],
    fought:   ['Fought', 'Fought by'],
    punished: ['Punished', 'Punished by'],
    taught:   ['Taught', 'Taught by'],
    aided:    ['Aided', 'Aided by'],
    loved:    ['Loved', 'Loved by']
  };

  var TIE_KIND = {
    blood:    { label: 'Blood',          note: 'Parent to child. The spine of the map.' },
    descent:  { label: 'Descended from', note: 'A real forebear, generations omitted.' },
    union:    { label: 'Union',          note: 'Marriage, consort, and the many affairs of Zeus.' },
    violence: { label: 'Violence',       note: 'Fought or slew. An arrowhead marks the killing blow.' },
    bond:     { label: 'Other tie',      note: 'Loved, aided, cursed, betrayed, taught.' },
    thing:    { label: 'Belongs to',     note: 'Made, wielded, ruled, sought, died at.' }
  };

  var env = null;   // the shell's helpers, captured at boot

  window.buildShell({
    name: 'figures',
    themeKey: 'myth-theme',
    ordersCaption: 'Orders of being',
    relVerbs: REL_VERB,
    tieKinds: TIE_KIND,

    /* The order carries the shape here: the vertical IS descent, so the order
       has nowhere else to live but shape and hue. */
    nodeShape: function (d, ord) { return ord.shape; },
    /* Glyphs live in world units. The Greek map's fit zoom stays close enough
       to 1:1 that marks never vanish, and a mark that changes size as you zoom
       was rejected as a change in meaning. */
    glyphGrowth: null,

    /* One vertical axis: era band, with the generation rows nested inside it.
       A separate depth-only mode said nothing this does not — every row is
       already labelled with its generation. */
    levelOf: function (id) { return env.eraOf[id] * 100 + env.depth[id]; },
    rowLabel: function (row) { return 'gen ' + (row.depth % 100); },
    layoutOpts: function () {
      /* Splitting rows by (era, generation) leaves many holding two or three
         figures, which makes the map a tall thin ribbon. Wider slots and bigger
         gaps trade some of that height back for width. */
      return { rowHeight: 112, gap: 24, minWidth: 60, widthFactor: 0.9 };
    },

    init: function (e) { env = e; },

    /* Every link says something about that particular pair. Violence and other
       ties carry a written label; blood and union take a note where the pairing
       has a story of its own, and otherwise get a sentence composed from the
       data — who the other parent was, or which children came of the match. */
    edgeSentence: function (rec) {
      if (rec.label) return rec.label;
      var byId = env.byId;
      var a = byId[rec.a], b = byId[rec.b];

      if (rec.type === 'blood') {
        var note = window.TIE_NOTES.blood[rec.a + '|' + rec.b];
        if (note) return note;
        var others = (b.parents || []).filter(function (p) { return p !== rec.a && byId[p]; });
        // a single recorded parent is a fact worth stating plainly: a great many
        // of the early powers were born to one parent and no other
        if (!others.length) return b.name + ', born to ' + a.name + ' alone';
        var rel = TAX.isPlural(rec.b) ? 'children'
          : (TAX.isFemale(rec.b) ? 'daughter' : 'son');
        return b.name + ', ' + rel + ' of ' + a.name + ' and ' + byId[others[0]].name;
      }

      if (rec.type === 'union') {
        var key = [rec.a, rec.b].sort().join('|');
        var un = window.TIE_NOTES.union[key];
        if (un) return un;
        var kids = DATA.filter(function (d) {
          var ps = d.parents || [];
          return ps.indexOf(rec.a) >= 0 && ps.indexOf(rec.b) >= 0;
        }).map(function (d) { return d.name; });
        if (!kids.length) return 'No children of this match are recorded here.';
        return 'Their ' + (kids.length === 1 ? 'child' : 'children') + ': ' + kids.join(', ') + '.';
      }

      if (rec.type === 'descent') {
        return b.name + ' comes of the line of ' + a.name +
          ', through generations not drawn here.';
      }
      return TIE_KIND[rec.type].note;
    },

    /* Reads along the arrow: A -> "father of" -> B. The passive forms the panel
       uses ("slain by") would point the wrong way against the arrowhead. */
    midVerb: function (rec) {
      if (rec.type === 'blood') return TAX.isFemale(rec.a) ? 'mother of' : 'father of';
      if (rec.type === 'descent') return 'ancestor of';
      if (rec.type === 'union') return 'consort';
      if (rec.type === 'thing') return rec.verb || 'of';
      return ((REL_VERB[rec.rel] || REL_VERB.aided)[0]).toLowerCase();
    },

    panel: {
      akaPrefix: 'Roman: ',
      parents: 'Parents',
      mates: function (n) { return n === 1 ? 'Consort' : 'Consorts'; },
      kids: 'Children',
      tag: function (d) {
        return '<span class="tag">Generation ' + env.depth[d.id] + ' of ' + env.MAXDEPTH + '</span>';
      },
      lineHeading: 'Line',
      lineText: function (anc, des) {
        return anc + ' ancestor' + (anc === 1 ? '' : 's') +
          ' · ' + des + ' descendant' + (des === 1 ? '' : 's') +
          ' — shown behind, half-faded';
      },
      isolate: 'Isolate this line',
      frame: 'Frame the whole line',
      traceLabel: 'Trace the line back'
    },

    table: {
      extraKey: function () { return null; },
      cell4: function (d) { return String(env.depth[d.id]); }
    },

    renderIntro: function (panel) {
      var esc = env.esc, mark = env.mark, tieSample = env.tieSample, chipFor = env.chipFor;
      panel.innerHTML =
        '<h2>How to read the map</h2>' +
        '<p class="blurb">Every figure is placed by descent and drawn to the others by five kinds of tie. ' +
        'Height is mythic time: the oldest powers at the top, the war at Ilium at the bottom. ' +
        'Nothing here is settled — the ancient sources contradict each other constantly, and where they do, the notes say so.</p>' +
        '<div class="placeholder"><ul>' +
        '<li><b>Click</b> a figure: their direct relations come forward, and the rest of their line sits behind at half strength. Click again to let go.</li>' +
        '<li><b>Double-click</b> to hide everyone not on that line — a banner appears with the way back out.</li>' +
        '<li><b>Hover a link</b> of the selected figure to read what passed between the two.</li>' +
        '</ul></div>' +
        '<section><h3>Orders of being</h3><div class="keylist">' +
        TAX.ORDERS.map(function (o) {
          return '<div class="keyrow"><span class="kmark">' + mark(o.key, 13) + '</span><span>' +
            '<span class="kname">' + esc(o.label) + '</span><br><span class="kdesc">' + esc(o.note) + '</span>' +
            '</span></div>';
        }).join('') + '</div></section>' +
        '<section><h3>Ties</h3><div class="keylist">' +
        Object.keys(TIE_KIND).map(function (t) {
          return '<div class="keyrow"><span class="kmark">' + tieSample(t) + '</span><span>' +
            '<span class="kname">' + esc(TIE_KIND[t].label) + '</span><br>' +
            '<span class="kdesc">' + esc(TIE_KIND[t].note) + '</span></span></div>';
        }).join('') + '</div></section>' +
        '<section><h3>Mythic eras — top to bottom</h3><div class="eralist">' +
        TAX.ERAS.map(function (e) {
          return '<div class="erarow"><span class="enum">' + String(e.key).padStart(2, '0') + '</span><span>' +
            '<span class="ename">' + esc(e.label) + '</span><br><span class="edesc">' + esc(e.note) + '</span>' +
            '</span></div>';
        }).join('') + '</div></section>' +
        '<section><h3>Try these</h3><div class="links">' +
        ['zeus', 'medusa', 'heracles', 'oedipus', 'typhon', 'helen'].map(chipFor).join('') +
        '</div></section>';
    },

    buildLegend: function () {
      var esc = env.esc, mark = env.mark, tieSample = env.tieSample;
      env.$('legend').innerHTML =
        '<span class="cap">Orders</span>' +
        TAX.ORDERS.map(function (o) {
          return '<span class="item">' + mark(o.key, 12) + esc(o.label) + '</span>';
        }).join('') +
        TAX.LAYERS.map(function (o) {
          return '<span class="item">' + mark(o.key, 12) + esc(o.plural) + '</span>';
        }).join('') +
        '<span class="sep">|</span><span class="cap">Ties</span>' +
        Object.keys(TIE_KIND).map(function (t) {
          return '<span class="item">' + tieSample(t) + esc(TIE_KIND[t].label) + '</span>';
        }).join('') +
        '<span class="sep">|</span>' +
        '<span class="item"><span class="cap">Size</span>&nbsp;how many ties a figure has</span>';
    }
  });
})();

</script>
