    L.nodes.forEach(function (n) {
      (n.data.parents || []).forEach(function (p) { addEdge(p, n.id, 'blood'); });
      if (n.data.descent) addEdge(n.data.descent, n.id, 'descent');
    });
    var seenPair = Object.create(null);
    L.nodes.forEach(function (n) {
      matesOf[n.id].forEach(function (c) {
        var key = [n.id, c].sort().join('|');
        if (seenPair[key]) return;
        seenPair[key] = 1;
        addEdge(n.id, c, 'union');
      });
    });
    TIES.forEach(function (t) { addEdge(t.a, t.b, t.type, t); });
    THING_TIES.forEach(function (t) { addEdge(t.a, t.b, 'thing', t); });

    var groups = Object.create(null);
    pending.forEach(function (e) {
      var key = [e.a, e.b].sort().join('|');
      (groups[key] = groups[key] || []).push(e);
    });
    var SPREAD = 20;
    Object.keys(groups).forEach(function (key) {
      var g = groups[key];
      g.forEach(function (e, i) { e.bow = g.length > 1 ? (i - (g.length - 1) / 2) * SPREAD : 0; });
    });

    pending.forEach(function (rec) {
      var d = edgePath(pos[rec.a], pos[rec.b], rec.type, rec.bow);
      var path = document.createElementNS(SVGNS, 'path');
      /* An adapter may grade an edge — a teaching link that is reported
         rather than documented draws dashed, so the drawing itself says how
         sure the record is. */
      var extra = A.edgeClass ? A.edgeClass(rec) : '';
      path.setAttribute('class', 'edge ' + rec.type + (rec.fatal ? ' fatal' : '') +
        (rec.kind ? ' ' + rec.kind : '') + (extra ? ' ' + extra : ''));
      path.setAttribute('vector-effect', 'non-scaling-stroke');
      path.setAttribute('d', d);
      gEdges.appendChild(path);

      var hit = document.createElementNS(SVGNS, 'path');
      hit.setAttribute('class', 'edgehit');
      hit.setAttribute('vector-effect', 'non-scaling-stroke');
      hit.setAttribute('d', d);
      hit.style.pointerEvents = 'none';
      gHits.appendChild(hit);

      rec.el = path; rec.hit = hit;
      edgeRecs.push(rec);
    });

    /* nodes */
    gNodes.textContent = '';
    gLabels.textContent = '';
    nodeEls = Object.create(null);
    nodeLgs = Object.create(null);
    nodeRecs = [];
    L.nodes.forEach(function (n) {
      var d = n.data, r = RADIUS[d.rank], ord = TAX.byKey(orderOf[d.id]);
      var g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', 'node' + (d.rank === 1 ? ' major' : '') + (d.thing ? ' thing' : ''));
      g.setAttribute('transform', 'translate(' + n.x.toFixed(1) + ',' + n.y.toFixed(1) + ')');
      g.setAttribute('data-id', d.id);
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      if (!ord) throw new Error('no order "' + orderOf[d.id] + '" in taxonomy.js — ' + d.name);
      g.setAttribute('aria-label', d.name + ' — ' + ord.label + ', ' +
        TAX.ERAS[eraOf[d.id]].label + '. ' + d.domain);

      var hit = document.createElementNS(SVGNS, 'circle');
      hit.setAttribute('class', 'hit');
      hit.setAttribute('r', Math.max(14, r + 8));
      g.appendChild(hit);

      var ring = document.createElementNS(SVGNS, 'circle');
      ring.setAttribute('class', 'ring');
      ring.setAttribute('r', r + 6);
      ring.setAttribute('vector-effect', 'non-scaling-stroke');
      g.appendChild(ring);

      var named = document.createElementNS(SVGNS, 'circle');
      named.setAttribute('class', 'named-ring');
      g.appendChild(named);

      var shape = glyphEl(A.nodeShape(d, ord), r);
      shape.setAttribute('class', 'glyph');
      shape.setAttribute('fill', hueOf(d.id));
      g.appendChild(shape);

      var t = document.createElementNS(SVGNS, 'text');
      t.setAttribute('class', 'label');
      t.setAttribute('y', r + 13);
      t.textContent = d.name;
      var lg = document.createElementNS(SVGNS, 'g');
      lg.setAttribute('class', g.getAttribute('class'));
      lg.setAttribute('transform', g.getAttribute('transform'));
      lg.setAttribute('data-id', d.id);
      lg.appendChild(t);
      gLabels.appendChild(lg);

      g.addEventListener('pointerenter', function (e) {
        if (!canHover(d.id)) return;
        state.hover = d.id; showNodeTip(d, e); highlight();
      });
      g.addEventListener('pointermove', moveTip);
      g.addEventListener('pointerleave', function () { state.hover = null; hideTip(); highlight(); });
      g.addEventListener('focus', function () {
        if (!canHover(d.id)) return;
        state.hover = d.id; highlight();
        var b = g.getBoundingClientRect();
        showNodeTip(d, { clientX: b.left + b.width / 2, clientY: b.top });
      });
      g.addEventListener('blur', function () { state.hover = null; hideTip(); highlight(); });
      g.addEventListener('click', function (e) { e.stopPropagation(); cycle(d.id); });
      g.addEventListener('dblclick', function (e) { e.stopPropagation(); setFocus(d.id); });
      g.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycle(d.id); }
      });

      lg.addEventListener('pointerenter', function (e) {
        if (!canHover(d.id)) return;
        state.hover = d.id; showNodeTip(d, e); highlight();
      });
      lg.addEventListener('pointermove', moveTip);
      lg.addEventListener('pointerleave', function () { state.hover = null; hideTip(); highlight(); });
      lg.addEventListener('click', function (e) { e.stopPropagation(); cycle(d.id); });
      lg.addEventListener('dblclick', function (e) { e.stopPropagation(); setFocus(d.id); });

      gNodes.appendChild(g);
      nodeEls[d.id] = g;
      nodeLgs[d.id] = lg;
      nodeRecs.push({ id: d.id, label: t, lg: lg, hit: hit, r: r, rank: d.rank, named: named,
                      glyph: shape, ring: ring,
                      x: n.x, row: n.row, w: widths[d.id], deg: degreeOf[d.id] });
    });

    byRow = L.rows.map(function () { return []; });
    nodeRecs.forEach(function (rec) { byRow[rec.row].push(rec); });
    byRow.forEach(function (row) {
      row.sort(function (a, b) { return a.rank - b.rank || b.deg - a.deg || a.x - b.x; });
    });
    lastK = -1;

    buildPanes();
    applyVisibility();
    if (refit) reFrame(true); else applyTransform();
  }

  /* Each pane is its own viewport: it keeps a fixed horizontal home and takes
     only its vertical scroll from the middle. That is what lets a figure's
     objects and places stay on screen beside it however far the family map is
     zoomed in — no zooming out to find what somebody owned. */
  function buildPanes() {
    gSideNodes.textContent = '';
    gSideEdges.item.textContent = '';
    gSideEdges.place.textContent = '';
    gSideLabels.item.textContent = '';
    gSideLabels.place.textContent = '';
    sideRecs = []; sideEdgeRecs = [];

    thingNodes.forEach(function (t) {
      var g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', 'node thing ' + t.kind);
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      g.setAttribute('aria-label', t.name + ' — ' + TAX.byKey(t.kind).label + '. ' + T(t.domain));

      var hit = document.createElementNS(SVGNS, 'circle');
      hit.setAttribute('class', 'hit'); hit.setAttribute('r', 12);
      g.appendChild(hit);
      var ring = document.createElementNS(SVGNS, 'circle');
      ring.setAttribute('class', 'ring'); ring.setAttribute('r', 10);
      ring.setAttribute('vector-effect', 'non-scaling-stroke');
      g.appendChild(ring);
      var named = document.createElementNS(SVGNS, 'circle');
      named.setAttribute('class', 'named-ring');
      g.appendChild(named);
      var shape = glyphEl(TAX.byKey(t.kind).shape, 5.5);
      shape.setAttribute('class', 'glyph');
      g.appendChild(shape);
      if (A.decoratePaneEntry) A.decoratePaneEntry(t, g);

      var lab = document.createElementNS(SVGNS, 'text');
      lab.setAttribute('class', 'label');
      lab.setAttribute('y', 3.5);
      lab.setAttribute('x', A.paneLabelX ? A.paneLabelX(t)
        : (t.kind === 'item' ? 11 : -11));
      lab.textContent = t.name;
      g.appendChild(lab);

      /* A pane entry always answers with its own name — a column of unlabelled
         marks is unreadable, and reading the list is the point of the pane.
         What it does NOT do during a chapter is touch the links: the chapter's
         connectors belong to the chapter, and promoting one while fading the
         rest takes the passage apart under the pointer. Same rule the figures
         follow. */
      g.addEventListener('pointerenter', function (e) {
        /* Three separate things, and a chapter wants a different subset of them
           than a free map does:
           - the entry's own name, always: an unlabelled column is unreadable;
           - the tooltip and its connectors, only for an entry the chapter is
             about — an entry it has dimmed should stay dimmed;
           - the hover FOCUS, never during a chapter, because re-highlighting
             around this thing's own relations reaches well outside the passage. */
        g.classList.add('peek');
        state.hoverThing = t.id;
        if (canHover(t.id)) showNodeTip(t, e);
        if (!state.tourIds || state.sel) state.hover = t.id;
        highlight();
      });
      g.addEventListener('pointermove', function (e) { if (canHover(t.id)) moveTip(e); });
      g.addEventListener('pointerleave', function () {
        g.classList.remove('peek');
        state.hoverThing = null; state.hover = null; hideTip(); highlight();
      });
      g.addEventListener('click', function (e) { e.stopPropagation(); cycle(t.id); });
      g.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycle(t.id); }
      });
      gSideNodes.appendChild(g);
      nodeEls[t.id] = g;
      sideRecs.push({ id: t.id, kind: t.kind, el: g, label: lab });
    });

    THING_TIES.forEach(function (t) {
      var path = document.createElementNS(SVGNS, 'path');
      path.setAttribute('class', 'sideedge ' + byId[t.b].kind);
      gSideEdges[byId[t.b].kind].appendChild(path);
      var lab = document.createElementNS(SVGNS, 'text');
      lab.setAttribute('class', 'sidelabel ' + byId[t.b].kind);
      lab.textContent = t.verb;
      gSideLabels[byId[t.b].kind].appendChild(lab);
      sideEdgeRecs.push({ a: t.a, b: t.b, type: 'thing', verb: t.verb, el: path, label: lab });
    });
  }

  /* Filtering and isolating are pure hide operations over the fixed layout. */
  /* The label layer is a sibling of the node layer, so it does not inherit the
     node's state classes — they are copied across whenever they change. Copying
     the whole class attribute rather than mirroring each toggle means a state
     added later cannot be forgotten here. */
  function syncLabels() {
    nodeRecs.forEach(function (rec) {
      if (!rec.lg) return;
      var c = nodeEls[rec.id].getAttribute('class');
      if (rec.lg.getAttribute('class') !== c) rec.lg.setAttribute('class', c);
    });
  }

  function applyVisibility() {
    var vis = visibleIds();
    $('empty').classList.toggle('show', vis.size === 0 && state.view === 'map');

    nodeRecs.forEach(function (rec) {
      rec.shown = vis.has(rec.id);
      nodeEls[rec.id].classList.toggle('hidden', !rec.shown);
      if (rec.lg) rec.lg.classList.toggle('hidden', !rec.shown);
    });
    sideRecs.forEach(function (r) { r.shown = vis.has(r.id); });
    sideEdgeRecs.forEach(function (e) {
      e.shown = state.ties.has('thing') && vis.has(e.a) && vis.has(e.b);
    });
    edgeRecs.forEach(function (e) {
      var shown = state.ties.has(e.type) && vis.has(e.a) && vis.has(e.b);
      e.shown = shown;
      e.el.classList.toggle('hidden', !shown);
      e.hit.classList.toggle('hidden', !shown);
    });

    highlight();
  }

  /* Split every curve at its midpoint. A single C or Q has no interior vertex,
     and marker-mid only draws at interior vertices — so without the split there
     is nowhere for a mid-line arrow to go. De Casteljau at t = 0.5 gives two
     halves that trace exactly the same curve. */
  function edgeGeom(a, b, type, bow) {
    bow = bow || 0;
    var ra = RADIUS[a.data.rank], rb = RADIUS[b.data.rank];
    var mid2 = function (p, q) { return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; };
    var f = function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); };

    if (Math.abs(a.y - b.y) < 1) {
      var span = Math.abs(b.x - a.x);
      var lift = Math.min(52, 22 + span * 0.13) + bow * 0.9;
      var p0 = [a.x, a.y - ra - 2], c = [(a.x + b.x) / 2, a.y - lift], p1 = [b.x, b.y - rb - 2];
      var qa = mid2(p0, c), qb = mid2(c, p1), qm = mid2(qa, qb);
      return { d: 'M' + f(p0) + 'Q' + f(qa) + ' ' + f(qm) + 'Q' + f(qb) + ' ' + f(p1),
               mx: qm[0], my: qm[1] };
    }
    var dir = b.y > a.y ? 1 : -1;
    var y1 = a.y + dir * (ra + 2), y2 = b.y - dir * (rb + 3), dy = (y2 - y1) * 0.5;
    var P0 = [a.x, y1], C1 = [a.x + bow, y1 + dy], C2 = [b.x + bow, y2 - dy], P1 = [b.x, y2];
    var A2 = mid2(P0, C1), B = mid2(C1, C2), C3 = mid2(C2, P1);
    var D = mid2(A2, B), E = mid2(B, C3), M = mid2(D, E);
    return { d: 'M' + f(P0) + 'C' + f(A2) + ' ' + f(D) + ' ' + f(M) +
                'C' + f(E) + ' ' + f(C3) + ' ' + f(P1),
             mx: M[0], my: M[1] };
  }
  function edgePath(a, b, type, bow) { return edgeGeom(a, b, type, bow).d; }

  /* ------------------------------------------------------------- highlight */

  function highlight() {
    var strong = null, mid = null, focal = null, preview = null;

    if (state.trace) {
      focal = state.sel;
      strong = state.trace;
    } else if (state.sel) {
      /* A HOVERED FIGURE IS PREVIEWED AS IF IT WERE CHOSEN. This used to be
         `strong.add(state.hover)`, which is invisible in the two cases that
         matter: a teacher or a student is already in the selection's strong
         set, so adding them again does nothing at all; and anyone else became
         one more lit node among forty, with no label, because the row's label
         slot had already been claimed by somebody the reader was not pointing
         at. Pointing at a name told you almost nothing.

         So the hovered figure takes the focus, with its own connections lit,
         and the chosen one steps back to half strength rather than vanishing —
         it keeps its `sel` mark, so the way back is visible the whole time. */
      preview = (state.hover && state.hover !== state.sel && byId[state.hover] &&
                 !byId[state.hover].thing) ? state.hover : null;
      focal = preview || state.sel;
      strong = directSet(focal);
      mid = new Set();
      lineageSet(focal).forEach(function (id) { if (!strong.has(id)) mid.add(id); });
      if (preview) {
        /* The chosen figure and everyone it connects to stay legible behind
           the preview: losing them entirely would make hovering a chip feel
           like a selection you did not ask for. */
        directSet(state.sel).forEach(function (id) { if (!strong.has(id)) mid.add(id); });
      }
    } else if (state.hover) {
      focal = state.hover;
      strong = directSet(state.hover);
    } else if (state.tourIds) {
      focal = state.tourIds[0];
      strong = new Set(state.tourIds);
    }

    stage.style.setProperty('--hl', focal ? hueOf(focal) : 'var(--ink)');

    Object.keys(nodeEls).forEach(function (id) {
      var el = nodeEls[id];
      var isOn = !strong || strong.has(id);
      var isMid = !isOn && mid && mid.has(id);
      el.classList.toggle('on', !!strong && isOn);
      el.classList.toggle('mid', !!isMid);
      el.classList.toggle('off', !!strong && !isOn && !isMid);
      el.classList.toggle('sel', id === state.sel);
      /* The one being pointed at, marked apart from the ones it happens to be
         connected to — otherwise a preview lights a constellation and does not
         say which star the reader asked about. */
      el.classList.toggle('preview', id === preview);
    });

    edgeRecs.forEach(function (e) {
      var on = strong && strong.has(e.a) && strong.has(e.b);
      var inMid = !on && strong &&
        (strong.has(e.a) || (mid && mid.has(e.a))) &&
        (strong.has(e.b) || (mid && mid.has(e.b)));
      e.el.classList.toggle('on', !!on);
      e.el.classList.toggle('mid', !!inMid);
      e.el.classList.toggle('off', !!strong && !on && !inMid);
      // the hit strokes stay inert: the verb labels carry the pointer now
      e.hit.style.pointerEvents = 'none';
    });
    /* Pointing at an object or a place pulls its own links to full colour and
       pushes the rest of the bundle back — a brighter line among forty faint
       ones is otherwise impossible to follow. During a chapter this is limited
       to entries the chapter is actually about; an entry it has dimmed only
       names itself, and lighting its links would draw the eye off the passage. */
    var hotThing = (state.hoverThing && canHover(state.hoverThing)) ? state.hoverThing : null;
    sideEdgeRecs.forEach(function (e) {
      var on = strong && strong.has(e.a) && strong.has(e.b);
      var hot = hotThing !== null && (e.b === hotThing || e.a === hotThing);
      e.el.classList.toggle('on', !!on || hot);
      e.el.classList.toggle('off', !!strong && !on && !hot);
      e.el.classList.toggle('hot', hot);
      e.label.classList.toggle('hot', hot);
      e.el.style.pointerEvents = 'none';
    });
    stage.classList.toggle('side-hover', hotThing !== null);
    // a selection changes which connectors are lit, and their labels are placed
    // in layoutPanes — without this nothing appeared until the reader panned
    if (sideRecs.length) layoutPanes();

    hlStrong = strong; hlMid = mid; hlFocal = focal;
    updateDetail();          // settle which figure names show...
    rebuildEdgeLabels();     // ...before the link labels dodge them
    markRoster();
    syncLabels();
  }

  /* Clicking nothing clears the selection. Every node, pane entry and edge
     stops its own click from propagating, so anything reaching the stage landed
     on empty space. A pan has to be excluded: a drag ends in a click too, and
     letting that clear the selection means the map deselects whenever you move
     it. Four pixels of travel is the threshold. */
  (function () {
    var downX = 0, downY = 0;
    stage.addEventListener('pointerdown', function (e) { downX = e.clientX; downY = e.clientY; });
    stage.addEventListener('click', function (e) {
      if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) return;
      if (state.sel) select(null);
    });
  })();

  /* -------------------------------------------------- pan, zoom, detail */

  function applyTransform() {
    viewport.setAttribute('transform',
      'translate(' + tx.toFixed(2) + ',' + ty.toFixed(2) + ') scale(' + k.toFixed(4) + ')');
    /* Both captions are pinned to the screen, but the headroom that separates
       them lives in world space and shrinks as you zoom out. Drop the
       generation caption wherever the band caption has caught up with it. */
    var capX = midBox().left + 12;
    var capY = bandRecs.map(function (r) {
      var y = r.band.top * k + ty + 15;
      r.num.setAttribute('x', capX); r.num.setAttribute('y', y.toFixed(1));
      r.lab.setAttribute('x', capX + 20); r.lab.setAttribute('y', y.toFixed(1));
      return y;
    });
    /* Column headers ride along the top of the viewport rather than the top of
       the map, so the tradition you are looking at is named however far down
       the century you have scrolled. */
    var mb = midBox();
    colRecs.forEach(function (r) {
      var left = r.col.left * k + tx, w = r.col.width * k;
      r.el.setAttribute('x', (left + w / 2).toFixed(1));
      r.el.setAttribute('y', 14);            // midBox is width/height only, it has no top
      r.el.setAttribute('text-anchor', 'middle');
      var off = left + w < mb.left + 20 || left > mb.left + mb.width - 20;
      r.el.style.display = off ? 'none' : '';
      if (off) return;
      /* Full name where it fits, first word where it does not, hidden only
         when even that overruns the stripe. */
      if (r.el.textContent !== r.full) r.el.textContent = r.full;
      var need = 0;
      try { need = r.el.getComputedTextLength(); } catch (e) { need = 0; }
      if (need > w - 10) {
        r.el.textContent = r.abbr;
        try { need = r.el.getComputedTextLength(); } catch (e) { need = 0; }
        if (need > w - 6) r.el.style.display = 'none';
      }
    });
    /* Drop a header that would run into the one before it. Two adjacent narrow
       columns printed straight over each other, and a label you cannot read is
       worse than a column left unnamed, because the stripe underneath still
       says where the boundary is. */
    var edge = -Infinity;
    colRecs.forEach(function (r) {
      if (r.el.style.display === 'none') return;
      var half = 0;
      try { half = r.el.getComputedTextLength() / 2; } catch (e) { half = 0; }
      var x = +r.el.getAttribute('x');
      if (x - half < edge + 10) { r.el.style.display = 'none'; return; }
      edge = x + half;
    });
    rowRecs.forEach(function (r) {
      var y = r.row.y * k + ty + 4;
      r.label.setAttribute('x', capX);
      r.label.setAttribute('y', y.toFixed(1));
      var clash = capY.some(function (cy) { return Math.abs(cy - y) < 11; });
      r.label.style.display = clash ? 'none' : '';
    });
    if (Math.abs(k - lastK) > 0.0005) updateDetail();
    layoutPanes();
    positionEdgeLabels();
    showExtent(mb);
  }

  /* HOW MUCH MAP IS THERE, AND WHERE AM I IN IT.
     Both axes are named at all times — the column headers ride the top of the
     viewport and the era captions ride its left edge — so a reader always knows
     WHAT they are looking at. What they had no way to know is how much lies
     outside the window: this map is 8403 world px wide, and on a phone zoomed
     enough to read a name you are holding about a twentieth of it with nothing
     to say so. Two thin bars, read the way everybody already reads a scrollbar.
     They appear only when something is actually off-screen, so the fitted view
     — where the answer is "all of it" — stays clean. */
  var extentEls = null;
  function showExtent(mb) {
    if (!current) return;
    if (!extentEls) {
      var wrap = $('stagewrap');
      if (!wrap) return;
      extentEls = {};
      ['x', 'y'].forEach(function (ax) {
        var track = document.createElement('div');
        track.className = 'extent ' + ax;
        track.setAttribute('aria-hidden', 'true');   // the map itself is the content
        var thumb = document.createElement('i');
        track.appendChild(thumb);
        wrap.appendChild(track);
        extentEls[ax] = { track: track, thumb: thumb };
      });
    }
    if (!figureBox) return;
    var b = box();
    /* Measured against the figures, plus a margin the size of a name, because
       a node sitting exactly on the edge is not fully visible either. */
    var M = 40;
    var set = function (ax, viewLen, lo, hi, off) {
      var e = extentEls[ax];
      var span = (hi - lo) * k + M * 2;
      var shown = viewLen / span;
      if (!(shown < 0.99) || !isFinite(shown)) { e.track.style.display = 'none'; return; }
      e.track.style.display = '';
      // the span's near edge sits at `off` on screen; how far into it are we?
      var start = Math.max(0, Math.min(1 - shown, (-off + lo * k - M) / span));
      e.thumb.style[ax === 'x' ? 'left' : 'top'] = (start * 100).toFixed(2) + '%';
      e.thumb.style[ax === 'x' ? 'width' : 'height'] = (shown * 100).toFixed(2) + '%';
    };
    set('x', mb.width, figureBox.x0, figureBox.x1, tx - mb.left);
    set('y', b.height, figureBox.y0, figureBox.y1, ty);
  }

  function updateDetail() {
    lastK = k;
    var inv = 1 / k, s = inv.toFixed(4);

        var want = Math.max(minK(), Math.min(2.8,
          dtapK * Math.pow(1.006, dtapY - e.clientY)));
        if (want !== k) zoomBy(want / k, sx - b2.left, sy - b2.top);
        moved = true;
        return;
      }
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved) {
        if (Math.abs(dx) + Math.abs(dy) <= SLOP) return;
        moved = true; held = true; heldId = e.pointerId;
        autoFrame = null;
        glideToken++;             // stop an in-flight glide fighting the drag
        try { stage.setPointerCapture(e.pointerId); } catch (err) { held = false; }
        stage.classList.add('dragging');
        hoverEdge(null);
        hideTip();
      }
      tx = ox + dx; ty = oy + dy;
      applyTransform();
    });
    /* Losing a finger ends or re-bases the pinch; the survivor has to press
       again before it can drag, or a lift would jump the map. */
    var lift = function (e) {
      if (!pointers.delete(e.pointerId)) return;
      if (pinch) pinch = pointers.size === 2 ? pinchNow() : null;
    };
    stage.addEventListener('pointerup', function (e) {
      lift(e);
      if (!down) return;
      down = false;
      release(e.pointerId);
      stage.classList.remove('dragging');
      if (!moved) { lastTap = Date.now(); tapX = e.clientX; tapY = e.clientY; }
      dtap = false;
      if (!moved && e.target === stage) select(null);
    });
    stage.addEventListener('pointercancel', function (e) {
      lift(e);
      down = false; release(e.pointerId); stage.classList.remove('dragging');
    });
  })();

  /* --------------------------------------------------------------- tooltip */

  var tip = $('tip');
  /* Born and died, rendered once. The panel had the pair — "1919–2009", with
     the approximations marked — and the tooltip said only "b. 1919", so
     hovering the map told you less than clicking it about the one fact the map
     is laid out on. Two renderings of one fact drift, so there is one, and
     both callers use it. A figure with no death year keeps "b. 1919"; the
     Greek atlas has no death years at all and reads exactly as before. */
  function lifespan(d) {
    if (!d.year) return '';
    var born = (d.inferred ? '≈' : '') + d.year;
    return d.died ? born + '–' + (d.diedApprox ? 'c.' : '') + d.died
                  : T('b. {y}').replace('{y}', String(born));
  }
  function showNodeTip(d, e) {
    var ord = TAX.byKey(orderOf[d.id]);
    tip.innerHTML =
      '<div class="t-name">' + esc(d.name) + '</div>' +
      '<div class="t-meta">' + (nameOf(d.id).greek ? esc(nameOf(d.id).greek) + ' · ' : '') +
        esc(ord.label) +
        (d.year ? ' · ' + esc(lifespan(d)) : '') +
        (d.conf ? ' · ' + esc(d.conf) : '') +
        ' · ' + esc(TAX.ERAS[eraOf[d.id]].label) + '</div>' +
      (nameOf(d.id).epithet ? '<div class="t-epi">' + esc(nameOf(d.id).epithet) + '</div>' : '') +
      '<div class="t-dom">' + esc(d.domain) + '</div>';
    tipAvoid = nodeEls[d.id] ? [nodeEls[d.id]] : [];
    tip.classList.add('show');
    moveTip(e);
  }

  function showEdgeTip(rec, e) {
    var kind = TIE_KIND[rec.type];
    var arrow = rec.type === 'union' ? ' — ' : ' → ';
    tip.innerHTML =
      '<div class="t-kind">' + esc(kind.label) +
        (rec.rel ? ' · ' + esc((REL_VERB[rec.rel] || REL_VERB.aided)[0].toLowerCase()) : '') +
        (rec.fatal ? ' · fatal' : '') + '</div>' +
      '<div class="t-name">' + esc(byId[rec.a].name) + arrow + esc(byId[rec.b].name) + '</div>' +
      '<div class="t-dom">' + esc(A.edgeSentence(rec)) + '</div>' +
      /* AN ABSENT CITATION IS SAID, NOT OMITTED. A link with no source used to
         render nothing where the source line goes, which is indistinguishable
         from a reader not having looked — and 91 of the 508 teaching edges on
         the dance map are in exactly that state while the other 417 are drawn
         identically. A blank is a claim about the reader's attention; a line
         is a claim about the record. */
      (rec.src ? '<div class="t-src">Source: ' + esc(rec.src) + '</div>'
               : '<div class="t-src none">' + esc(T('No source recorded for this link')) + '</div>');
    tipAvoid = [nodeEls[rec.a], nodeEls[rec.b]].filter(Boolean);
    tip.classList.add('show');
    moveTip(e);
  }
  /* Candidate slots around the cursor, tried in order. The first that clears
     the figures this tooltip is about wins; if none is clear, the least
     obstructive one does. Reading "Hera → Heracles" is no use if the card is
     sitting on top of Heracles. */
  var tipAvoid = [];
  function moveTip(e) {
    var w = tip.offsetWidth, h = tip.offsetHeight, M = 8;
    var vw = window.innerWidth, vh = window.innerHeight;
    var cx = e.clientX, cy = e.clientY;
    var rects = tipAvoid.map(function (el) { return el.getBoundingClientRect(); });

    var slots = [
      [cx + 16, cy - h - 16], [cx - w - 16, cy - h - 16],
      [cx + 16, cy + 24],     [cx - w - 16, cy + 24],
      [cx + 16, cy - h / 2],  [cx - w - 16, cy - h / 2],
      [cx - w / 2, cy - h - 30], [cx - w / 2, cy + 30]
    ];

    var best = null;
    slots.forEach(function (slot) {
      var x = Math.max(M, Math.min(vw - w - M, slot[0]));
      var y = Math.max(M, Math.min(vh - h - M, slot[1]));
      var over = 0;
      rects.forEach(function (r) {
        // overlap is measured after clamping — a slot pushed back inside the
        // window can land on the very thing it was chosen to avoid
        over += Math.max(0, Math.min(x + w, r.right) - Math.max(x, r.left)) *
                Math.max(0, Math.min(y + h, r.bottom) - Math.max(y, r.top));
      });
      if (!best || over < best.over) best = { x: x, y: y, over: over };
    });

    tip.style.left = best.x + 'px';
    tip.style.top = best.y + 'px';
  }

  function hideTip() { tip.classList.remove('show'); tipAvoid = []; }

  /* Lift the hovered link out of the tangle: thicken it, and move it into a
     group drawn above the rest, because SVG has no z-index — paint order is
     document order, so a thicker line alone would still sit under its
     neighbours. Both ends get their ring so the pair is unmistakable. */
  /* The selected figure's links carry their verb the whole time, quietly; the
     hovered one is promoted rather than being the only way to read anything. */
  var edgeLabels = [];
  function rebuildEdgeLabels() {
    gEdgeLabels.textContent = '';
    edgeLabels = [];
    edgeRecs.forEach(function (e) {
      if (e.shown === false) return;
      if (!e.el.classList.contains('on')) return;
      var t = document.createElementNS(SVGNS, 'text');
      t.setAttribute('class', 'edgelabel ' + e.type + (e === hoveredEdge ? ' strong' : ''));
      t.style.pointerEvents = 'painted';
      t.textContent = A.midVerb(e);
      /* The verb is what a reader aims at, not the line. Curves run close
         together and their fat invisible hit strokes overlap, so pointing at a
         line was a lottery between three edges; the words are already spaced
         apart from each other by the label placer. */
      t.addEventListener('pointerenter', function (ev) {
        if (NOHOVER.matches) return;          // a finger has no hover; see canHover
        hoverEdge(e); showEdgeTip(e, ev); });
      t.addEventListener('pointermove', moveTip);
      t.addEventListener('pointerleave', function () { hoverEdge(null); hideTip(); });
      gEdgeLabels.appendChild(t);
      edgeLabels.push({ rec: e, el: t });
    });
    positionEdgeLabels();
  }

  /* Several links can share a pair — and their midpoints sit almost on top of
     each other. Place each label at its own midpoint, then nudge it up or down
     until it is clear of the ones already placed; drop it if nothing is free.
     Placement depends on the layout and the zoom and on nothing else. It used
     to give the hovered label first pick, which meant pointing at a verb
     rearranged its neighbours — and since the verb is the pointer target, the
     rearrangement moved things out from under the pointer. */
  function positionEdgeLabels() {
    if (!edgeLabels.length) return;

    /* Obstacles are the figures' own names, measured rather than modelled. An
       analytic box has to guess the baseline offset, the cap height and whether
       the name is set bold when highlighted; every one of those guesses was
       wrong by a few pixels, which is exactly the margin that decides an
       overlap. getBoundingClientRect is the ground truth. */
    var org = stage.getBoundingClientRect();
    var placed = [];
    nodeRecs.forEach(function (r) {
      if (r.shown === false) return;
      var el = nodeEls[r.id];
      if (!el || el.classList.contains('off')) return;
      if (getComputedStyle(r.label).display === 'none') return;
      var b = r.label.getBoundingClientRect();
      if (!b.width) return;
      placed.push({ x0: b.left - org.left - 3, x1: b.right - org.left + 3,
                    y0: b.top - org.top - 2,  y1: b.bottom - org.top + 2 });
    });

    var mb = midBox(), TOP = 14, BOT = org.height - 8;
    edgeLabels.forEach(function (L) {
      var a = posById[L.rec.a], b = posById[L.rec.b];
      if (!a || !b) { L.el.style.display = 'none'; return; }
      var g = edgeGeom(a, b, L.rec.type, L.rec.bow);
      var x = g.mx * k + tx, y0 = g.my * k + ty - 6;
      /* A midpoint outside the map has no business carrying a label — the
         nudges would otherwise walk it up over the header or in under a pane. */
      if (x < mb.left + 6 || x > mb.left + mb.width - 6 || y0 < TOP - 40 || y0 > BOT + 40) {
        L.el.style.display = 'none'; return;
      }
      L.el.style.display = '';
      var half = (L.el.getComputedTextLength ? L.el.getComputedTextLength()
                  : L.el.textContent.length * 5.5) / 2 + 3;
      var h = 11;                     // reserve the same box whether or not it is hovered
      var free = null;
      for (var i = 0; i < NUDGES.length && free === null; i++) {
        var y = y0 + NUDGES[i], ok = true;
        if (y < TOP || y > BOT) continue;      // never off the top of the map
        for (var j = 0; j < placed.length; j++) {
          var p = placed[j];
          if (x - half < p.x1 && x + half > p.x0 && y - h < p.y1 && y + 3 > p.y0) { ok = false; break; }
        }
        if (ok) free = y;
      }
      if (free === null) { L.el.style.display = 'none'; return; }
      /* the group lives under the zoom transform, so the label is pinned to
         a world point and counter-scaled to keep a constant size on screen */
      L.el.setAttribute('transform',
        'translate(' + g.mx.toFixed(1) + ',' + ((free - ty) / k).toFixed(1) + ') scale(' + (1 / k).toFixed(4) + ')');
      L.el.setAttribute('x', 0);
      L.el.setAttribute('y', 0);
      placed.push({ x0: x - half, x1: x + half, y0: free - h, y1: free + 3 });
    });
  }

  var NUDGES = [0, -13, 13, -26, 26, -39, 39];

  var hoveredEdge = null;
  function hoverEdge(rec) {
    if (hoveredEdge === rec) return;
    if (hoveredEdge) {
      hoveredEdge.el.classList.remove('hovered');
      gEdges.appendChild(hoveredEdge.el);          // order among edges is not meaningful
      [hoveredEdge.a, hoveredEdge.b].forEach(function (id) {
        if (nodeEls[id]) nodeEls[id].classList.remove('tie-end');
      });
    }
    hoveredEdge = rec;
    stage.classList.toggle('edge-hover', !!rec);
    if (rec) {
      rec.el.classList.add('hovered');
      gTop.appendChild(rec.el);
      [rec.a, rec.b].forEach(function (id) {
        if (nodeEls[id]) nodeEls[id].classList.add('tie-end');
      });
    }
    /* Promote the verb in place. Rebuilding the labels here would re-run the
       placer and shuffle every one of them, so a label moved out from under the
       pointer the instant it was pointed at — and the label IS the pointer
       target, so it also destroyed the element mid-hover. Where a label sits is
       a function of the layout and the zoom, and nothing else. */
    edgeLabels.forEach(function (L) { L.el.classList.toggle('strong', L.rec === rec); });
  }

  /* ----------------------------------------------------------------- panel */

  function chipFor(id) {
    return '<button class="link" data-go="' + esc(id) + '">' +
      mark(orderOf[id], 10) + esc(byId[id].name) + '</button>';
  }
  function listSection(title, ids) {
    if (!ids.length) return '';
    return '<section><h3>' + esc(title) + ' <span style="color:var(--muted);font-weight:400">' +
      ids.length + '</span></h3><div class="links">' + ids.map(chipFor).join('') + '</div></section>';
  }
  /* A chip names somebody who is drawn on the map a few hundred pixels away,
     and until now the only way to find out which one was to click it and lose
     the panel you were reading. Hovering the chip lights that figure exactly
     as hovering the node does — the same `state.hover`, the same `highlight()`
     — so a list of twenty-nine people you shared a room with can be read
     against the map without leaving the list.

     Not on a touch screen, where there is no hover to speak of and a finger
     resting on a chip mid-scroll would light the map at random: `canHover`
     already says so, and says it in one place. */
  function wireChips(panel) {
    panel.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () { select(b.getAttribute('data-go'), true); });
      b.addEventListener('pointerenter', function () { chipHover(b.getAttribute('data-go')); });
      b.addEventListener('pointerleave', chipUnhover);
      /* Keyboard reaches the same place: tabbing a long list of chips should
         light the map the way a pointer does. */
      b.addEventListener('focus', function () { chipHover(b.getAttribute('data-go')); });
      b.addEventListener('blur', chipUnhover);
    });
  }
  function chipHover(id) {
    if (!id || !byId[id] || !canHover(id)) return;
    if (byId[id].thing) state.hoverThing = id; else state.hover = id;
    highlight();
  }
  function chipUnhover() {
    if (!state.hover && !state.hoverThing) return;
    state.hover = null; state.hoverThing = null;
    highlight();
  }

  /* A figure's things, split by kind and titled by the atlas: Greek keeps
     "Objects", dance says "Works". `A.thingChipExtra` lets an atlas hang
     something under an individual chip — dance puts the footage there — and
     its presence is what switches the list from wrapped chips to stacked rows,
     so an atlas that supplies nothing looks exactly as it did. */
  function thingSections(d) {
    var rows = tiesOf[d.id].filter(function (t) { return t.type === 'thing'; });
    if (!rows.length) return '';
    var P = A.panel || {};
    var groups = [
      { title: T(P.thingsHeading || 'Objects'), rows: rows.filter(function (t) {
          return byId[t.b] && byId[t.b].kind !== 'place'; }) },
      { title: T(P.placesHeading || 'Places'), rows: rows.filter(function (t) {
          return byId[t.b] && byId[t.b].kind === 'place'; }) }
    ];
    return groups.map(function (g) {
      if (!g.rows.length) return '';
      /* Decided before the rows are built: once ANY row in this section carries
         an extra, the section stacks and EVERY row gets the same wrapper.
         Mixing bare chips with wrapped ones in one column left the plain ones
         hanging at a different left edge. */
      var stacked = !!(A.thingChipExtra && g.rows.some(function (t) {
        return A.thingChipExtra(t.b); }));
      var body = g.rows.map(function (t) {
        /* Whatever distinction the atlas draws in its pane travels with the
           thing into the panel — a work that reads as singled out in one list
           and ordinary in the other is two different claims about one work. */
        var cls = A.thingChipClass ? (A.thingChipClass(t.b) || '') : '';
        /* A work without its year is a title you have to look up to place. The
           atlas supplies it, because only the atlas knows whether a thing has
           a date at all. The TIE goes with it: a work's year is a fact about
           the work, but a person's years at a place are a fact about that
           person's spell there, and the same place carries a different span
           for everybody in it. */
        var meta = A.thingChipMeta ? (A.thingChipMeta(t.b, t) || '') : '';
        /* Whatever mark the atlas puts beside a thing in its pane — dance's
           playmark, saying there is something to watch — belongs on the chip
           too, so the same signal means the same thing in both lists. */
        var glyph = A.thingChipGlyph ? (A.thingChipGlyph(t.b) || '') : '';
        var chip = '<button class="link' + (cls ? ' ' + cls : '') +
          '" data-go="' + esc(t.b) + '">' +
          mark(orderOf[t.b], 10) + glyph + esc(byId[t.b].name) +
          /* the year and the verb are one unit — 1989 and 'made' must never be
             split across two lines of a wrapped title */
          /* The meta is 11px against the title's 12.5px. Sharing a BASELINE is
             typographically tidy and reads as wrong: the smaller text's optical
             centre then sits below the larger one's, which is visible on every
             chip. Giving it the title's line box instead — not its own, which
             is 11 x 1.5 — centres the two on each other, and still pins it to
             the FIRST line of a title that wraps. */
          /* Through T like every other word on the page. It was not, so the
             Japanese page said "made" and "worked at" in English — invisible
             here, because English is what the source string looks like. */
          '<span class="chipmeta" style="color:var(--muted);font-size:11px;white-space:nowrap">' +
          esc(meta ? meta + ' · ' + T(t.verb) : T(t.verb)) + '</span></button>';
        var extra = stacked && A.thingChipExtra ? (A.thingChipExtra(t.b) || '') : '';
        return stacked ? '<div class="thingrow">' + chip + extra + '</div>' : chip;
      }).join('');
      return '<section><h3>' + esc(g.title) +
        ' <span style="color:var(--muted);font-weight:400">' + g.rows.length +
        '</span></h3><div class="' + (stacked ? 'thinglist' : 'links') + '">' + body + '</div></section>';
    }).join('');
  }

  function deedList(id, type) {
    var rows = tiesOf[id].filter(function (t) { return t.type === type; });
    if (!rows.length) return '';
    return '<section><h3>' + T(type === 'violence' ? 'Violence' : 'Other ties') +
      ' <span style="color:var(--muted);font-weight:400">' + rows.length + '</span></h3>' +
      rows.map(function (t) {
        var mine = t.a === id, them = mine ? t.b : t.a;
        var pair = REL_VERB[t.rel] || REL_VERB.aided;
        return '<div class="deed' + (type === 'bond' ? ' bond' : '') + '"><div class="bar"></div><div>' +
          '<div class="deed-head">' +
            '<span class="verb">' + esc(pair[mine ? 0 : 1]) + '</span> ' +
            '<span class="who" data-go="' + esc(them) + '">' + esc(byId[them].name) + '</span>' +
            (t.fatal ? ' <span class="fatal">fatal</span>' : '') +
          '</div>' +
          '<div class="what">' + esc(t.label) + '</div></div></div>';
      }).join('') + '</section>';
  }

  /* Named, not generic: "‹ back to Martha Graham" tells you where the arrow
     goes before you press it, which a bare Back does not. */
  function histLink() {
    var prev = state.hist[state.hist.length - 1];
    if (!prev || !byId[prev]) return '';
    return '<button class="backlink" id="p-hist">‹ ' + T('back to') + ' ' + esc(byId[prev].name) + '</button>';
  }

  function renderPanel() {
    var panel = $('panel-body');
    if (tour.open && !state.sel) { renderChapters(); markChapters(); return; }
    if (!state.sel) { A.renderIntro(panel); wireChips(panel); return; }

    var d = byId[state.sel];
    var ord = TAX.byKey(orderOf[d.id]);
    if (d.thing) { renderThingPanel(panel, d, ord); return; }
    var back = (tour.open
      ? '<button class="backlink" id="p-back">‹ ' + T('back to the chapters') + '</button>' : '') + histLink();
    var direct = (d.parents || []).filter(function (p) { return byId[p]; });
    var kids = kidsOf[d.id].slice().sort(function (a, b) { return byId[a].rank - byId[b].rank; });
    var anc = Object.keys(ancestorsOf(d.id)).length;
    var des = Object.keys(descendantsOf(d.id)).length;
    var P = A.panel;
    var roles = P.roles ? (P.roles(d) || []) : [];

    panel.innerHTML = back +
      '<h2>' + esc(d.name) + '</h2>' +
      (nameOf(d.id).greek ? '<div class="greek">' + esc(nameOf(d.id).greek) + '</div>' : '') +
      (nameOf(d.id).epithet ? '<div class="epithet">' + esc(nameOf(d.id).epithet) + '</div>' : '') +
      (d.aka ? '<div class="aka">' + (P.akaPrefix || '') + esc(d.aka) + '</div>' : '') +
      '<div class="tags">' +
        '<span class="tag">' + mark(ord.key, 12) + esc(ord.label) + '</span>' +
        '<span class="tag">' + String(eraOf[d.id]).padStart(2, '0') + ' ' + esc(TAX.ERAS[eraOf[d.id]].label) + '</span>' +
        (P.tag ? P.tag(d) : '') +
      '</div>' +
        /* Where an atlas records a role LIST rather than a description, the
           roles are facts about the person and belong with the other tags —
           but on their own line under the dates, because a row that runs
           "American modern · 04 Wartime and after · 1919–2009 · Dancer ·
           Choreographer · Director" reads as one long undifferentiated list
           of six things rather than as where-and-when, then what-they-did.
           Greek's domain is a phrase — "God of the sky" — and stays prose. */
        (roles.length ? '<div class="tags roles">' + roles.map(function (r) {
          /* A role may arrive as a bare label or as {label, glyph} — the glyph
             being the same mark the map draws for that role, so the pill and
             the node agree. Only the label is escaped; the glyph is SVG the
             atlas built itself. */
          return '<span class="tag role">' + (r && r.glyph ? r.glyph : '') +
            esc(r && r.label != null ? r.label : r) + '</span>'; }).join('') + '</div>' : '') +
      '<p class="blurb">' + (roles.length ? '' : esc(d.domain) + ' — ') + esc(d.blurb) + '</p>' +
      (d.src ? '<p class="src">Source: ' + esc(d.src) + '</p>' : '') +
      listSection(P.parents, direct) +
      (d.descent ? '<section><h3>Descended from</h3><div class="links">' + chipFor(d.descent) +
        '</div><p class="none" style="margin:6px 0 0">Not a parent — intervening generations are omitted.</p></section>' : '') +
      listSection(P.mates(matesOf[d.id].length), matesOf[d.id]) +
      listSection(P.kids, kids) +
      deedList(d.id, 'violence') +
      deedList(d.id, 'bond') +
      /* Works and places were one list called "Objects and places", which asked
         the reader to sort a choreographer's pieces from the studios she taught
         in by reading the names. They are different questions, so they are now
         different sections — and an atlas that can show a work (dance has
         footage) gets to hang it under the work's own chip. */
      thingSections(d) +
      /* An atlas may have something of its own to hang on a person — dance
         puts the archive links that let you watch them here. */
      (A.personPanelExtra ? A.personPanelExtra(d) : '') +
      '<section><h3>' + T(P.lineHeading) + '</h3><p class="none">' + P.lineText(anc, des) + '</p></section>' +
      '<div class="panel-actions">' +
        '<button class="btn" id="p-focus">' + (state.focus === d.id ? T('Show everyone') : T(P.isolate)) + '</button>' +
        '<button class="btn" id="p-centre">' + T(P.frame) + '</button>' +
        (P.traceLabel && direct.length
          ? '<button class="btn" id="p-trace">' + (state.trace ? T('Stop tracing') : T(P.traceLabel)) + '</button>'
          : '') +
      '</div>';

    wireChips(panel);
    wirePanelExtras(panel);
    var pb = $('p-back');
    if (pb) pb.addEventListener('click', function () { select(null); });
    var pf = $('p-focus'), pc = $('p-centre'), pt = $('p-trace');
    if (pf) pf.addEventListener('click', function () { setFocus(state.focus === d.id ? null : d.id); });
    if (pc) pc.addEventListener('click', function () { fitTo(lineageSet(d.id)); });
    /* The trace lights exactly the chain upward — the figure and everyone the
       teaching (or blood) line passes through on the way to its root — and
       frames it. Ailey back to Horton; all of butoh back through Hijikata to
       Wigman. lineageSet answers "who is connected"; this answers "how did it
       get here". */
    if (pt) pt.addEventListener('click', function () {
      if (state.trace) { state.trace = null; highlight(); renderPanel(); return; }
      var chain = new Set([d.id]);
      Object.keys(ancestorsOf(d.id)).forEach(function (k) { chain.add(k); });
      state.trace = chain;
      highlight();
      fitTo(chain);
      renderPanel();
    });
  }

  /* Objects and places have no parents, consorts or children — only the figures
     they belong to, which is the whole of their entry. */
  function renderThingPanel(panel, d, ord) {
    var rows = tiesOf[d.id].filter(function (t) { return t.type === 'thing'; });
    var thingRoles = (A.panel && A.panel.thingRoles) ? (A.panel.thingRoles(d) || []) : [];
    panel.innerHTML =
      (tour.open ? '<button class="backlink" id="p-back">‹ ' + T('back to the chapters') + '</button>' : '') +
      histLink() +
      '<h2>' + esc(d.name) + '</h2>' +
      /* A figure's panel tags its birth year; a work's said only which era it
         landed in, so the reader had to read the blurb to learn when. */
      /* A thing sits on the row of the figure it hangs from, and inherited that
         figure's era with it — so a 1999 piece was tagged with its maker's
         birth cohort. Where the atlas can date the thing itself, it says which
         era that is; the row is unchanged, because the row is a layout fact. */
      '<div class="tags"><span class="tag">' + mark(ord.key, 12) + esc(ord.label) + '</span>' +
        (function () {
          var e = (A.panel && A.panel.thingEra) ? A.panel.thingEra(d) : null;
          if (e == null) e = eraOf[d.id];
          return '<span class="tag">' + String(e).padStart(2, '0') + ' ' +
            esc(TAX.ERAS[e].label) + '</span>';
        })() +
        /* A thing's domain is a fact about it, not a preface to its prose:
           dance keeps a work's survival there and a place's city. Where the
           atlas turns them into pills, the blurb drops the prefix. */
        (thingRoles.length ? thingRoles.map(function (r) {
          return '<span class="tag ' + esc(r.cls || '') + '">' +
            esc(r.label != null ? r.label : r) + '</span>'; }).join('') : '') +
        ((A.panel && A.panel.thingTag) ? A.panel.thingTag(d) : '') + '</div>' +
      '<p class="blurb">' + (thingRoles.length ? '' : esc(d.domain) + ' — ') + esc(d.blurb) + '</p>' +
      (d.thing && d.thing.src ? '<p class="src">Source: ' + esc(d.thing.src) + '</p>' : '') +
      (A.thingPanelExtra ? A.thingPanelExtra(d) : '') +
      /* The people and whatever the atlas wants BESIDE them go in one wrapper,
         so the two can sit as columns where there is room and stack where
         there is not. Dance puts a company's works there: a troupe is its
         people and its repertory, and reading one under the other makes the
         second look like a footnote to the first. */
      '<div class="thingcols">' +
      '<section><h3>' + esc(T((A.panel && A.panel.thingPeopleHeading &&
        A.panel.thingPeopleHeading(d)) || 'Held, made and sought by')) +
      ' <span style="color:var(--muted);font-weight:400">' +
      rows.length + '</span></h3>' +
      rows.map(function (t) {
        /* The span belongs beside the verb, not below it: "taught at" and
           "taught at, 1934–1978" are different claims, and the second is the
           one the record supports. `A.panel.tieExtra` hangs whatever else the
           atlas knows about this one spell under the line — dance puts what
           the record says and who says it. */
        var span = A.panel && A.panel.tieSpan ? (A.panel.tieSpan(t) || '') : '';
        var extra = A.panel && A.panel.tieExtra ? (A.panel.tieExtra(d, t) || '') : '';
        return '<div class="deed bond"><div class="bar"></div><div>' +
          '<div class="deed-head"><span class="verb">' + esc(T(t.verb)) + '</span> ' +
          '<span class="who" data-go="' + esc(t.a) + '">' + esc(byId[t.a].name) + '</span>' +
          (span ? ' <span class="span">' + esc(span) + '</span>' : '') + '</div>' +
          extra + '</div></div>';
      }).join('') + '</section>' +
      (A.thingPanelBeside ? (A.thingPanelBeside(d) || '') : '') + '</div>' +
      /* After the roster and outside its two columns, because it is about the
         roster rather than part of it: whom the record puts here that this map
         does not hold. */
      (A.thingPanelAfter ? (A.thingPanelAfter(d) || '') : '');
    /* `.who` carries data-go, so wireChips already has it — this used to wire
       a second click listener onto every name here and run the whole selection
       twice per press. */
    wireChips(panel);
    wirePanelExtras(panel);
    var pb = $('p-back');
    if (pb) pb.addEventListener('click', function () { select(null); });
  }

  /* The history link and whatever the atlas hung under its chips. Both panels
     call this, so neither can forget one of them. */
  function wirePanelExtras(panel) {
    var hb = panel.querySelector('#p-hist');
    if (hb) hb.addEventListener('click', goBack);
    if (A.wireChipExtras) A.wireChipExtras(panel);
    measureHead();
    measureVideo();
  }

  /* Anything sticking BELOW the section heading has to know how tall it is, and
     28px was a guess — the heading measures 27.5, which left a half-pixel of
     the page showing through between the two bars. Measured rather than
     assumed, because the true height moves with the font: the Japanese heading
     is not the same height as the English one. Rounded DOWN so the two overlap
     by a fraction instead of parting by one, since an overlap of identical
     backgrounds is invisible and a gap is not. */
  function measureHead() {
    var body = $('panel-body');
    var h3 = body && body.querySelector('h3');
    if (!h3) return;
    var h = Math.floor(h3.getBoundingClientRect().height);
    if (h > 0) document.documentElement.style.setProperty('--headh', h + 'px');
  }

  /* How far down the panel the pinned film reaches, so everything else that
     sticks can sit below it instead of under it. Measured rather than assumed,
     for the reason `--headh` is: the player's height follows the panel's width,
     which the reader can change, and the same hardcoded guess that left a
     half-pixel seam under the section headings would leave a whole video's
     worth of one here. Zero when the tour is shut or the player never arrived,
     and zero on a phone, where the pinning is off. */
  var videoRO = null;
  function measureVideo() {
    var v = $('panel-video');
    var on = v && !v.hidden && !document.body.classList.contains('compact');
    var h = on ? Math.round(v.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty('--tourtop', h + 'px');
    if (on && !videoRO && window.ResizeObserver) {
      videoRO = new ResizeObserver(function () { measureVideo(); });
      videoRO.observe(v);
    }
  }

  function tieSample(type) {
    if (type === 'thing') {
      return '<svg width="18" height="9" aria-hidden="true">' +
        '<line x1="0" y1="3" x2="17" y2="3" stroke="var(--tie-object)" stroke-width="1.4" stroke-dasharray="2 2"/>' +
        '<line x1="0" y1="7" x2="17" y2="7" stroke="var(--tie-place)" stroke-width="1.4" stroke-dasharray="5 2"/>' +
        '</svg>';
    }
    var colour = type === 'violence' ? 'var(--tie-violence)'
      : type === 'bond' ? 'var(--tie-bond)'
      : type === 'union' ? 'var(--tie-union)' : 'var(--rule)';
    var dash = type === 'descent' ? '1 4' : type === 'union' ? '6 4'
      : type === 'violence' ? '5 3' : type === 'bond' ? '1 3'
      : type === 'thing' ? '2 2' : '';
    var head = (type === 'blood' || type === 'descent' || type === 'violence' || type === 'thing');
    return '<svg width="18" height="9" aria-hidden="true">' +
      '<line x1="0" y1="4.5" x2="' + (head ? 12 : 18) + '" y2="4.5" stroke="' + colour +
      '" stroke-width="1.4"' + (dash ? ' stroke-dasharray="' + dash + '" stroke-linecap="round"' : '') + '/>' +
      (head ? '<path d="M11,2 L17,4.5 L11,7 Z" fill="' + colour + '"/>' : '') + '</svg>';
  }

  /* ---------------------------------------------------------------- roster */

  function renderRoster() {
    var q = state.query.trim().toLowerCase();
    var vis = visibleIds();
    var list = $('rosterlist');
    var html = '';
    var shown = 0;

    TAX.ORDERS.concat(TAX.LAYERS).forEach(function (o) {
      var rows = ALL_NODES.filter(function (d) {
        return orderOf[d.id] === o.key && vis.has(d.id) && (!q || matchesQuery(d, q));
      }).sort(function (a, b) {
        return degreeOf[b.id] - degreeOf[a.id] || a.name.localeCompare(b.name);
      });
      if (!rows.length) return;
      shown += rows.length;
      html += '<div class="roster-group">' + esc(o.plural) + '</div>';
      html += rows.map(function (d) {
        return '<button class="roster-row" data-go="' + esc(d.id) + '">' +
          mark(o.key, 11) +
          '<span class="nm">' + esc(d.name) + '</span>' +
          '<span class="ct">' + degreeOf[d.id] + '</span></button>';
      }).join('');
    });

    list.innerHTML = shown ? html : '<div class="roster-empty">No figure matches that.</div>';
    list.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-go');
        if (state.sel === id) { select(null); return; }   // press again to let go
        if (state.view === 'table') { select(id); return; }
        state.sel = id; syncHash(); highlight(); renderPanel();
        centreOn(id);
      });
    });
    markRoster();
  }

  function markRoster() {
    document.querySelectorAll('.roster-row').forEach(function (b) {
      var on = b.getAttribute('data-go') === state.sel;
      if (on) b.setAttribute('aria-current', 'true');
      else b.removeAttribute('aria-current');
    });
  }

  /* ----------------------------------------------------------------- table */

  var relNames = function (ids) {
    return ids.map(function (i) { return byId[i] ? byId[i].name : i; }).join(', ');
  };

  function renderTable() {
    if (!$('tablewrap')) return;
    var vis = visibleIds();
    var q = state.query.trim().toLowerCase();
    var rows = DATA.filter(function (d) {
      return vis.has(d.id) && (!q || matchesQuery(d, q));
    });

    var col = state.sort.col, dir = state.sort.dir;
    var keyOf = function (d) {
      var extra = A.table.extraKey && A.table.extraKey(col, d);
      if (extra !== undefined && extra !== null) return extra;
      switch (col) {
        case 'level': return eraOf[d.id] * 100 + depth[d.id];
        case 'depth': return depth[d.id];
        case 'era': return eraOf[d.id];
        case 'order': return TAX.ORDERS.map(function (o) { return o.key; }).indexOf(orderOf[d.id]);
        case 'domain': return d.domain.toLowerCase();
        case 'parents': return relNames(parentsOf(d)).toLowerCase();
        case 'consorts': return relNames(matesOf[d.id]).toLowerCase();
        case 'children': return kidsOf[d.id].length;
        case 'ties': return tiesOf[d.id].length;
        default: return d.name.toLowerCase();
      }
    };
    rows.sort(function (a, b) {
      var ka = keyOf(a), kb = keyOf(b);
      if (ka < kb) return -dir;
      if (ka > kb) return dir;
      return a.name < b.name ? -1 : 1;
    });

    $('tbody').innerHTML = rows.map(function (d) {
      var ord = TAX.byKey(orderOf[d.id]);
      return '<tr>' +
        '<td><span class="nm" data-go="' + esc(d.id) + '">' + esc(d.name) + '</span>' +
          (d.aka ? '<div style="color:var(--muted);font-size:12px">' + esc(d.aka) + '</div>' : '') + '</td>' +
        '<td><span class="ordercell">' + mark(ord.key, 11) + esc(ord.label) + '</span></td>' +
        '<td class="rel">' + String(eraOf[d.id]).padStart(2, '0') + ' ' + esc(TAX.ERAS[eraOf[d.id]].label) + '</td>' +
        '<td class="num">' + A.table.cell4(d) + '</td>' +
        '<td class="rel">' + esc(d.domain) + '</td>' +
        '<td class="rel">' + esc(relNames(parentsOf(d))) +
          (d.descent ? ' <i>(generations omitted)</i>' : '') + '</td>' +
        '<td class="rel">' + esc(relNames(matesOf[d.id])) + '</td>' +
        '<td class="rel">' + esc(relNames(kidsOf[d.id])) + '</td>' +
        '<td class="rel">' + esc(tiesOf[d.id].map(function (t) {
          return (t.a === d.id ? '' : byId[t.a].name + ' ') + t.label +
                 (t.a === d.id ? ' ' + byId[t.b].name : '');
        }).join('; ')) + '</td>' +
      '</tr>';
    }).join('');

    $('tbody').querySelectorAll('[data-go]').forEach(function (n) {
      n.addEventListener('click', function () { setView('map'); select(n.getAttribute('data-go'), true); });
    });

    document.querySelectorAll('thead th').forEach(function (th) {
      var c = th.getAttribute('data-sort');
      if (c === col) th.setAttribute('aria-sort', dir > 0 ? 'ascending' : 'descending');
      else th.removeAttribute('aria-sort');
    });
  }

  document.querySelectorAll('thead th').forEach(function (th) {
    th.setAttribute('tabindex', '0');       // sortable by keyboard, not only mouse
    var sort = function () {
      var c = th.getAttribute('data-sort');
      if (state.sort.col === c) state.sort.dir *= -1;
      else state.sort = { col: c, dir: 1 };
      renderTable();
    };
    th.addEventListener('click', sort);
    th.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sort(); }
    });
  });

  /* ------------------------------------------------------------- selection */

  function syncHash() {
    try {
      if (state.sel) history.replaceState(null, '', '#' + state.sel);
      // the bare pathname would strip ?view= and ?theme= along with the hash
      else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    } catch (e) { /* sandboxed */ }
  }

  /* Click a figure to select it, click it again to let go. Direct relations
     read at full strength, the rest of the line sits behind them at half. */
  /* Both entry points set state.sel — cycle() from a click on the map, select()
     from everything else — so the class is derived from the state rather than
     set at one of them, which is how the first attempt at this missed every
     click on a node. */
  function markSel() { document.body.classList.toggle('has-sel', !!state.sel); }

  function cycle(id) {
    rememberScroll();
    if (state.sel && state.sel !== id) pushHist(state.sel);
    state.sel = state.sel === id ? null : id;
    if (!state.sel) state.hist.length = 0;
    state.trace = null;
    markSel();
    syncHash();
    rosterYieldsTo(state.sel);
    highlight();
    /* Rewind BEFORE the new panel is written, not after. Assigning scrollTop
       forces a synchronous layout, and after renderPanel has replaced the body
       with a fresh document that means laying out the whole new panel inside
       the click handler — on a throttled phone that single line was most of a
       46%-of-selection getBoundingClientRect bill. Beforehand the DOM is still
       clean, the assignment is nearly free, and a container at 0 stays at 0
       when its contents are replaced. Going BACK still restores afterwards
       (line below), because a remembered offset can only be applied once the
       content that has to be that tall exists. */
    restoreScroll(null);
    renderPanel();
  }

  /* Every deliberate move records where it came from. Letting go (id null) is
     not a move to anywhere, so it clears the trail rather than adding to it —
     otherwise Back would walk you through a series of empty panels. */
  function select(id, centre) {
    rememberScroll();
    if (id && state.sel && state.sel !== id) pushHist(state.sel);
    if (!id) state.hist.length = 0;
    state.sel = id;
    state.trace = null;
    /* On a phone the right split depends on what the reader is doing. With
       nothing chosen the panel has nothing to say and the map should have the
       screen; the moment a figure is picked, the panel is the point. The class
       only moves the DEFAULT — a reader who has dragged the grip has said what
       they want, and `--map-h` keeps overriding both. */
    markSel();
    syncHash();
    rosterYieldsTo(id);
    if (id && centre) centreOn(id);
    highlight();
    renderPanel();
  }

  /* Moving to a new figure starts a new page and should start at its top: the
     old behaviour kept the scroll offset, so following a work from halfway down
     a long panel landed you halfway down a short one, often past its end.
     Going BACK is the opposite case — it is a return, and a return should put
     the reader where they were, which is why the offset is saved per figure
     rather than simply reset. */
  var scrollAt = Object.create(null);
  function rememberScroll() {
    var pane = $('panel');
    if (pane && state.sel) scrollAt[state.sel] = pane.scrollTop;
  }
  function restoreScroll(id) {
    var pane = $('panel');
    if (!pane) return;
    pane.scrollTop = (id != null && scrollAt[id] != null) ? scrollAt[id] : 0;
  }

  function pushHist(id) {
    if (state.hist[state.hist.length - 1] === id) return;
    state.hist.push(id);
    // a trail, not a diary: the deep end is never what anyone reaches for
    if (state.hist.length > 24) state.hist.shift();
  }

  function goBack() {
    rememberScroll();
    var id = state.hist.pop();
    if (!id || !byId[id]) return;
    state.sel = id;
    state.trace = null;
    syncHash();
    centreOn(id);
    highlight();
    renderPanel();
    restoreScroll(id);
  }

  function setFocus(id) {
    state.focus = id;
    if (id) state.sel = id;
    syncIsolated();
    applyVisibility();
    if (id) fitTo(lineageSet(id)); else fit();
    renderPanel();
    renderRoster();
  }

  function syncIsolated() {
    var on = !!state.focus;
    $('isolated').hidden = !on;
    $('stagewrap').classList.toggle('isolating', on);
    if (on) $('iso-name').textContent = byId[state.focus].name;
  }

  /* The table is OPTIONAL. An atlas that wants it declares the two buttons and
     the tablewrap in its own html; one that does not simply omits them, and
     everything here goes quiet rather than throwing on a missing id. The dance
     atlas dropped it — nine hundred works and four hundred people are a map,
     and the same rows as a table answered nothing the panes did not. */
  function setView(v) {
    if (v === 'table' && !$('tablewrap')) return;
    state.view = v;
    if ($('v-map')) $('v-map').setAttribute('aria-pressed', String(v === 'map'));
    if ($('v-table')) $('v-table').setAttribute('aria-pressed', String(v === 'table'));
    $('stagewrap').classList.toggle('hidden', v !== 'map');
    if ($('tablewrap')) $('tablewrap').classList.toggle('hidden', v !== 'table');
    if (v === 'table') renderTable(); else applyTransform();
  }

  /* --------------------------------------------------------------- chrome */

  /* Plain click toggles one. Cmd- or Ctrl-click solos it — and solos off again,
     so the same gesture both isolates and restores. */
  function toggleFilter(set, all, key, ev, after) {
    var solo = ev && (ev.metaKey || ev.ctrlKey);
    if (solo) {
      var already = set.size === 1 && set.has(key);
      set.clear();
      (already ? all : [key]).forEach(function (k) { set.add(k); });
    } else if (set.has(key)) {
      if (set.size === 1 && set === state.orders) return;   // never empty the map
      set.delete(key);
    } else set.add(key);
    after();
  }

  function syncChips(attr, set) {
    document.querySelectorAll('[' + attr + ']').forEach(function (b) {
      b.setAttribute('aria-pressed', String(set.has(b.getAttribute(attr))));
    });
  }

  function buildTieChips() {
    var all = Object.keys(TIE_KIND);
    $('tiechips').innerHTML = '<span class="rowcap">' + T('Ties') + '</span>' + all.map(function (t) {
      return '<button class="chip" data-tie="' + t + '" aria-pressed="true" title="' +
        esc(TIE_KIND[t].note) + ' — ⌘-click to show only this">' +
        tieSample(t) + esc(TIE_KIND[t].label) + '</button>';
    }).join('');
    document.querySelectorAll('[data-tie]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        toggleFilter(state.ties, all, b.getAttribute('data-tie'), e, function () {
          syncChips('data-tie', state.ties);
          applyVisibility();
        });
      });
    });
  }

  function buildLayerChips() {
    var all = TAX.LAYERS.map(function (o) { return o.key; });
    $('layerchips').innerHTML = '<span class="rowcap">' + T('Also show') + '</span>' + TAX.LAYERS.map(function (o) {
      return '<button class="chip" data-layer="' + o.key + '" aria-pressed="true" title="' +
        esc(o.note) + '">' + mark(o.key, 11) + esc(o.plural) + '</button>';
    }).join('');
    document.querySelectorAll('[data-layer]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        toggleFilter(state.layers, all, b.getAttribute('data-layer'), e, function () {
          syncChips('data-layer', state.layers);
          if (state.view === 'table') renderTable(); else { applyVisibility(); fit(); }
          renderRoster();
        });
      });
    });
  }

  function buildOrderChips() {
    var all = TAX.ORDERS.map(function (o) { return o.key; });
    $('orderchips').innerHTML = '<span class="rowcap">' + esc(T(A.ordersCaption)) + '</span>' +
      TAX.ORDERS.map(function (o) {
        return '<button class="chip" data-order="' + o.key + '" aria-pressed="true" title="' +
          esc(o.note) + ' — ⌘-click to show only this">' + mark(o.key, 11) + esc(o.label) + '</button>';
      }).join('');
    document.querySelectorAll('[data-order]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        toggleFilter(state.orders, all, b.getAttribute('data-order'), e, function () {
          syncChips('data-order', state.orders);
          if (state.sel && !visibleIds().has(state.sel)) { state.sel = null; syncHash(); renderPanel(); }
          // no re-layout and no refit: the map only thins out
          if (state.view === 'table') renderTable(); else applyVisibility();
          renderRoster();
        });
      });
    });
  }

  function buildCastChips() {
    var mount = CAST && $(CAST.mount);
    if (!mount) return;
    var all = CAST.keys;
    mount.innerHTML = '<span class="rowcap">' + esc(T(CAST.caption)) + '</span>' +
      all.map(function (k) {
        var c = CAST.chip(k);
        return '<button class="chip" data-cast="' + esc(k) + '" aria-pressed="true" title="' +
          esc(c.title) + '">' + (c.glyph || '') + esc(c.label) + '</button>';
      }).join('');
    document.querySelectorAll('[data-cast]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        /* Never empties: with every key off, the only figures left would be the
           ones the atlas could not classify, which reads as a broken filter
           rather than as the honest remainder it is. */
        if (state.cast.size === 1 && state.cast.has(b.getAttribute('data-cast')) &&
            !(e && (e.metaKey || e.ctrlKey))) return;
        toggleFilter(state.cast, all, b.getAttribute('data-cast'), e, function () {
          syncChips('data-cast', state.cast);
          if (state.sel && !visibleIds().has(state.sel)) { state.sel = null; syncHash(); renderPanel(); }
          if (state.view === 'table') renderTable(); else applyVisibility();
          renderRoster();
        });
      });
    });
  }

  /* ---------------------------------------------------------------- search */

  var input = $('q');
  input.addEventListener('input', function () {
    state.query = input.value;
    renderRoster();
    if (state.view === 'table') renderTable();
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      input.value = ''; state.query = ''; renderRoster(); input.blur();
      e.stopPropagation();    // Esc here means the query, never the selection or the tour
    }
    else if (e.key === 'Enter') {
      var first = $('rosterlist').querySelector('[data-go]');
      if (first) first.click();
    }
  });

  /* ------------------------------------------------------------------- tour */

  var TOUR = window.TOUR;
  var tour = { open: false, i: -1, playing: false, timer: null, player: null, poll: null,
               srcKey: null, seekUntil: 0 };
  /* Gated on the chapters, not on the object: an atlas without a tour ships a
     truthy empty stub, and a button over zero chapters once computed
     segments[NaN] and crashed the panel when pressed. */
  var tourReal = !!(TOUR && TOUR.segments && TOUR.segments.length);

  /* A tour may span several films. No single surveyed subject after Greek has
     one source good enough to carry a whole tour — dance wants two films,
     Japan a spine plus a series — so a segment names its source and `at` is a
     time within THAT film. `TOUR.sources = [{ key, youtube, title }]`; a
     single-source tour keeps the old shape (`TOUR.video.youtube`, bare `at`)
     and is normalised here into a one-entry source list. */
  var SOURCES = (tourReal && TOUR.sources && TOUR.sources.length) ? TOUR.sources
    : (tourReal && TOUR.video && TOUR.video.youtube
        ? [{ key: 'main', youtube: TOUR.video.youtube, title: TOUR.title || '' }] : []);
  var srcByKey = Object.create(null);
  SOURCES.forEach(function (s) { srcByKey[s.key] = s; });
  var segSrc = function (sg) { return sg.source || (SOURCES[0] && SOURCES[0].key); };
  tour.srcKey = SOURCES[0] && SOURCES[0].key;

  /* The player is only worth showing if it can actually keep step: every
     passage needs a timestamp against a known source, and the page has to be
     allowed to frame youtube.com at all. Otherwise the tour runs on its own
     timings. */
  var tourTimed = !!(tourReal && SOURCES.length &&
    TOUR.segments.every(function (sg) {
      return typeof sg.at === 'number' && srcByKey[segSrc(sg)];
    }) &&
    /^https?:$/.test(location.protocol));   // YouTube rejects a file:// origin,
                                            // which would mount a dead player

  function fmt(sec) {
    var m = Math.floor(sec / 60), r = sec % 60;
    return m + ':' + String(r).padStart(2, '0');
  }

  function tourGoto(i, seek) {
    if (!tourReal) return;
    var n = TOUR.segments.length;
    tour.i = ((i % n) + n) % n;
    var sg = TOUR.segments[tour.i];

    // `seek` marks a jump the reader asked for — a chapter pressed, or prev and
    // next — as opposed to the tour simply running on into the next chapter
    if (seek) {
      clearMentions();
      // the outgoing chapter's standalone advance would cut the new one short
      clearTimeout(tour.timer);
    }
    state.tourIds = sg.ids.filter(function (id) { return byId[id]; });
    $('z-refit').hidden = !state.tourIds.length;
    highlight();
    renderTourHead();
    markChapters();
    if (!state.sel && state.tourIds.length) fitTo(new Set(state.tourIds));
    if (seek && tour.player && typeof sg.at === 'number') {
      /* A chapter in another film loads that film at its timestamp; mentions
         were already cleared above, so nothing glows on the wrong clock. */
      var sk = segSrc(sg);
      if (sk !== tour.srcKey && srcByKey[sk]) {
        tour.srcKey = sk;
        tour.player.loadVideoById({ videoId: srcByKey[sk].youtube, startSeconds: sg.at });
      } else {
        tour.player.seekTo(sg.at, true);
      }
      /* A seek is not instant, and the clock keeps answering with the OLD
         playhead for a tick or two while the player travels. The poll runs
         every 250ms and would read that stale time, decide the reader is still
         in the chapter they just left, and pull the selection back — and with
         it the map, because a chapter change refits. Sometimes; it depends on
         whether a tick lands in the gap, which is exactly how it was reported.
         So the clock is ignored until it agrees with the reader, or until it
         has had six seconds to and clearly is not going to. */
      tour.seekUntil = Date.now() + 6000;
    }
    if (seek) tourStep();       // re-arm on the new chapter's own duration
  }

  /* A chapter's cast says who the chapter is about; this says who is being
     talked about *right now*. Every second the narrator says a name, that
     figure, object or place gets a short pulse. Only ever driven by the video
     clock; the standalone tour advances on its own timings, which do not
     correspond to anything anyone said. */
  var MENTION_MS = 1700;
  /* After the flash, a quiet ring stays and fades over half a minute, so the
     figures the narrator has been on lately still read as a group — otherwise
     only the one being said right now is visible and the thread of the passage
     is lost between words. */
  var SUSTAIN_MS = 30000;
  var BREATHE_MS = 2400;                     // must match named-breathe in the css

  /* Every sustaining ring breathes on the same beat. A CSS animation starts
     when it is applied, so rings named seconds apart would otherwise drift out
     of phase and the map would shimmer. Winding each one back by however far
     into the current cycle we are puts them all in step. The three delays match
     the three animations in the shorthand: fade, breath, entrance. */
  function syncBreath(el) {
    var ring = el.querySelector('.named-ring');
    if (!ring) return;
    var now = (document.timeline && document.timeline.currentTime) || performance.now();
    ring.style.animationDelay = '0s, ' + (-(now % BREATHE_MS)).toFixed(0) + 'ms, 0s';
  }
  var lastMentionT = -1;
  var flashing = Object.create(null);

  /* Mentions are (id -> seconds) against ONE film's clock. A multi-source
     tour keys them by source — { rebels: { id: [s] } } — and the flat
     single-source shape is normalised into the first source's key, so Greek's
     existing index needs no change. */
  var MENT = (function () {
    var M0 = window.MENTIONS || {};
    var ks = Object.keys(M0);
    if (!ks.length) return {};
    if (Array.isArray(M0[ks[0]])) {
      var o = {}; o[SOURCES[0] ? SOURCES[0].key : 'main'] = M0; return o;
    }
    return M0;
  })();

  function flashMentions(t) {
    var M = MENT[tour.srcKey];
    if (!M) return;
    /* A seek, or the first tick. Start clean: whatever is still glowing was
       named somewhere the reader has just left, and carrying it across would
       claim the narration had said things it has not. */
    if (lastMentionT < 0 || t < lastMentionT || t - lastMentionT > 3) {
      clearMentions();
      lastMentionT = t;
      return;
    }
    var from = lastMentionT, to = t;
    lastMentionT = t;
    Object.keys(M).forEach(function (id) {
      var times = M[id];
      for (var i = 0; i < times.length; i++) {
        if (times[i] > from && times[i] <= to) { pulse(id); break; }
        if (times[i] > to) break;
      }
    });
  }

  function pulse(id) {
    var el = nodeEls[id];
    if (!el) return;
    /* The name lives in the label layer, a sibling of the node — the classes
       go to both, or the bold-on-mention rule never reaches the label. */
    var both = nodeLgs[id] ? [el, nodeLgs[id]] : [el];
    var f = flashing[id];
    if (f) { clearTimeout(f.flash); clearTimeout(f.hold); }
    // restart cleanly, so a re-mention flashes again rather than only extending
    both.forEach(function (n) { n.classList.remove('recent'); n.classList.remove('named'); });
